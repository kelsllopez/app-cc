], "Un bot automatizado accede a una base de datos con la cuenta de administrador de un técnico. ¿Qué principio de gestión de identidades incumple?": ["Cifrado de datos en reposo, porque el bot guarda información sin cifrar", "Disponibilidad, porque el bot consume recursos del servidor de datos", "No repudio, porque el bot firma digitalmente todas sus consultas"], "Un CIRT o CSIRT es:": ["El equipo que administra los respaldos y la recuperación de datos", "El comité que aprueba los cambios en la configuración de los sistemas", "El grupo que audita el cumplimiento de las políticas de la empresa"], "¿Qué es una línea de base de seguridad?": ["Un nivel máximo de protección que ninguna organización puede superar", "Un informe de las amenazas más recientes que afectan a la industria", "Una lista de los activos que se deben respaldar cada semana"], "Después de un cambio o parche, ¿qué verifica una prueba de regresión?": ["Que el sistema consuma menos memoria y energía tras el cambio", "Que los usuarios hayan firmado la aceptación del nuevo parche", "Que el proveedor haya publicado la nota de versión del cambio"], "Una empleada tomará un año sabático. ¿Qué recomienda el administrador de seguridad para su cuenta?": ["Eliminarla y crear una nueva cuando regrese, con permisos distintos", "Dejarla activa con todos sus permisos para evitar solicitudes al volver", "Compartirla con su reemplazo temporal para que no pierda continuidad"], "Por precaución, una empresa decide aplicar el periodo de retención más largo a todos sus datos. ¿Cuál es el problema?": ["Mejora el rendimiento de los sistemas y reduce los costos de almacenamiento", "Elimina la necesidad de clasificar los datos según su sensibilidad", "Garantiza el cumplimiento de todas las normas sin excepciones"], "Un falso positivo en un IDS es:": ["Una alerta que no se genera pese a que ocurre un ataque real", "Un ataque confirmado que el IDS bloquea de forma automática", "Una falla del hardware del sensor que monitorea la red"], "Una intrusión es:": ["Una falla de hardware que interrumpe el servicio de la red", "Un cambio de configuración aprobado por el comité de cambios", "Una auditoría interna que revisa los accesos de los usuarios"], "Una cuenta de servicio no cambia su clave hace cuatro años. ¿Qué falta?": ["Aumentar el ancho de banda asignado a la cuenta", "Cifrar la base de datos a la que accede la cuenta", "Eliminar el registro de actividad de la cuenta de servicio"], "Una actualización legítima de un proveedor de software trae código malicioso y llega a miles de clientes. ¿Qué riesgo ilustra?": ["Riesgo de desastre natural que afecta el centro de datos", "Riesgo interno por un empleado descontento con acceso privilegiado", "Riesgo de obsolescencia por software que llegó a su fin de vida"], "¿Qué es una reversión (rollback) en la gestión de cambios?": ["Instalar la versión más reciente del software sobre la actual", "Registrar el cambio en el sistema de gestión de tickets", "Aprobar el cambio por el comité antes de ejecutarlo"], "¿Hasta cuándo guía el plan de recuperación ante desastres las acciones del personal?": ["Hasta que el atacante sea identificado y presentado a las autoridades", "Hasta terminar el análisis forense y entregar el informe al regulador", "Hasta que se compre el hardware nuevo para todos los sistemas"], "Un evento adverso es:": ["Un evento sin consecuencias, como un inicio de sesión normal", "Un ejercicio de simulación planificado por el equipo de respuesta", "Un cambio de configuración aprobado por el comité de cambios"], "¿Cuál es el objetivo principal de la gestión de incidentes?": ["Eliminar todos los incidentes de seguridad que pueda enfrentar la empresa", "Detectar y castigar a los responsables internos de cada incidente", "Comprar herramientas que bloqueen automáticamente todos los ataques"], "La continuidad del negocio (BC) agrupa:": ["Solo las acciones para restaurar los servidores tras un desastre", "Un conjunto de copias de respaldo almacenadas fuera del sitio", "Los controles técnicos que impiden que ocurra una interrupción"], "Si el RPO de una base de datos de pedidos es de 15 minutos, ¿qué estrategia es adecuada?": ["Copias de respaldo completas realizadas una vez por semana", "Copias en cinta enviadas a una bóveda externa cada mes", "Respaldos diarios guardados en el mismo servidor de la base"], "Una suma de verificación (checksum) sirve para:": ["Cifrar los datos para que nadie más pueda leerlos", "Comprimir el archivo para que ocupe menos espacio", "Autenticar al usuario que descarga el archivo"], "MITRE ATT&CK sirve para:": ["Cifrar las comunicaciones entre sistemas de un mismo marco", "Asignar direcciones IP a los dispositivos de la red", "Clasificar los datos según el nivel de sensibilidad de la empresa"], "Un equipo de TI se agregó al grupo de administradores de dominio para ahorrar tiempo y abrió un adjunto malicioso: el ransomware cifró todo. ¿Qué medida habría limitado el daño?": ["Cambiar la contraseña del administrador de dominio cada noventa días", "Permitir a todo el equipo usar cuentas de administrador permanentes", "Cifrar los adjuntos de correo con una clave compartida del equipo"], "¿Qué suelen tener los gerentes y el personal de relaciones públicas en el plan de DR?": ["Informes técnicos detallados con registros y volcados de memoria", "Credenciales de los administradores para restaurar los sistemas", "Los diagramas de red con los puertos y protocolos utilizados"], "Un curso práctico para desarrollar competencia en una tarea específica, como configurar un firewall, es:": ["Educación (education), orientada a comprender conceptos amplios", "Concienciación (awareness), orientada a recordar riesgos comunes", "Certificación, que acredita conocimientos mediante un examen"], "El inicio de sesión único (SSO) reduce riesgo porque:": ["Elimina la necesidad de usar contraseñas en cualquier sistema", "Permite compartir una misma cuenta entre varios usuarios", "Cifra todo el tráfico entre el usuario y las aplicaciones"], "Cuando un empleado es ascendido o cambia de puesto, sus permisos deben:": ["Mantenerse sin cambios para no interrumpir su trabajo diario", "Ampliarse con los del nuevo puesto y conservar los anteriores", "Eliminarse por completo y crear una cuenta nueva sin historial"], "Un correo urgente del \"CEO\" pide comprar tarjetas de regalo. ¿Qué ataque es?": ["Ransomware que cifra los archivos del equipo de finanzas", "Ataque de denegación de servicio contra el servidor de correo", "Inyección SQL contra la base de datos de la tienda"], "El hash de un archivo como IOC sirve para:": ["Cifrar el archivo para proteger su confidencialidad", "Autenticar al usuario que lo descargó", "Respaldar el archivo en un medio externo"], "Un equipo asocia sus alertas con técnicas de ATT&CK para ver en qué fase está el atacante. ¿Qué logra?": ["Cifrar las alertas para proteger su confidencialidad", "Reducir las alertas bloqueando todos los puertos de la red", "Reemplazar el SIEM por un marco de gestión de configuración"], "La criptografía resistente a la cuántica busca:": ["Algoritmos más rápidos para ejecutarse en computadores cuánticos", "Cifrado que se apoya en la computación cuántica para guardar claves", "Sustituir las claves actuales por contraseñas mucho más largas"], "Un DLP de endpoint detecta un número de tarjeta en un correo saliente hacia un dominio personal. ¿Qué acción es coherente con su propósito?": ["Registrar el envío y permitirlo sin avisar a nadie del equipo", "Cifrar el correo con una clave compartida y enviarlo igual", "Borrar el correo del buzón del usuario sin dejar ningún registro"], "¿Cuál es la secuencia de componentes de un plan de respuesta a incidentes según el material de estudio?": ["Identificación y aislamiento; eliminación de la amenaza; reinicio general; cierre del caso", "Detección; notificación a la prensa; reinicio de los sistemas; auditoría externa", "Prevención; análisis forense; compensación a clientes; revisión anual del presupuesto"], "Una organización mide cuántos empleados completaron su capacitación en seguridad. ¿Qué evalúa?": ["El nivel de cifrado de los datos de los empleados", "La velocidad de respuesta del equipo ante un incidente", "La cantidad de parches aplicados en los servidores"], "¿Qué lección dejó el caso de SolarWinds para la continuidad del negocio y la gestión de riesgos de terceros?": ["Que basta con confiar en los proveedores con certificaciones de calidad", "Que el software de terceros no representa un riesgo si está firmado", "Que conviene concentrar toda la tecnología en un solo proveedor"], "El hospital quiere que una brecha crítica no dependa de una sola vía de comunicación. ¿Qué incluye un buen plan de respuesta?": ["Que el correo electrónico siempre estará disponible durante la crisis", "Que una sola persona concentre todas las comunicaciones del incidente", "Que las comunicaciones se publiquen solo en las redes sociales"], "Un honeypot se despliega para:": ["Reemplazar al firewall en la protección de los servidores", "Cifrar los datos sensibles de los usuarios internos", "Respaldar los archivos críticos fuera de la red"], "El departamento de facturación se incendia. Un análisis de impacto previo mostró que puede pasar una semana sin facturar. La empresa usa un área alterna lista y el servicio al cliente responde consultas. ¿Qué indica?": ["Un fallo del plan de continuidad, porque el área quedó inoperativa", "Una ejecución del plan de recuperación ante desastres de TI únicamente", "Una auditoría exitosa de los controles de seguridad física"], "Un plan de sucesión en roles críticos de seguridad busca:": ["Reducir el costo de los salarios del equipo de seguridad", "Asegurar que todos los cargos críticos los ocupe un solo experto", "Eliminar la necesidad de documentar los procedimientos"], "¿Cuál es el primer paso de cualquier proceso de gestión de activos?": ["Cifrar los activos de información según su valor", "Contratar un seguro que cubra la pérdida de cada activo", "Comprar licencias de software para los activos críticos"], "Un mapa de calor de riesgos sirve para:": ["Programar los respaldos según la criticidad de cada servidor", "Listar las contraseñas débiles detectadas en el dominio", "Medir el ancho de banda disponible en cada sucursal"], "La remanencia de datos se refiere a:": ["Información cifrada que solo puede leerse con la clave original", "Copias de respaldo almacenadas fuera del sitio principal", "Registros de auditoría que se conservan por mandato legal"], "¿Cuál de estos es un componente común de un plan de continuidad del negocio?": ["Un listado de las contraseñas de todos los empleados de la empresa", "Un contrato de seguros que cubre las pérdidas por interrupciones", "Un manual de usuario de las aplicaciones de la empresa"], "Para crear la cuenta de un nuevo empleado de contabilidad, un administrador copia el perfil de un compañero con años en la empresa. ¿Qué riesgo introduce?": ["Falta de cifrado: el perfil copiado no protege los datos de contabilidad", "Exceso de registros: el perfil copiado genera demasiados eventos de auditoría", "Pérdida de disponibilidad: el perfil copiado bloquea las demás cuentas"], "¿Qué puede detectar un IDS de host (HIDS) que un IDS de red (NIDS) no puede?": ["Escaneos de puertos y tráfico entre equipos de distintas redes", "Ataques de denegación de servicio dirigidos a la red completa", "Conexiones sospechosas entre la red interna e internet"], "Un equipo en EOL que sigue en producción debe:": ["Seguir operando sin cambios porque aún funciona correctamente", "Recibir más permisos para que compense la falta de soporte", "Conectarse a internet para descargar parches no oficiales"], "Un atacante guarda hoy tráfico cifrado para descifrarlo cuando existan computadores cuánticos. ¿Qué respuesta lo anticipa?": ["Aumentar la longitud de las contraseñas de los usuarios", "Dejar de cifrar el tráfico para no almacenar datos sensibles", "Cambiar de proveedor de internet para evitar la intercepción"], "Un plan de comunicación de crisis define:": ["Qué firewall se compra y cuándo se renueva su licencia", "Cómo se restauran las bases de datos tras una falla", "Qué clave de cifrado protege las copias de respaldo"], "¿Con qué frecuencia debe probarse el plan de continuidad del negocio?": ["Una vez, al aprobarlo, y solo se revisa si ocurre un desastre", "Cada diez años, junto con la renovación del contrato de seguros", "Únicamente cuando lo exige el regulador, sin otras revisiones"], "Un resumen del mensaje (message digest) es:": ["Una copia comprimida del mensaje original que permite recuperarlo", "Una clave pública que identifica al emisor del mensaje", "Un mensaje cifrado con la clave privada del destinatario"], "Un usuario inicia sesión con usuario y contraseña, y después introduce un código enviado a su teléfono. ¿Qué ilustra?": ["Autenticación de un solo factor con dos contraseñas distintas", "Autenticación biométrica con algo que eres y algo que tienes", "Control de acceso basado en roles con dos aprobaciones"], "La inyección SQL se previene sobre todo con:": ["Cifrar la base de datos completa y cambiar sus contraseñas", "Instalar un firewall de red en el servidor de aplicaciones", "Aplicar parches al sistema operativo cada semana"], "La tasa de falso rechazo (FRR) mide:": ["Cuántos intrusos son aceptados por error como usuarios legítimos", "Cuántas veces falla el lector por problemas de hardware", "Cuántos usuarios se registran correctamente en el sistema"], "La federación de identidades permite:": ["Compartir una misma contraseña entre todas las entidades asociadas", "Eliminar el uso de identidades en los servicios de otras entidades", "Cifrar las credenciales de cada usuario en cada servicio por separado"], "Un gestor de acceso privilegiado (PAM) ayuda a:": ["Cifrar las comunicaciones de los administradores con los servidores", "Bloquear todo acceso administrativo de forma permanente", "Asignar privilegios de administrador a todos los usuarios"], "En un hospital, se descubrió el compromiso 260 días después y el último respaldo estaba infectado. ¿Qué lección ilustra?": ["Que basta con un solo respaldo almacenado en el mismo servidor", "Que los respaldos infectados no afectan la recuperación de datos", "Que la detección tardía no cambia la estrategia de retención"], "¿Qué evita cuentas huérfanas al terminar un contrato?": ["Pedir a cada usuario que avise cuando termine su contrato", "Revisar las cuentas una vez al año durante la auditoría", "Dejar que el administrador elimine las cuentas cuando recuerde"], "¿Qué KRI de gobernanza de parches es más útil?": ["Número total de parches publicados por los fabricantes este año", "Cantidad de empleados capacitados en gestión de parches", "Velocidad promedio de los servidores tras aplicar los parches"], "En control de acceso, el objeto es:": ["La entidad activa que solicita el acceso, como un usuario", "La regla que permite o deniega el acceso solicitado", "El registro de auditoría que guarda cada acceso realizado"], "¿Qué es un CIRT o CSIRT?": ["El equipo que administra los respaldos y la recuperación de datos", "El comité que aprueba los cambios en la configuración de los sistemas", "El grupo que audita el cumplimiento de las políticas de la empresa"], "La FRR (tasa de falso rechazo) mide:": ["Cuántos intrusos son aceptados por error como usuarios legítimos", "Cuántas veces falla el lector por problemas de hardware", "Cuántos usuarios se registran correctamente en el sistema"], "¿Qué medidas se aplican a las cuentas privilegiadas en comparación con las normales?": ["Menos registro y control más laxo para no frenar a los administradores", "Las mismas medidas que reciben las cuentas normales de usuario", "Solo una contraseña más larga, sin cambios en el monitoreo"], "Una prueba paralela de recuperación:": ["Detiene la producción para restaurar los sistemas desde cero", "Solo revisa en papel que existan las copias de respaldo", "Mueve toda la operación al sitio alterno de forma definitiva"], "La retención de registros se basa en:": ["La velocidad del enlace con que viajan los registros", "El fabricante del servidor que genera los registros", "El tamaño del disco disponible en el servidor de logs"], "Un hallazgo de auditoría debe acompañarse de:": ["Una felicitación al equipo auditado por su buena voluntad", "Un nuevo hallazgo que reemplace al anterior sin seguimiento", "La destrucción de las pruebas ya revisadas por el auditor"], "Un técnico vacía la papelera para eliminar datos confidenciales de un disco. ¿Por qué no basta?": ["La papelera cifra los datos y nadie puede leerlos después", "El disco se formatea de forma automática al vaciarla", "Los datos pasan a la nube y se eliminan con el tiempo"], "¿Qué ocurre justo después de que un sujeto se autentica?": ["El sistema vuelve a pedir la contraseña para cada acción posterior", "El sistema borra el registro de la sesión recién iniciada", "El sistema asigna al sujeto los privilegios de administrador"], "Enviar la clave de cifrado por un medio distinto al del mensaje se llama:": ["Cifrado de datos en reposo con la clave maestra del equipo", "Hash de la clave para verificar su integridad durante el viaje", "Firma digital de la clave con la clave privada del emisor"], "Replicar servicios en una región distinta protege principalmente contra:": ["Un virus que infecta los equipos de los usuarios finales", "Un error del usuario al borrar archivos por accidente", "Un ataque de phishing dirigido a los ejecutivos de la empresa"], "Un analista pega código con claves en un asistente de IA público. ¿Qué riesgo materializa?": ["Pérdida de disponibilidad del servicio público de IA", "Falta de no repudio sobre las respuestas del asistente", "Denegación de servicio contra la red interna de la empresa"], "Un exploit es:": ["Un parche que corrige una debilidad conocida del software", "Una debilidad en el diseño de un sistema sin explotarla", "Una política que regula el uso de las aplicaciones"], "Un caso de uso de incidente en un SIEM sirve para:": ["Cifrar los registros que el SIEM recibe de los equipos", "Reemplazar al analista en la revisión de las alertas", "Medir el ancho de banda que consume el SIEM en la red"], "Un IDS basado en anomalías se distingue porque:": ["Solo reconoce ataques que ya están registrados en su base de firmas", "Bloquea todo el tráfico cifrado sin inspeccionarlo", "Funciona únicamente en el equipo donde está instalado"], "Un empleado pasó de Ventas a Finanzas y conserva sus permisos antiguos. ¿Qué riesgo es?": ["Segregación de funciones entre Ventas y Finanzas", "Denegación de servicio por exceso de permisos", "Pérdida de disponibilidad de las cuentas antiguas"], "Todo el equipo de TI comparte la cuenta \"admin\". ¿Qué se pierde primero?": ["Confidencialidad del contenido de los archivos", "Disponibilidad del servidor de administración", "Integridad de las copias de respaldo del equipo"], "El red team se dedica a:": ["Defender la red y bloquear los ataques en tiempo real", "Analizar el cumplimiento de las políticas con auditorías", "Combinar la defensa y el ataque para mejorar ambos equipos"], "¿Qué debe hacerse con los respaldos de los sistemas críticos?": ["Respaldar todo por igual sin priorizar y probarlos solo si hay un desastre", "Guardarlos en el mismo servidor para recuperarlos más rápido", "Cifrarlos y almacenarlos sin verificar nunca que se puedan restaurar"], "¿Qué dato necesita el equipo de seguridad de Recursos Humanos para gestionar bien las identidades?": ["Las contraseñas actuales de cada empleado, para guardarlas en un archivo", "Los salarios y evaluaciones de desempeño del personal", "El historial médico de los empleados para asignar los roles"], "Una empresa guarda los registros de acceso físico y de sistemas. ¿Qué medida es necesaria para que sirvan como evidencia?": ["Almacenarlos en el mismo servidor que protegen, sin copia adicional", "Eliminarlos cada semana para ahorrar espacio de almacenamiento", "Permitir que cualquier usuario los consulte para fines de auditoría"], "Un servidor web ejecuta servicios y protocolos que no necesita. ¿Qué práctica reduce el riesgo?": ["Abrir más puertos para facilitar la administración remota", "Instalar un segundo servidor web con la misma configuración", "Cambiar a diario el nombre del servidor en la red"], "¿Qué ofrece la gestión de acceso privilegiado «justo a tiempo»?": ["Mantener privilegios elevados permanentes para todos los administradores", "Compartir una cuenta administrativa entre varios técnicos de guardia", "Aprobar solo una vez al año la lista de administradores del sistema"], "Un equipo de respuesta ya contuvo el incidente y reanudó operaciones. ¿Qué actividad corresponde a la fase posterior al incidente?": ["Aislar los equipos afectados y bloquear las cuentas comprometidas", "Detectar y analizar los primeros indicios del ataque en el SIEM", "Descargar de internet las herramientas para erradicar la amenaza"], "La concienciación es más eficaz cuando:": ["Se hace una vez al año con una charla de una hora", "Es genérica, igual para todos y sin relación con su trabajo", "Se apoya solo en sanciones para quien comete errores"], "Un plan de continuidad debe revisarse:": ["Solo una vez, cuando se aprueba el plan por primera vez", "Únicamente cuando ocurre un desastre que lo active", "Cada diez años, junto con la renovación de los equipos"], "La redundancia N+1 implica:": ["Dos componentes de reserva por cada componente necesario", "Duplicar cada componente del sistema de forma completa", "Ningún componente extra, solo mantenimiento preventivo"], "¿Por qué conviene estandarizar la documentación de incidentes?": ["Para que cada analista elija su propio formato y orden de trabajo", "Para reducir el número de incidentes que ocurren cada año", "Para evitar que los directivos conozcan los detalles del incidente"], "Un bot es:": ["Un mensaje fraudulento que suplanta a una entidad conocida", "Un ataque que satura la red para impedir el acceso al servicio", "Un virus que se copia a sí mismo dentro de otros archivos"], "Un usuario inicia sesión en Santiago y 10 minutos después en Tokio. ¿Qué señal es?": ["Escalada vertical de privilegios", "Ingeniería inversa del software", "Fuerza bruta contra la contraseña"], "Un directorio central que gestiona usuarios y grupos es:": ["Un firewall que filtra las conexiones entre usuarios", "Un sistema de detección de intrusiones en la red", "Un servidor DNS que traduce nombres a direcciones IP"], "Una anomalía en los registros es:": ["Un ataque confirmado que ya afectó a los sistemas", "Un parche de seguridad pendiente de aplicar", "Una copia de respaldo que falló al verificarse"], "Un tabletop reveló que nadie sabía a quién escalar. ¿Qué acción corresponde?": ["Cancelar los futuros ejercicios para evitar nuevas fallas", "Culpar al analista que no supo a quién escalar", "Eliminar el plan porque no funcionó en la práctica"], "Una buena práctica de protección de contraseñas es:": ["Reutilizar una contraseña corta y fácil de recordar", "Anotar las contraseñas en un papel pegado al monitor", "Compartir la contraseña con compañeros de confianza"], "¿Qué busca la continuidad del negocio (BC)?": ["Evitar que ocurra cualquier interrupción mediante controles técnicos", "Restaurar solo los servidores y las bases de datos dañados", "Detener las operaciones hasta que todo vuelva a la normalidad"], "Un sistema se reinicia y vuelve a operar en minutos. ¿Cuándo una organización debe pasar de seguir el plan de incidentes a activar la continuidad del negocio?": ["Cuando el sistema se reinicia por completo, aunque vuelva rápido", "Cuando el equipo de TI decide cambiar el antivirus corporativo", "Cuando se detecta el primer evento de seguridad en el SIEM"], "Un empleado pega datos confidenciales de clientes en un asistente de IA público. ¿Qué riesgo principal materializa?": ["Pérdida de disponibilidad del servicio público de IA", "Denegación de servicio contra la red interna de la organización", "Falta de no repudio sobre las respuestas que da el asistente"], "Las cuentas y contraseñas de fábrica de un equipo nuevo deben:": ["Mantenerse sin cambios para facilitar el soporte del fabricante", "Compartirse con todos los técnicos de soporte del equipo", "Anotarse en la etiqueta del equipo para no olvidarlas"], "La mesa de ayuda necesita restablecer contraseñas y desbloquear cuentas. ¿Cuál es la mejor práctica?": ["Darles permisos de administrador de dominio para resolver cualquier caso", "Compartir una cuenta administrativa entre todos los técnicos de soporte", "Permitir los restablecimientos sin registrar quién los solicita"], "Los datos de clientes siguen almacenados en discos retirados hace dos años. ¿Qué etapa del ciclo de vida del dato falló?": ["Clasificación: los datos no se etiquetaron al crearse", "Cifrado: los datos no se protegieron durante su transmisión", "Respaldo: los datos no se copiaron antes de retirar los discos"], "Un inventario de activos sirve para:": ["Calcular la velocidad de las conexiones de la red", "Decidir qué clave de cifrado se usa en cada equipo", "Reemplazar la política de seguridad de la empresa"], "Un dashboard ejecutivo útil muestra:": ["Muchas métricas técnicas sin relación con el negocio", "Listas largas de eventos de bajo nivel generadas por los equipos", "Solo gráficos decorativos que cambian cada hora"], "Al contratar a alguien o cambiar su rol, una mejor práctica es:": ["Copiar el perfil de un compañero que ya lleva años en el cargo", "Darle los permisos de administrador mientras se define su rol", "Esperar a que pida accesos y concederlos sin revisar su cargo"], "¿Qué significa el principio de mínimo privilegio?": ["Dar a todos los usuarios el acceso máximo para evitar solicitudes", "Separar tareas críticas entre dos personas distintas", "Cifrar todo el acceso del usuario con una clave única"], "GRC busca principalmente:": ["Reemplazar al equipo técnico por procesos de cumplimiento", "Eliminar todos los riesgos de la organización de forma total", "Centrarse solo en cumplir las leyes sin considerar el negocio"], "Un empleado reporta un correo sospechoso a los 2 minutos. ¿Qué refuerza más esa conducta?": ["Sancionar a quien reporta por interrumpir su trabajo diario", "Eliminar los reportes para evitar falsos positivos", "Reportar solo cuando el correo ya causó un daño real"], "La retención de logs se define:": ["Según el tamaño del disco disponible en el servidor", "Según la marca del software de registros instalado", "Según la preferencia del administrador de cada sistema"], "¿Cuál de estas es una responsabilidad principal del equipo de respuesta cuando ocurre un incidente?": ["Comprar nuevo hardware para reemplazar los equipos afectados", "Capacitar a todo el personal antes de que termine el incidente", "Negociar con el atacante para recuperar la información lo antes posible"], "Un playbook de respuesta permite:": ["Improvisar la respuesta según lo que decida cada analista", "Eliminar la necesidad de documentar los incidentes ocurridos", "Responder a amenazas desconocidas sin ningún procedimiento"], "Un contratista necesita acceso 48 horas a un servidor. ¿Qué práctica es mejor?": ["Compartirle la cuenta de un empleado de planta para ahorrar tiempo", "Una cuenta permanente de administrador para evitar nuevas solicitudes", "Una cuenta temporal sin vencimiento y con permisos amplios"], "Un bot de IA tiene una cuenta de servicio con escritura sobre todo el entorno. ¿Qué corresponde?": ["Dejarlos como están porque el bot necesita autonomía total", "Darle también permisos de administrador por si los necesita luego", "Eliminar el registro de sus acciones para ahorrar almacenamiento"], "¿Qué mide un indicador clave de riesgo (KRI)?": ["El número de empleados que completaron la capacitación anual", "El rendimiento de los servidores durante el horario laboral", "El costo total del programa de seguridad de la empresa"], "Una empresa no tiene requisitos legales ni comerciales para conservar sus registros. ¿A quién conviene consultar primero sobre cuánto tiempo guardarlos?": ["Al proveedor de internet, que guarda copias del tráfico de red", "Al fabricante del software de registros que usa la empresa", "A cada usuario, para que decida qué registros conservar"], "Tras una breve investigación se confirma que la cuenta de ese usuario fue comprometida. ¿Qué ha ocurrido?": ["Un evento que sigue siendo solo un evento y no requiere acción", "Una auditoría programada que terminó con hallazgos menores", "Un falso positivo generado por el sistema de detección"], "¿Para qué sirve un informe periódico de métricas de seguridad dirigido a la alta dirección?": ["Para reemplazar los controles técnicos por reportes impresos", "Para documentar las fallas y buscar al responsable de cada una", "Para cumplir un trámite sin que influya en las decisiones"], "Un administrador quiere cambiar la configuración de un servidor. ¿Cuál es el proceso correcto en gestión de cambios?": ["Hacer el cambio directamente en producción y avisar después", "Probarlo en producción y revisarlo solo si ocurre una falla", "Aprobarlo verbalmente y registrarlo cuando haya tiempo"], "La rotación obligatoria de puestos ayuda a:": ["Reducir el costo de las capacitaciones del personal", "Aumentar la cantidad de contraseñas que cada empleado recuerda", "Asegurar que cada persona conserve siempre su mismo cargo"], "En la verificación biométrica, el usuario:": ["Debe memorizar una contraseña que el lector compara con la base", "Introduce un código enviado por SMS al teléfono registrado", "Firma un documento con su clave privada ante el sistema"], "Una empresa descubre que sus empleados pegan datos de clientes en asistentes de IA públicos. ¿Qué medida de concienciación aborda mejor la causa?": ["Prohibir a los empleados usar cualquier servicio de internet", "Ignorar el problema porque el asistente solo procesa texto", "Instalar un nuevo antivirus en los equipos de los empleados"], "Un playbook actualizado incluye pasos para phishing generado por IA. ¿Qué aporta?": ["Un cifrado más fuerte de los correos que reciben los empleados", "Eliminar toda necesidad de participación humana en la respuesta", "Mayor ancho de banda para la red durante los ataques"], "¿Qué mide la redundancia N+1?": ["Dos componentes de reserva por cada componente necesario", "Duplicar cada componente del sistema de forma completa", "Ningún componente extra, solo mantenimiento preventivo"], "¿Cuál es el puerto seguro para IMAP?": ["143 (IMAP sin cifrar)", "995 (POP3S con SSL/TLS)", "465 (SMTPS para correo saliente)"], "Según el material, ¿una VPN es siempre un túnel cifrado?": ["Sí: toda VPN cifra siempre el tráfico sin importar la configuración", "No: una VPN solo conecta redes locales dentro del mismo edificio", "Sí: el cifrado es obligatorio en el estándar de cualquier VPN"], "¿Qué pilar de la tríada CIA protege principalmente un generador de respaldo?": ["Confidencialidad, porque impide que se lea la información al fallar la red", "Integridad, porque evita que los datos se alteren durante una caída", "No repudio, porque registra quién apagó los sistemas durante el corte"], "¿Qué describe una VPN?": ["Un dispositivo que filtra el tráfico entre dos redes con reglas fijas", "Un protocolo que asigna direcciones IP automáticamente a los equipos", "Un método que cifra los datos guardados en el disco duro del usuario"], "Una cerradura de puerta en un archivo con documentos sensibles contribuye a:": ["La disponibilidad, porque asegura que los documentos estén siempre accesibles", "El no repudio, porque registra quién abrió el archivo y cuándo lo hizo", "La confidencialidad únicamente, porque no puede evitar cambios en el archivo"], "¿Qué debe acompañar a cada política de seguridad para que sea efectiva?": ["Solo un título claro y la fecha en que fue aprobada por la dirección", "Un resumen técnico con los protocolos y puertos que se deben configurar", "Un manual de usuario con capturas de pantalla de cada sistema"], "¿Qué busca el diseño ambiental para prevenir el delito (CPTED)?": ["Instalar cámaras y alarmas que detecten a los intrusos en tiempo real", "Usar cifrado en los datos de los edificios para evitar su lectura", "Contratar guardias armados que patrullen el perímetro las 24 horas"], "¿Cuál es el puerto seguro para LDAP?": ["389 (LDAP sin cifrar)", "443 (HTTPS)", "993 (IMAPS)"], "Una pyme contrata a un proveedor que monitorea su firewall y clasifica los eventos de seguridad. ¿Qué tipo de servicio es?": ["Servicio de nube pública que aloja las aplicaciones de la pyme (SaaS)", "Servicio de copias de seguridad automatizadas que restaura los equipos", "Servicio de auditoría externa que certifica el cumplimiento normativo"], "Una empresa permite que los empleados usen sus teléfonos y portátiles personales para trabajar. ¿Qué desafío plantea?": ["Pierde el control del cifrado de las comunicaciones de la red corporativa", "Pierde la capacidad de realizar copias de respaldo en la nube", "Queda sin posibilidad de aplicar cualquier control de acceso a la red"], "Dos bases de datos de una empresa muestran direcciones distintas para el mismo cliente. ¿Qué aspecto de la integridad falla?": ["Disponibilidad del servicio ante fallas de hardware en los servidores", "Confidencialidad de la base de datos frente a accesos externos", "No repudio de las modificaciones hechas por cada usuario"], "¿Qué documenta un SLA en la nube?": ["Solo el precio mensual del servicio y la forma de pago acordada", "El diseño de la arquitectura interna de los servidores del proveedor", "Las contraseñas de acceso del cliente y los roles de sus administradores"], "Un firewall mal configurado deja pasar un ataque, pero la segmentación y la detección en el equipo lo frenan. ¿Qué principio quedó demostrado?": ["Mínimo privilegio: cada usuario recibe solo los permisos que necesita", "Separación de funciones: dos personas aprueban cada cambio crítico", "Confianza cero: nunca se confía en ningún usuario ni dispositivo"], "La seguridad adecuada se define como:": ["Seguridad total que elimina cualquier riesgo de pérdida o mal uso", "Seguridad máxima aplicada por igual a todos los activos de la organización", "Seguridad que se limita a cumplir las leyes sin considerar el riesgo"], "El puerto 80 se asocia con:": ["HTTPS, con cifrado TLS", "FTP, para transferencia segura de archivos", "SSH, para administración remota cifrada"], "¿Qué es una VLAN?": ["Una red de área amplia que conecta sedes en distintas ciudades", "Un túnel cifrado entre dos oficinas a través de internet", "Un tipo de firewall que filtra los paquetes de la red local"], "Un centro de datos combina una cerradura en la puerta, reglas técnicas que bloquean el acceso por red y una política que define quién está autorizado. ¿Qué estrategia ilustra?": ["Mínimo privilegio: cada usuario accede solo a lo que necesita", "Separación de funciones: dos personas aprueban cada acceso crítico", "Confidencialidad: todos los datos se cifran antes de guardarse"], "La inteligencia artificial es:": ["Un programa que ejecuta siempre las mismas instrucciones sin aprender", "Un conjunto de reglas fijas escritas por programadores para cada caso", "Una base de datos que almacena grandes volúmenes de información"], "Un cortafuegos es un dispositivo que:": ["Detecta los ataques en la red interna y los bloquea siempre", "Cifra las comunicaciones entre dos redes de la organización", "Reemplaza al antivirus en la protección de los equipos finales"], "Tras una brecha, ¿qué evidencia demuestra mejor el debido cuidado?": ["Un informe con la lista de los incidentes ocurridos el año anterior", "La compra reciente de nuevas herramientas de seguridad", "La opinión del director sobre la seguridad de la empresa"], "Cuando los datos descienden por las capas del modelo OSI, ¿qué ocurre?": ["Se desencapsulan: cada capa quita su encabezado antes de enviar", "Se cifran por completo en cada capa del modelo", "Se comprimen en cada capa hasta ocupar un solo paquete"], "Un WAF protege principalmente:": ["El tráfico entre redes internas de la empresa en cualquier protocolo", "Los correos de los usuarios contra el phishing y el spam", "Las conexiones de acceso remoto de los empleados por VPN"], "Un visitante debe registrarse y recibir una credencial temporal antes de entrar. ¿Qué combinación de controles refleja esto?": ["Controles técnicos (firewall) y administrativos (política de claves)", "Controles físicos (puerta) y técnicos (cifrado del enlace de red)", "Solo controles técnicos, porque la credencial es un dato digital"], "En una red inalámbrica, ¿qué riesgo adicional frente a una red cableada es mayor?": ["Que el cifrado de datos es imposible en redes de ese tipo", "Que los cables ofrecen siempre mayor velocidad de transferencia", "Que los dispositivos no pueden autenticarse ante el punto de acceso"], "Un ataque de denegación de servicio busca:": ["Robar información confidencial sin que la víctima lo advierta", "Modificar los datos almacenados sin dejar ningún registro", "Suplantar a un usuario legítimo para ingresar al sistema"], "¿En qué se diferencia la microsegmentación de la confianza cero?": ["Son lo mismo: ambas eliminan los perímetros y confían en los usuarios", "La confianza cero agrega perímetros internos; la microsegmentación protege activos", "La microsegmentación elimina la verificación; la confianza cero la exige solo una vez"], "¿Qué enfoque propone la confianza cero (zero trust)?": ["Confiar en todo lo que esté dentro de la red corporativa y verificar lo externo", "Verificar la identidad una sola vez al inicio y permitir todo después", "Permitir el acceso a cualquier dispositivo que use la VPN de la empresa"], "Un dispositivo personal de un empleado quiere conectarse a la red corporativa. ¿Qué hace un sistema de control de acceso a la red (NAC)?": ["Cifra el tráfico del dispositivo y lo deja conectarse sin más revisiones", "Borra los datos personales del dispositivo antes de permitir su acceso", "Bloquea de forma permanente cualquier dispositivo que no sea de la empresa"], "La privacidad de los datos de una IA se protege con:": ["Cifrado de los datos solo durante su transmisión por la red", "Aumento de la capacidad de procesamiento de los servidores", "Almacenamiento de todos los datos personales sin límite de tiempo"], "Bluetooth es más vulnerable cuando:": ["Está apagado y sin ninguna conexión activa", "Se usa con emparejamiento protegido por PIN y confirmación", "Solo se conecta a dispositivos aprobados por la empresa"], "WPA3 mejora a WPA2 porque:": ["Usa cifrado compartido igual para todos los usuarios de la red", "Reduce el alcance de la señal para evitar intrusiones externas", "Elimina la necesidad de usar contraseñas en la red inalámbrica"], "Un centro de cuidados intensivos instala varios generadores y múltiples proveedores de energía porque no tolera caídas. ¿Qué concepto lo explica?": ["Una tolerancia al riesgo muy alta para el tiempo de inactividad", "Una transferencia del riesgo mediante contratos de seguro", "Una aceptación del riesgo residual sin controles adicionales"], "¿Puede la defensa en profundidad garantizar que no ocurra un ataque?": ["Sí: con varias capas ningún ataque puede completarse con éxito", "Sí: siempre que cada capa use el mismo tipo de control de seguridad", "No: solo sirve para detectar ataques, nunca para prevenirlos ni disuadirlos"], "Una nube comunitaria es:": ["Infraestructura propiedad de una sola organización y de uso exclusivo", "Infraestructura abierta al público general que presta un proveedor", "Combinación de nube privada y pública con datos portables"], "La integridad del sistema se da cuando el sistema:": ["Solo permite el acceso a usuarios autenticados y autorizados", "Mantiene los datos cifrados mientras están almacenados", "Está disponible cuando los usuarios lo necesitan, sin interrupciones"], "Una cadena minorista fue vulnerada por una red inalámbrica insegura y, sin segmentación, el atacante se movió libremente hasta los datos de tarjetas. ¿Qué lección ilustra?": ["Cifrar todas las contraseñas de los empleados con un algoritmo más robusto", "Reemplazar el sistema de pago por uno que no use tarjetas", "Aumentar el número de cámaras de vigilancia en las tiendas"], "Una organización evalúa si un control cuesta más que la pérdida que evita. ¿Qué concepto aplica?": ["Transferencia del riesgo mediante un seguro", "Eliminación del riesgo con controles preventivos", "Aceptación del riesgo sin ningún tratamiento"], "Tras un incidente, el CEO pregunta quién autorizó cada cambio en el ERP. ¿Qué componente de AAA lo permite?": ["Authentication (verificación de la identidad)", "Authorization (permisos asignados al usuario)", "Assurance (nivel de confianza del sistema)"], "¿Qué explota un ataque SYN flood?": ["La resolución de nombres DNS con respuestas falsas", "El cifrado débil de las contraseñas almacenadas", "Los permisos excesivos de un usuario en el servidor"], "Un equipo identifica un servidor sin parches como debilidad y a un grupo criminal interesado en atacarlo. ¿Cómo se relacionan estos elementos con el riesgo?": ["Cada elemento es un riesgo independiente que se trata por separado", "El riesgo depende solo de la vulnerabilidad, sin considerar la amenaza", "El riesgo se elimina cuando existe una amenaza identificada"], "Para reducir el riesgo de Bluetooth en un equipo corporativo conviene:": ["Dejarlo siempre visible para facilitar la conexión de accesorios", "Compartir el código de emparejamiento con todos los empleados", "Usar emparejamiento abierto para evitar bloqueos en el trabajo"], "Un código de conducta profesional obliga a:": ["Priorizar los intereses de la empresa sobre los de las personas", "Seguir las instrucciones de la dirección aunque sean ilegales", "Mantener en secreto las faltas ocurridas dentro del equipo"], "Un equipo estima la probabilidad como alta, media o baja según juicio experto. ¿Qué tipo de análisis es?": ["Análisis cuantitativo que calcula la pérdida anual esperada", "Análisis de impacto en el negocio con tiempos de recuperación", "Análisis forense que reconstruye lo sucedido tras un incidente"], "Un cliente pregunta por qué una IA rechazó su solicitud y nadie puede explicarlo. ¿Qué exigencia falla?": ["Disponibilidad y continuidad del servicio de IA", "Cifrado de los datos de entrenamiento del modelo", "Respaldo periódico de los resultados que produce el modelo"], "La gobernanza, en general, es:": ["El conjunto de herramientas técnicas para proteger la red", "El plan para restaurar los servicios tras un desastre", "La auditoría que revisa si se aplican los controles"], "Un activo de información es:": ["Solo los servidores y equipos físicos de la organización", "Únicamente los documentos impresos en poder de la empresa", "Solo el software con licencia comprado por la organización"], "Un atacante cercano se empareja con el audífono de un empleado visible y sin control. ¿Qué práctica faltó?": ["Cifrar los mensajes enviados desde el audífono", "Usar un volumen más bajo en el dispositivo", "Cambiar el audífono por uno de otra marca"], "Un incidente de seguridad es:": ["Un evento rutinario del sistema que no afecta a nadie", "Una falla del hardware planificada por el fabricante", "Un cambio de configuración aprobado por el comité"], "¿Qué debe respaldar la decisión de aceptar un riesgo residual?": ["La decisión verbal del administrador del sistema afectado", "El informe del proveedor que vendió el sistema", "El visto bueno del equipo técnico sin pasar por la dirección"], "¿Qué preocupación suele plantear el uso de escáneres de retina?": ["Son demasiado lentos y rechazan a la mayoría de los usuarios", "No pueden usarse con personas que usan lentes de contacto", "Dejan los datos en texto plano al almacenarse en el servidor"], "¿Para qué sirve la dirección 127.0.0.1?": ["Conectarse a la puerta de enlace de la red corporativa", "Enviar correo electrónico a un servidor externo", "Acceder al servidor DNS público de la organización"], "Una LAN se caracteriza por:": ["Conectar dispositivos en un área geográfica muy extensa", "Unir redes de distintos países mediante enlaces satelitales", "Cifrar el tráfico entre sedes remotas de una empresa"], "La defensa en profundidad implica:": ["Un único control muy potente que protege todos los activos", "Controles idénticos repetidos que fallan juntos ante un ataque", "Eliminar los controles antiguos al instalar uno nuevo"], "Una empresa aloja su modelo de IA en una nube IaaS. ¿Qué sigue siendo suyo en seguridad?": ["El hardware, el hipervisor y el centro de datos del proveedor", "La seguridad física de las instalaciones donde está la nube", "Todo el entorno, sin responsabilidad del proveedor"], "¿Qué distingue a la privacidad de la confidencialidad?": ["Son sinónimos: ambas protegen la información de cualquier persona", "La privacidad se aplica solo a empresas y la confidencialidad solo a personas", "La confidencialidad es el derecho de la persona a controlar sus datos"], "Un modelo de IA discrimina a solicitantes. ¿Qué requisito se incumple?": ["Disponibilidad del sistema y continuidad del servicio", "Cifrado de datos en reposo y en tránsito", "Autenticación multifactor de los solicitantes del crédito"], "Autorización es:": ["Verificar que una identidad sea quien dice ser", "Registrar las acciones que realizó cada identidad", "Impedir que alguien niegue una acción ya realizada"], "DHCP se encarga de:": ["Traducir nombres de dominio a direcciones IP", "Cifrar el tráfico entre el cliente y el servidor", "Filtrar el tráfico no autorizado entre dos redes"], "Un control disuasivo busca:": ["Detectar al atacante mientras realiza el ataque", "Reparar los daños una vez ocurrido el incidente", "Impedir físicamente el acceso del atacante"], "La dirección 127.0.0.1 se usa para:": ["Conectarse a la puerta de enlace de la red corporativa", "Enviar correo electrónico a un servidor externo", "Acceder al servidor DNS público de la organización"], "La encapsulación en una red consiste en:": ["Cifrar los datos completos antes de enviarlos a la red", "Dividir los datos en bloques de tamaño fijo para su envío", "Quitar las cabeceras de los datos al llegar al destino"], "Una VPN sitio a sitio protege principalmente:": ["El tráfico entre un usuario remoto y la red corporativa", "El tráfico entre dos usuarios que usan el mismo equipo", "El acceso físico a los dos centros de datos de la empresa"], "Los CIS Controls del Center for Internet Security son un ejemplo de:": ["Norma legal obligatoria que sanciona a las empresas", "Certificación que se otorga a los profesionales de seguridad", "Herramienta de software que escanea la red automáticamente"], "Durante un examen de certificación ves que otro candidato hace trampa. ¿Qué corresponde según el código?": ["Ignorarlo, porque no afecta a tu propia certificación", "Confrontar al candidato durante el examen para detenerlo", "Publicarlo en redes sociales para advertir a otros candidatos"], "Una organización usa datos de un escáner de retina para discriminar a candidatas durante la contratación. ¿Qué principio del Código de Ética viola?": ["Prestar un servicio diligente y competente a los mandantes", "Avanzar y proteger la profesión con el ejemplo propio", "Mantener la confidencialidad de los datos de la organización"], "Una brecha de datos es:": ["Una interrupción del servicio causada por un ataque de red", "Una falla de hardware que borra los datos del servidor", "Una copia de respaldo que se pierde en el traslado"], "ISO 27001 y el NIST CSF son ejemplos de:": ["Leyes obligatorias con sanciones penales para quien no cumpla", "Herramientas que bloquean los ataques en tiempo real", "Certificaciones personales que acreditan a los profesionales"], "Un firewall con estado (stateful) se distingue porque:": ["Examina solo las direcciones IP de origen y destino", "Inspecciona el contenido de cada aplicación web", "Funciona únicamente como un filtro por puertos fijos"], "Una entrada con dos puertas, de las cuales solo una se abre a la vez, es un:": ["Torniquete (turnstile) que deja pasar una persona por tarjeta", "Portón vehicular con barrera que se levanta con un código", "Zona desmilitarizada (DMZ) entre la red interna y la externa"], "La debida diligencia con un proveedor crítico incluye:": ["Verificar que el proveedor ofrezca el precio más bajo", "Pedirle que firme una política de uso aceptable genérica", "Revisar su sitio web para confirmar que existe como empresa"], "Las capas de la defensa en profundidad incluyen:": ["Solo el perímetro, con un firewall de última generación", "Solo los datos, cifrados en reposo y en tránsito", "Solo la aplicación, validada con pruebas de seguridad"], "Un auditor compara el estado actual de un servidor con la configuración segura documentada al instalarlo y detecta diferencias. ¿Qué propiedad verifica?": ["Confidencialidad del sistema, midiendo accesos de usuarios", "Disponibilidad del servidor, midiendo tiempos de respuesta", "No repudio de los cambios, usando firmas digitales"], "Dos equipos situados en VLAN distintas necesitan comunicarse. ¿Qué debe intervenir para que lo hagan y se apliquen reglas?": ["Un switch de capa 2, que reenvía las tramas por la dirección MAC", "Un concentrador (hub) que repite el tráfico a todos los puertos", "Un cable cruzado entre ambos equipos que unifica las dos VLAN"], "Un registro de riesgos contiene:": ["Solo las amenazas externas detectadas y su fecha", "Incidentes ya ocurridos y las personas responsables", "Controles instalados y su costo de adquisición"], "Un ataque man-in-the-middle ocurre cuando el adversario:": ["Satura el servicio con tráfico para impedir su uso", "Adivina la contraseña probando combinaciones sucesivas", "Instala un programa que cifra los archivos de la víctima"], "¿Qué ocurre con el tráfico web HTTP en el puerto 80 desde el punto de vista de la seguridad?": ["Viaja cifrado de extremo a extremo y no puede ser espiado", "Viaja cifrado, pero solo si el servidor tiene un certificado", "Se bloquea siempre en los firewalls modernos y no se usa"], "A diferencia de la confidencialidad, la privacidad se centra en:": ["La protección técnica de los sistemas que almacenan los datos", "La disponibilidad de los datos para quien los necesite", "La integridad de los datos durante su transmisión"], "¿Qué debe afirmar un buen SLA de nube respecto a los datos del cliente?": ["La capacidad máxima de almacenamiento contratada", "El horario de las ventanas de mantenimiento del proveedor", "El modelo de facturación mensual aplicado al uso"], "La residencia de datos en la nube se refiere a:": ["Cuánto tiempo se conservan los datos antes de eliminarse", "Qué algoritmo cifra los datos almacenados en el servidor", "Quién tiene permiso de administrar la cuenta del cliente"], "¿Qué control respalda mejor el no repudio de los registros de auditoría?": ["Contraseñas largas para las cuentas de los administradores", "Copias de respaldo diarias en el mismo servidor de logs", "Cifrado de los registros mientras viajan por la red"], "Alguien ofrece dinero a un profesional certificado a cambio de información confidencial de su empresa. ¿Cuál es la respuesta alineada con el código?": ["Aceptarlo si el dinero se destina a un fin legítimo", "Aceptarlo y compartir solo la información menos sensible", "Ignorarlo sin informar para evitar problemas internos"], "Un ejecutivo propone reemplazar el escaneo de vulnerabilidades y la prueba de penetración anuales por solo uno de los dos. ¿Qué argumento es más sólido?": ["Basta con el escaneo, porque la prueba de penetración es redundante", "Basta con la prueba, porque el escaneo solo genera falsos positivos", "Basta con el que sea más barato, porque ambos dan el mismo resultado"], "El vector de amenazas se define como:": ["Los controles técnicos que bloquean al actor de amenazas", "La probabilidad de que una amenaza llegue a materializarse", "El daño económico que sufre la organización tras un ataque"], "IETF e IEEE son organizaciones que principalmente:": ["Auditan el cumplimiento legal de las empresas tecnológicas", "Certifican a los profesionales de seguridad de la información", "Regulan las tarifas de las operadoras de telecomunicaciones"], "Un firewall con aprendizaje automático bloquea un patrón que no coincide con ninguna firma conocida. ¿Qué ventaja ilustra?": ["Reemplazar por completo al analista humano en la detección", "Bloquear solo los ataques que ya figuran en su base de firmas", "Eliminar los falsos positivos en todas las alertas"], "Quien revisa los permisos no debería ser:": ["Un revisor independiente del propietario del recurso", "Un auditor interno ajeno al equipo que solicita", "El responsable de seguridad de la información"], "¿Por qué es importante aplicar parches de forma regular?": ["Porque los parches nuevos eliminan por sí solos todas las amenazas", "Porque los fabricantes los exigen para mantener la garantía", "Porque mejoran siempre el rendimiento del sistema operativo"], "¿Qué riesgo tiene el parcheo desatendido (automático)?": ["Elimina la necesidad de probar los parches antes de instalarlos", "Impide que los parches lleguen a los sistemas de producción", "Reduce el tiempo de exposición a las vulnerabilidades conocidas"], "Bluetooth se usa sobre todo para:": ["Redes de área extensa entre sedes de una misma empresa", "Conexiones inalámbricas de larga distancia entre ciudades", "Transferencia cifrada de datos entre servidores de internet"], "Una DMZ sirve para:": ["Alojar las bases de datos más sensibles de la empresa", "Cifrar el tráfico entre los usuarios y la red interna", "Almacenar las copias de respaldo fuera de la red corporativa"], "La suplantación (spoofing) consiste en:": ["Interceptar una transmisión para leer su contenido", "Saturar el servicio con peticiones de usuarios falsos", "Descifrar una contraseña con ayuda de un diccionario"], "La IA analiza los hábitos de acceso de un usuario para detectar desviaciones. ¿Qué técnica es?": ["Análisis de vulnerabilidades del sistema operativo", "Cifrado asimétrico de las sesiones de usuario", "Respaldo continuo de los registros de acceso"], "Un simulacro de phishing sin aviso previo mide:": ["La velocidad con que los sistemas se recuperan tras un ataque", "El número de vulnerabilidades pendientes en los servidores", "El nivel de cifrado de los correos de la organización"], "La calidad de servicio (QoS) permite:": ["Cifrar el tráfico de los servicios más importantes", "Bloquear los servicios de menor prioridad en la red", "Autenticar a cada usuario antes de su conexión a la red"], "Durante un incidente, la política de manejo de datos define:": ["Cuánto tiempo se conserva cada tipo de factura del cliente", "Qué antivirus se instala en los equipos afectados", "Qué proveedor restaura las copias de respaldo del sistema"], "La IA en un SIEM reduce la fatiga de alertas porque:": ["Elimina las alertas de baja prioridad sin revisarlas", "Bloquea cada evento sospechoso de forma automática", "Cifra los registros antes de enviarlos al analista"], "La trazabilidad exige que:": ["Los registros se conserven el mayor tiempo posible", "Las cuentas compartidas se usen solo en horario laboral", "Los usuarios cambien su contraseña cada treinta días"], "La confidencialidad se ve afectada directamente por:": ["La caída de un servidor por falta de energía eléctrica", "La modificación de un dato por un error de captura", "La saturación de la red por un pico de tráfico legítimo"], "¿Quién define el nivel de riesgo aceptable (tolerancia o apetito) de una organización?": ["El equipo de seguridad, que ejecuta los controles diarios", "El departamento de TI, que administra los sistemas", "El auditor externo, que evalúa el cumplimiento"], "Un servicio de IA falla y no se pueden restaurar sus resultados. ¿Qué faltó en el plan de continuidad?": ["Copias de los correos de los empleados con acceso al servicio", "Documentos de capacitación para el personal que usa ás de los datos tradicionales conviene respaldar:": ["Solo los correos y archivos personales de cada usuario", "Las contraseñas de los usuarios que consultan al servicio", "Los contratos con los clientes que usan el servicio"], "Un empleado pega datos de clientes en un servicio público de IA. ¿Qué riesgo y qué control aplican?": ["Pérdida de disponibilidad; copias de respaldo diarias", "Denegación de servicio; filtrado de tráfico en el firewall", "Fuga de datos; aumento del ancho de banda disponible"], "Un servidor web es:": ["Un software que cifra el tráfico entre navegador y servidor", "Un dispositivo que filtra el tráfico entre dos redes", "Un protocolo que traduce nombres de dominio a direcciones"], "La recuperación ante desastres (DR) se centra en:": ["Mantener las funciones críticas durante la interrupción", "Evitar que ocurra cualquier interrupción del servicio", "Investigar al responsable del desastre y sancionarlo"], "¿Cuál es la diferencia clave entre un IDS y un IPS?": ["El IDS bloquea el tráfico y el IPS solo emite alertas", "Ambos se instalan siempre fuera de la ruta del tráfico", "El IPS analiza solo los registros guardados, sin tráfico en vivo"], "Según el material, ¿qué herramienta identifica y también previene amenazas?": ["Un sistema de detección de intrusos (IDS) pasivo y el log manager", "Un escáner de vulnerabilidades y la lista de activos", "Un firewall de capa 2 y el sistema de respaldo"], "¿Qué ocurriría si una organización define demasiadas clasificaciones de datos?": ["Se reduce el costo de la clasificación para toda la organización", "Se vuelve más fácil proteger cada tipo de dato", "Se necesita menos capacitación para el personal"], "Una fábrica conecta sensores industriales a la red corporativa para mostrar datos en un tablero. ¿Qué diseño reduce más el riesgo de que un fallo de TI llegue a los equipos industriales?": ["Conectar los sensores directamente a la red de oficina", "Usar una sola red para TI y los equipos industriales", "Compartir la contraseña de administración entre ambas redes"], "Una evaluación de impacto en la privacidad se realiza:": ["Después de que ocurre una brecha de datos", "Solo cuando lo exige el regulador tras una multa", "Cada diez años, junto con la auditoría financiera"], "Sabes que una persona certificada filtra preguntas del examen. ¿Qué haces?": ["Ignorarlo, porque no te afecta directamente", "Confrontarlo en privado y pedirle que no lo repita", "Publicar la filtración en redes sociales"], "RBAC se complica cuando:": ["Los usuarios cambian poco de cargo", "Cada cargo tiene un único rol y ninguna excepción", "Se usan roles genéricos para todos los empleados"], "Un plan de tratamiento del riesgo aprobado indica:": ["Qué amenazas existen y cuál es su probabilidad histórica", "Cuánto cuesta cada riesgo identificado", "Qué proveedor es el responsable de cada vulnerabilidad"], "Un sitio alterno que nunca se prueba tiende a:": ["Funcionar mejor porque no se desgasta con el uso", "Volverse innecesario cuando el negocio crece", "Costar menos al mantenerse sin actividad"], "Una transmisión de difusión (broadcast) envía los datos a:": ["Un único dispositivo de destino elegido por dirección", "Solo los dispositivos de otras redes conectadas por un router", "El dispositivo con la dirección más alta del segmento"], "Una persona certificada publica en redes que una empresa competidora «fue hackeada por completo», sin pruebas, para atraer clientes a su consultora. ¿Qué conducta se espera de ella?": ["Difundir la información si ayuda a que los clientes elijan mejor", "Publicar solo lo que beneficie a su consultora, aunque no sea verificado", "Mantenerse callada porque la competencia no es asunto del código"], "Un firewall recibe tráfico entrante que dice venir de una dirección interna de la propia red. ¿Qué debe hacer?": ["Permitirlo, porque la dirección pertenece a la red local", "Permitirlo y registrar el evento para revisarlo después", "Cifrarlo y reenviarlo al servidor de destino"], "El área de TI contrata servicios en la nube y herramientas de IA sin avisar a seguridad ni a cumplimiento. ¿Qué falla de gobernanza evidencia esto?": ["Que el área de TI tiene demasiado presupuesto asignado", "Que la nube y la IA son incompatibles con la seguridad", "Que los empleados no conocen las funciones del área de TI"], "El principio \"fail secure\" significa que ante una falla el sistema:": ["Se apaga por completo y queda sin ningún control activo", "Se mantiene en un estado abierto para no interrumpir el servicio", "Reinicia en modo de prueba y pide una nueva autenticación"], "Repasar el plan de DR en una sala sin ejecutar acciones técnicas es:": ["Prueba de recuperación completa en el sitio alterno", "Prueba paralela con sistemas alternos activos", "Simulación técnica con interrupción real de la producción"], "Los clics en simulacros de phishing bajan de 18% a 6% en un semestre. ¿Qué evidencia esto?": ["Que la empresa dejó de recibir correos de phishing", "Que los empleados ya no abren ningún correo", "Que el filtro de correo bloquea el doble de mensajes"], "El canon \"avanzar y proteger la profesión\" implica:": ["Divulgar las fallas de otros profesionales en público", "Competir con otros profesionales por quién cobra menos", "Abandonar la profesión cuando haya conflictos con clientes"], "Una recertificación de accesos verifica:": ["Que las contraseñas cumplan la complejidad exigida", "Que las cuentas se hayan creado el mismo día", "Que los usuarios usen autenticación multifactor"], "Un parche faltante en un servidor es:": ["Una amenaza", "Un riesgo residual", "Un control compensatorio"], "¿Cuándo asignar privilegios de administrador?": ["Siempre que el usuario lo pida por escrito", "A todo el equipo técnico de forma permanente", "Al ingresar, mientras trabaja en la empresa"], "Durante una prueba física autorizada, la evaluadora lleva una carta firmada por la dirección por si la detienen. ¿Qué propósito tiene?": ["Servir como credencial de acceso a las zonas restringidas", "Reemplazar la autenticación de las personas del edificio", "Eximirla de cumplir las reglas del alcance de la prueba"], "Frente a un zero-day sin parche disponible, ¿qué control compensatorio es más adecuado?": ["Esperar el parche del fabricante sin cambiar la configuración", "Apagar todas las alertas para evitar falsos positivos", "Instalar un segundo antivirus en los equipos de usuarios"], "Un servidor web en la DMZ consulta una base de datos situada al otro lado del firewall. ¿Qué logra esta separación?": ["Que el servidor expuesto se comunique más rápido con la base de datos", "Que los usuarios externos vean la base de datos directamente", "Que los datos viajen siempre sin cifrar entre ambos"], "Un parche para una vulnerabilidad explotada activamente debe:": ["Esperar a la ventana de mantenimiento del trimestre siguiente", "Aplicarse de inmediato en producción sin ninguna prueba", "Ignorarse si el sistema no tiene datos personales"], "Probar palabras comunes contra una cuenta es un:": ["Ataque de fuerza bruta", "Ataque de relleno de credenciales", "Ataque de phishing"], "La transparencia en un sistema de IA implica:": ["Mostrar siempre un resultado idéntico para la misma consulta", "Almacenar todos los datos de entrenamiento sin cifrar", "Entregar el código fuente a cualquier usuario que lo pida"], "Una auditoría se caracteriza por:": ["Un ajuste continuo realizado por el propio equipo que opera", "Un monitoreo automático que reemplaza la revisión humana", "Una prueba técnica que explota las fallas del sistema"], "Una política define si los datos son de uso interno, restringidos a ciertos roles o pueden hacerse públicos. ¿Qué política es?": ["Política de contraseñas", "Política de acceso remoto", "Política de respaldo y recuperación"], "Un escaneo de vulnerabilidades autenticado se diferencia porque:": ["Ve solo lo que un atacante externo podría ver", "No necesita credenciales para revisar el sistema", "Siempre explota las fallas que encuentra"], "Un IDS con IA genera menos falsos positivos al aprender el tráfico normal. ¿Qué debe seguir haciendo el analista?": ["Dejar de revisar las alertas porque el modelo se encarga", "Desactivar el modelo para volver a las firmas tradicionales", "Borrar el tráfico normal ya aprendido por el modelo"], "Una evaluación de riesgos compara alarmas, rociadores y extinción por gas para un centro de datos. ¿Cuál es su objetivo principal?": ["Elegir el sistema de extinción más barato del mercado", "Instalar los tres sistemas para eliminar todo el riesgo", "Cumplir una norma de seguros sin priorizar riesgos"], "Un equipo recibe información sobre las técnicas y los dominios que usa un grupo atacante para anticiparse a sus movimientos. ¿Qué es?": ["Un escaneo de vulnerabilidades en la red interna", "Un registro de eventos generado por el firewall", "Un informe de auditoría interna sobre accesos"], "El modelado de amenazas rinde más cuando se hace:": ["Después del despliegue, cuando se ven los fallos", "Solo al ocurrir un incidente grave en producción", "Una vez al año durante la auditoría"], "Alguien llama haciéndose pasar por el soporte técnico y pide a un empleado su contraseña para «corregir un problema». ¿Qué técnica usa?": ["Phishing por correo electrónico dirigido a toda la empresa", "Smishing por mensajes de texto SMS", "Ataque de denegación de servicio contra la central"], "La integridad de datos significa que:": ["Los datos se pueden consultar siempre que se necesiten", "Solo las personas autorizadas pueden leer los datos", "Nadie puede negar haber realizado una acción"], "Un equipo propone microsegmentación para sus cargas de trabajo en la nube. ¿Qué dificultad práctica debe anticipar?": ["Que el tráfico entre nubes se vuelve ilegible para los usuarios", "Que el costo desaparece al usar segmentos más pequeños", "Que se elimina la necesidad de registros de red"], "Un proxy inverso se ubica:": ["Detrás de los clientes, ocultando su dirección IP al servidor", "Entre dos firewalls, dentro de la zona más interna", "Dentro de cada estación de trabajo de los usuarios"], "El primer paso del proceso de gestión de riesgos es:": ["Aplicar los controles de seguridad a todos los activos", "Aceptar el riesgo residual con aprobación de la dirección", "Monitorear los riesgos ya tratados por el equipo"], "UDP se elige sobre TCP cuando:": ["Se requiere entrega garantizada de todos los paquetes", "Hay que establecer una sesión con confirmación previa", "Se transfieren archivos que no toleran ninguna pérdida"], "Los sistemas de un hospital comparten datos de pacientes entre registro, laboratorio y radiología. ¿Qué debe entender el equipo de DR para poder recuperarlos?": ["Qué proveedor entrega el hardware de cada sistema", "Cuánto cuesta licenciar cada aplicación del hospital", "Quién usa los sistemas cada día y en qué turno"], "Los directivos exigen seguridad al personal, pero se saltan los controles de acceso «porque tienen prisa». ¿Qué efecto tiene eso en la cultura de seguridad?": ["La fortalece, porque demuestran que el tiempo importa más", "No la afecta, porque la cultura depende solo de las políticas", "La mejora, porque simplifican los procesos para todos"], "Un navegador ejecuta cada pestaña en un proceso aislado con permisos mínimos. ¿Qué beneficio de seguridad aporta?": ["Acelera la carga de las páginas al compartir memoria", "Evita que el navegador guarde contraseñas en texto plano", "Impide que las pestañas se comuniquen con internet"], "El riesgo de la biometría como factor es que:": ["Es más lenta que una contraseña común", "Es imposible de usar en un teléfono móvil", "Requiere siempre conexión a internet para funcionar"], "¿Qué asume Zero Trust?": ["Que la red interna es segura y los accesos externos no", "Que los usuarios autenticados ya no necesitan más controles", "Que el perímetro de la red es la mejor barrera disponible"], "Varios clientes comparten la misma infraestructura física, con recursos asignados de forma dinámica y porte para el cifrado de los datos"], "Un KRI de «cuentas privilegiadas sin revisar por más de 90 días» supera su umbral. ¿Qué corresponde?": ["Ignorarlo hasta la próxima revisión anual de políticas", "Subir el umbral para que deje de generar alertas", "Eliminar las cuentas privilegiadas sin avisar a nadie"], "Al contratar a una persona nueva, el gerente solicita:": ["Que el nuevo empleado elija sus propios permisos", "Los mismos permisos de un compañero con más antigüedad", "Permisos de administrador mientras se define su rol"], "La escalada horizontal consiste en:": ["Acceder a recursos de un nivel de privilegio superior", "Obtener permisos de administrador por una falla del sistema", "Instalar una puerta trasera en el servidor"], "Zero Trust elimina la creencia de que:": ["Los usuarios externos son siempre una amenaza", "Los firewalls perimetrales cumplen todas las funciones", "Los dispositivos personales no se pueden proteger"], "Una ley nueva obliga a conservar ciertos registros durante cinco años. ¿Qué componente de GRC se activa primero?": ["Respaldo: copiar los registros en un medio externo cada semana", "Auditoría: revisar por terceros que no se pierda ningún registro", "Riesgo: calcular el costo anual de conservar los registros"], "¿Cuál describe mejor la diferencia entre debida diligencia y debido cuidado?": ["Son sinónimos y describen la misma actividad", "La debida diligencia aplica solo tras un incidente", "El debido cuidado se hace una vez al firmar un contrato"], "La regla 3-2-1 de respaldos indica:": ["Tres copias, tres medios iguales, ninguna fuera del sitio", "Dos copias, tres medios distintos, una en la nube", "Una copia, dos medios distintos, tres sitios remotos"], "La tolerancia al riesgo se distingue del apetito porque:": ["Define el nivel total de riesgo que busca asumir la organización", "Mide el riesgo que queda después de aplicar todos los controles", "Establece el presupuesto máximo para tratar cada riesgo"], "Una auditoría interna se diferencia de una externa en que:": ["La realiza un auditor sin relación con la empresa", "Solo puede hacerla un organismo regulador del Estado", "Se limita a verificar los estados financieros anuales"], "Un contrato con datos de clientes se envía a un proveedor externo. ¿Qué control corresponde a la etapa de compartición del dato?": ["Respaldo diario, cifrado en reposo y control de versiones", "Eliminación segura del documento tras su primer uso", "Clasificación del documento y almacenamiento en el servidor"], "¿Qué propiedad distingue a una función hash criptográfica de un cifrado?": ["Produce un resultado distinto cada vez que se calcula", "Exige una clave privada para poder verificarse", "Genera una salida de tamaño igual al del mensaje original"], "El principio de \"mínimo necesario\" en privacidad exige:": ["Conservar todos los datos disponibles por si se necesitan", "Obtener el máximo de datos para analizarlos más adelante", "Tratar los datos sin límite de tiempo para el negocio"], "La escalada vertical de privilegios consiste en:": ["Acceder a recursos de otro usuario del mismo nivel", "Instalar un programa que registra las teclas pulsadas", "Cambiar la dirección de origen de los paquetes enviados"], "Los respaldos deben probarse porque:": ["Un respaldo no probado siempre se restaura sin errores", "Las pruebas reducen el espacio que ocupan las copias", "La ley exige probar cada copia cada semana"], "Un sistema de IA aprueba menos créditos a un grupo de personas sin una razón válida. ¿Qué principio de gobernanza se incumple?": ["Disponibilidad del sistema de crédito", "Cifrado de los datos de los solicitantes", "Autenticación de los empleados que operan el sistema"], "Una WLAN es:": ["Una red de área amplia que conecta ciudades por satélite", "Una red que usa solo conexiones por cable de cobre", "Una red privada virtual entre sedes de la empresa"], "Un empleado descontento copia información de clientes antes de renunciar. ¿Qué tipo de amenaza es?": ["Amenaza interna no intencional", "Amenaza externa de un grupo criminal", "Amenaza ambiental por falla de infraestructura"], "Nombre completo, RUT y dirección de un cliente son ejemplos de:": ["Información de la empresa protegida por secreto comercial", "Datos anónimos agregados para estadísticas internas", "Información pública publicada en el sitio web"], "El tiempo medio que tarda el equipo en contener un incidente bajó de 12 a 4 horas en seis meses. ¿Qué sugiere ese resultado?": ["Que la empresa ya no necesita registrar los incidentes", "Un empeoramiento que exige reforzar al equipo técnico", "Que bajó la cantidad de incidentes que ocurren cada mes"], "¿Qué medida reduce mejor el riesgo de envenenamiento de un modelo?": ["Aumentar la capacidad de procesamiento del servidor de entrenamiento", "Cifrar el modelo ya entrenado antes de guardarlo", "Entrenar el modelo con la mayor cantidad posible de datos"], "Una multinacional opera en tres países con normas de privacidad distintas. ¿Qué criterio práctico conviene?": ["Aplicar la norma del país donde tiene la sede principal", "Cumplir la normativa del país con menos obligaciones", "Aplicar la normativa distinta en cada oficina sin coordinar"], "Tras un ejercicio de purple team, ¿cuál es el resultado más valioso?": ["Un informe de las vulnerabilidades críticas encontradas en la red", "La demostración de que el equipo rojo logró entrar", "Una lista de los empleados que fallaron las pruebas"], "Un cuadro de mando (scorecard) para el comité de riesgos debe, ante todo:": ["Mostrar todas las métricas técnicas disponibles de cada sistema", "Presentar el detalle de cada incidente con registros completos", "Incluir solo gráficos sin umbrales ni tendencias"], "¿Por qué combinar cifrado simétrico y asimétrico para enviar un archivo grande?": ["El asimétrico cifra rápido los datos y el simétrico protege la clave", "Ambos cifran el archivo dos veces para duplicar la seguridad", "El simétrico firma el archivo y el asimétrico lo comprime"], "Contratas un seguro cibernético tras una brecha. ¿Qué sigue siendo de la organización?": ["La cobertura económica y legal de cualquier daño futuro", "La responsabilidad total, que pasa a la aseguradora", "La obligación de notificar, que cubre la póliza"], "Una evaluación determina que solo dos de las cinco puertas de un archivo necesitan escáner biométrico; las demás se cierran de forma permanente. ¿Qué criterio se aplicó?": ["Instalar el control más caro en todas las puertas por igual", "Eliminar todos los controles de las puertas menos sensibles", "Seguir la recomendación del fabricante del escáner"], "Cada mes un modelo que prioriza reclamos acierta menos porque cambió el comportamiento de los clientes. ¿Qué riesgo es?": ["Pérdida de disponibilidad por falla del servidor", "Fuga de datos por acceso no autorizado", "Envenenamiento intencional de los datos de entrenamiento"], "Antes de aprobar una solicitud de acceso se debe verificar:": ["Que el solicitante lleve más tiempo que sus compañeros en la empresa", "Que el jefe del solicitante tenga permisos de administrador", "Que el permiso lo hayan pedido antes otros usuarios"], "Un cliente pide omitir un hallazgo crítico para cerrar el contrato. Según el Código de Ética ISC2, ¿qué canon prima?": ["Prestar un servicio diligente y competente a los clientes", "Avanzar y proteger la profesión con los cierres de contrato", "Mantener la confidencialidad de la información del cliente"], "Termina el contrato de un consultor. ¿Qué etapa del ciclo de vida de identidades corresponde?": ["Revisión periódica de los permisos", "Definición de roles del nuevo cargo", "Aprovisionamiento de una cuenta temporal"], "Un informe con IOCs y TTP de un grupo atacante es un ejemplo de:": ["Un registro de eventos de un firewall", "Un informe de un escaneo de vulnerabilidades", "Un plan de respuesta a incidentes interno"], "Controles en datos, aplicación, host, red interna, perímetro, seguridad física y políticas forman parte de:": ["La segregación de funciones, con roles distintos", "El control de acceso basado en roles", "La gestión de cambios y configuraciones"], "Un tablero muestra 98 % de equipos con parches, pero omite que los 15 servidores críticos no están parchados. ¿Qué problema de medición ilustra?": ["Que los datos del tablero están desactualizados", "Que el promedio de parches siempre refleja bien el riesgo", "Que los servidores críticos no deberían incluirse en las métricas"], "La destrucción física de medios es adecuada cuando:": ["El medio se reutilizará en otro equipo de la organización", "El medio no contiene datos sensibles o confidenciales", "El medio todavía tiene garantía vigente del fabricante"], "Un cliente pide certificar un control que no probaste. ¿Qué principio prevalece?": ["Cumplir con lo que pide el cliente para mantener la relación", "Priorizar el cierre del contrato sobre la verificación", "Mantener la confidencialidad comercial de la consultora"], "Las cuentas de invitado deberían:": ["Tener los mismos permisos que un empleado de planta", "Estar siempre activas para facilitar las visitas", "Compartirse con todos los proveedores sin vencimiento"], "¿Qué indicador permite avisar a tiempo que un modelo de IA se degrada?": ["Un KPI de cantidad de usuarios que usan el modelo", "Un indicador del costo mensual de servidores del modelo", "Un registro de cuántas veces se reinicia el servicio"], "TLS protege principalmente:": ["Los datos almacenados en el disco duro del servidor", "Los datos que se procesan en la memoria del equipo", "Los archivos guardados en las copias de respaldo"], "Un país multa a quien no notifique una brecha en 72 horas. Para la organización esto es:": ["Una recomendación opcional de buenas prácticas", "Un control técnico para detectar brechas", "Un acuerdo comercial con los proveedores"], "Un evento de seguridad se diferencia de un incidente en que el evento:": ["Siempre es un ataque confirmado a los sistemas", "Es una brecha que compromete datos protegidos",
