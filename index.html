[0,'CIA, AAA, no repudio y privacidad','Confidencialidad: solo lo ve quien debe|Integridad: sin alteración no autorizada (datos y también el sistema)|Disponibilidad: acceso oportuno y confiable|AAA: autenticar (quién eres), autorizar (qué puedes hacer), accounting (qué hiciste)|No repudio: no poder negar una acción (firma digital y registros)|Privacidad: control de la persona sobre el uso de sus datos personales','Disponibilidad no significa 100% del tiempo, e integridad no es solo la de los datos.'],
[0,'Gestión del riesgo','Riesgo = probabilidad × impacto|Pasos: identificar activos y amenazas, evaluar, tratar, monitorear|Tratamientos: evitar, aceptar, mitigar, transferir|Inherente (antes de controles) frente a residual (después)|Cualitativo: alto, medio, bajo; cuantitativo: dinero|Tolerancia al riesgo (también llamada apetito o umbral): el nivel de riesgo que la entidad acepta para lograr su objetivo; lo fija la alta dirección','Transferir mueve el costo económico, no la responsabilidad legal; evitar es dejar la actividad.'],
[0,'Gobernanza: leyes, marcos y políticas','Leyes y regulaciones: obligatorias y con sanciones (protección de datos, notificación de brechas)|Marcos y guías (ISO 27001, NIST CSF): voluntarios salvo que un contrato o ley los exija|Política: dirige y la aprueba la alta dirección|Estándar: requisito obligatorio y específico|Procedimiento: pasos detallados; guía: recomendación','El estándar dice qué se exige; el procedimiento, cómo se hace paso a paso.'],
[0,'Controles de seguridad','Por tipo: técnicos (firewall, cifrado), administrativos (políticas, capacitación), físicos (cerraduras, cámaras)|Por función: preventivo (evita), detectivo (descubre), correctivo (repara), disuasivo (desalienta), compensatorio (sustituye uno inviable)|Defensa en profundidad: varias capas|Un control se describe por su tipo y por su función','Una cámara detecta o disuade, pero no impide la entrada: piensa qué hace en el momento del evento.'],
[0,'Ética y conducta profesional','Cánones ISC2 en orden: 1) proteger a la sociedad, el bien común y la infraestructura; 2) actuar con honor, honestidad, justicia, responsabilidad y legalidad; 3) servicio diligente y competente a los mandantes; 4) promover y proteger la profesión|Debida diligencia: investigar y planificar antes de actuar|Debido cuidado: aplicar medidas razonables de forma continua|Conflicto de interés: declararlo y apartarse de la decisión','Si dos cánones chocan, gana el de menor número: la sociedad antes que el empleador.'],
[1,'GRC y concienciación','GRC integra gobernanza, riesgo y cumplimiento con los objetivos del negocio|Concienciación: atraer atención; capacitación: desarrollar una habilidad; educación: comprensión profunda y criterio|Ingeniería social: phishing, vishing (llamada), smishing (SMS), whaling (ejecutivos), pretexting (escenario falso), quid pro quo (algo a cambio), tailgating (entrar tras otro)|La cultura de seguridad la lidera la dirección y premia el reporte','Sancionar a quien reporta desincentiva el reporte; lo correcto es no hacer clic y reportar.'],

[1,'Métricas, KRI y auditoría','KPI mide desempeño de lo hecho; KRI anticipa que un riesgo crece|Ejemplos: % de activos críticos sin parche, clics en simulacros de phishing|Dashboards y scorecards: pocas métricas alineadas al negocio|Auditoría: revisión independiente; cada hallazgo lleva plan de acción con responsable y plazo|La IA suma KRI propios, como la deriva del modelo (model drift)','Una métrica sin responsable ni umbral no cambia ninguna decisión.'],

[2,'Control de acceso lógico','Mínimo privilegio: solo lo necesario y por el tiempo necesario|Necesidad de saber: la información que la tarea requiere|Separación de funciones: nadie controla un proceso sensible completo; control dual: dos personas actúan juntas|DAC: decide el dueño; MAC: impone el sistema por etiquetas; RBAC: según el rol; ABAC: según atributos como hora, lugar y dispositivo; por reglas: reglas fijas|Sujeto: quien pide acceso; objeto: el recurso','MAC no lo decide el dueño (DAC sí); SoD reparte el proceso, mínimo privilegio limita permisos.'],

const DET=[
'Un hospital cifra las historias clínicas (confidencialidad), usa hashes para detectar cambios en resultados (integridad) y mantiene un generador para no perder acceso en un apagón (disponibilidad). Un ransomware ataca la disponibilidad; un empleado que altera una nota ataca la integridad; una fuga ataca la confidencialidad. AAA en la práctica: iniciar sesión (autenticación), ver solo tu área (autorización) y que quede registro de lo que abriste (accounting), lo que sostiene el no repudio. En IA, envenenar datos de entrenamiento ataca la integridad, y los datos personales usados para entrenar exigen privacidad.',
'Una tienda estima que su web caída 8 horas tiene impacto alto y puede ocurrir 2 veces al año. Opciones: mitigar (segundo servidor), transferir (seguro), aceptar (si el control cuesta más que la pérdida) o evitar (no vender en línea). Tras el control queda el riesgo residual, que la dirección acepta formalmente dentro del apetito de riesgo. El registro de riesgos guarda riesgo, dueño, valoración y tratamiento.',
'Una ley exige notificar brechas en 72 horas (obligatorio). La empresa adopta ISO 27001 como marco (voluntario). Su política dice que los datos personales se cifran; el estándar fija AES-256 y 14 caracteres mínimos en contraseñas; el procedimiento explica paso a paso cómo cifrar un portátil. Cada nivel baja en detalle: política (qué y por qué), estándar (con qué exigencia), procedimiento (cómo), guía (consejo opcional). Gobernanza es que la dirección fije el rumbo, asigne responsables y supervise; no es solo tecnología. Otras guías de referencia: los CIS Controls del Center for Internet Security y las normas ISO.',
'Un guardia en la puerta: físico y preventivo. Una cámara: físico, detectivo y disuasivo. El firewall: técnico y preventivo. El registro de logs: técnico y detectivo. El plan de respuesta a incidentes: administrativo y correctivo. La política de escritorio limpio: administrativo y preventivo. Si no se puede aplicar el control ideal (un equipo industrial que no admite parches), se usa uno compensatorio, como aislarlo en una red segmentada. Los controles se combinan en capas: si uno falla, otro contiene.',
'Te piden omitir un hallazgo crítico para cerrar un contrato: el canon 1 (sociedad y bien común) pesa más que el servicio al cliente (canon 3), así que se reporta por los cauces adecuados. Si un colega certificado filtra preguntas de examen, se reporta según el proceso (canon 4, proteger la profesión). Debida diligencia: antes de contratar a un proveedor crítico evalúas su seguridad. Debido cuidado: después aplicas controles y capacitas de forma continua y lo documentas; esa evidencia demuestra cuidado razonable ante un incidente.',
'Un correo urgente del CEO pide comprar tarjetas de regalo (BEC o whaling). Señales: urgencia, remitente o dominio que no coincide, petición fuera de lo normal. Lo correcto es verificar por otro canal y reportar. Una campaña de carteles es concienciación; un taller para usar el gestor de contraseñas es capacitación; un programa para decidir sobre seguridad es educación. Medir: bajar los clics en simulacros de phishing de 18% a 6% evidencia mejora, no ausencia de riesgo. GRC conecta gobierno, riesgo y cumplimiento con las metas del negocio. Herramientas típicas: registro de riesgos, marcos de controles, plataformas de cumplimiento y dashboards. Protección de contraseñas: largas, únicas, en un gestor, nunca compartidas ni reutilizadas.',
'Facturación tiene MTD de 24 h, RTO de 4 h y RPO de 1 h. Un respaldo cada noche incumple el RPO, porque se pueden perder hasta 24 h de datos. Para un RTO de 4 h conviene un sitio tibio o caliente; uno frío tardaría días. Primero se hace el BIA, que define qué es crítico; luego se diseña el BCP (negocio) y el DRP (TI). Regla 3-2-1: tres copias, dos medios, una fuera del sitio. Un respaldo no probado puede fallar al restaurar. Prueba de mesa: solo se discute; paralela: se activan sistemas alternos sin parar producción; interrupción completa: se cambia de verdad. En IA se respaldan también las configuraciones y los datasets que alimentan el servicio; la deriva del modelo es un riesgo de continuidad.',
'KRI: porcentaje de servidores críticos sin parche hace más de 30 días, que sube antes de una brecha. KPI: porcentaje de incidentes cerrados en plazo, que mide lo ya hecho. Un dashboard ejecutivo útil muestra pocas métricas ligadas al negocio, con umbral y responsable. La auditoría interna la hace personal propio; la externa aporta independencia. Todo hallazgo requiere un plan de acción con responsable y fecha. En IA, un KRI propio es la caída de precisión del modelo (deriva).',
'Sofía pasa de Ventas a Finanzas y conserva sus permisos antiguos: acumulación de privilegios. Se previene con recertificación periódica y un proceso de traslado que retire lo viejo al dar lo nuevo. Al ingresar, el gerente solicita los permisos del rol por un flujo formal, sin copiar el perfil del anterior. Al salir, la baja de RR. HH. dispara el retiro de accesos; si no, quedan cuentas huérfanas, la puerta favorita de los atacantes. La cuenta de servicio de un bot de IA necesita dueño, permisos mínimos, rotación de claves y revisión, como cualquier identidad.',
'Quien registra proveedores no puede aprobar sus pagos (separación de funciones); un pago alto exige dos aprobadores (control dual). Un directivo que solo lee reportes recibe solo lectura (mínimo privilegio y necesidad de saber). En DAC el dueño de un archivo decide quién lo abre; en MAC un sistema central impone etiquetas (por ejemplo, secreto) que nadie puede cambiar; en RBAC el rol analista SOC trae un paquete de permisos; en ABAC la decisión usa atributos (hora, ubicación, dispositivo); el acceso por reglas aplica condiciones fijas. Sujeto: quien pide; objeto: el recurso.',
'Contraseña más PIN son dos cosas que sabes: no es MFA. Contraseña más OTP de una app (sabes y tienes) sí lo es, y una llave de seguridad resiste el phishing. En un lector de huella, la inscripción guarda la plantilla y la verificación compara. FAR alto deja pasar impostores; FRR alto rechaza usuarios legítimos. Las contraseñas se guardan como hash con sal. Credential stuffing prueba credenciales filtradas de otros sitios; se defiende con MFA y claves únicas. Un login en Santiago y otro 10 minutos después en Tokio es un viaje imposible: se bloquea o se pide verificación.',
'Encapsulación: tu navegador crea datos (aplicación); TCP los parte en segmentos con puertos (transporte); IP añade direcciones y forma paquetes (red); Ethernet añade MAC y forma tramas (enlace); la tarjeta envía bits (física). El receptor hace lo inverso. Un router decide por IP (capa 3) y un switch por MAC (capa 2). Ping usa ICMP (red). El handshake SYN, SYN-ACK, ACK es de TCP. Puertos: 22 SSH, 25 SMTP, 53 DNS, 80 HTTP, 443 HTTPS, 3389 RDP. Telnet y FTP envían credenciales en claro; SSH y HTTPS las cifran.',
'Un SYN flood deja conexiones a medias hasta agotar al servidor (disponibilidad): un IPS en línea lo mitiga, un IDS solo alertaría. Un evil twin en una cafetería provoca alertas de certificado: es un man-in-the-middle, y se evita con VPN y WPA3. Un WAF filtra SQL injection en el tráfico web. Una VPN sitio a sitio cifra el tráfico entre dos redes. Una cámara IoT con clave de fábrica acaba en una botnet: se cambia la clave y se aísla en su propia VLAN. En una planta ICS un parche mal probado puede parar la producción: se prioriza la disponibilidad y el aislamiento. Bluetooth: se desactiva si no se usa y se evita el emparejamiento abierto.',
'Una clínica pone su resonador en una VLAN aislada con reglas estrictas hacia recepción: un malware en recepción ya no llega al equipo médico. La DMZ aloja el servidor web expuesto, separado de la red interna. La microsegmentación aplica políticas entre cargas de trabajo (por ejemplo, desarrollo de IA y producción). Defensa en profundidad: si falla el firewall, aún hay segmentación, MFA, cifrado y monitoreo. Zero Trust: cada solicitud se verifica por identidad, dispositivo y contexto, con mínimo privilegio, aunque venga de la red interna.',
'Una empresa migra su ERP a SaaS y cree que el proveedor lo controla todo; semanas después un exempleado sigue entrando: la gestión de identidades y accesos era suya. En IaaS el cliente parcha el sistema operativo de la VM; en PaaS gestiona sus aplicaciones y datos; en SaaS, sobre todo datos y accesos. Elasticidad rápida: sube y baja capacidad con la demanda. Servicio medido: pagas lo consumido. Nube privada: dedicada a una organización; comunitaria: la comparten organizaciones afines; híbrida: mezcla. Residencia de datos: dónde se guardan y qué leyes aplican.',
'Los datos de pacientes (PHI) se clasifican como altamente restringidos: solo accede quien lo necesita, se cifran en reposo y en tránsito y se retienen según la ley. Antes de dar de baja un disco se sanitiza (borrado seguro, desmagnetización o trituración); formatear no basta por la remanencia. El enmascaramiento muestra solo ****1234 en pantalla o en pruebas. Un empleado que pega datos de clientes en una IA pública causa una fuga: se previene con política de uso, clasificación y DLP. Ciclo de vida: crear, almacenar, usar, compartir, archivar y destruir.',
'Envías un archivo grande: lo cifras con una clave simétrica (rápido) y proteges esa clave con la clave pública del receptor. Para demostrar que lo enviaste tú, firmas el hash con tu clave privada; quien recibe verifica con tu pública (integridad, autenticidad, no repudio). Cambiar un bit cambia todo el hash (efecto avalancha) y no se puede invertir. El checksum detecta errores accidentales. TLS cifra en tránsito; el cifrado de disco protege en reposo. La criptografía resistente a la cuántica busca algoritmos que no caigan ante computadores cuánticos.',
'El firewall bloquea un intento aislado: evento rutinario, se registra y se monitorea. Pero un SIEM correlaciona un login desde otro país, un cambio de permisos y una descarga masiva, y eso sube a incidente. Se prioriza por impacto y contexto. Actores: ransomware = cibercriminal (lucro); defacement por causa política = hacktivista; espionaje patrocinado = estado-nación; administrador descontento que borra datos = amenaza interna. La CTI aporta IOC (hashes, IP) y TTP (comportamiento); MITRE ATT&CK los cataloga. Un IDS por anomalías detecta desviaciones aun sin firma; sus falsos positivos son alertas por actividad legítima.',
'A las 03:10 un servidor cifra miles de archivos por minuto. Detección y análisis: se confirma y se determina el alcance. Contención: se aísla el servidor (cuarentena); erradicación: se elimina el malware y la cuenta comprometida; recuperación: se restaura desde respaldos limpios. Antes de limpiar se preserva la evidencia y la cadena de custodia. Después: lecciones aprendidas y actualización del IRP y del playbook. En la preparación están los roles, los contactos (incluida la aseguradora) y el entrenamiento. Un tabletop descubre brechas del plan sin tocar sistemas. La política de manejo de datos aplica durante el incidente: qué se preserva, quién accede a la evidencia y cómo se protege la información del caso.',
'Un servidor EOL con una aplicación crítica no puede apagarse: se aísla en un segmento restringido, se monitorea y se planifica su reemplazo. Gestión de cambios: solicitud, evaluación, aprobación, prueba, implementación y plan de reversión; un parche de emergencia sigue un proceso acelerado, no se salta el control. La línea base permite detectar desvíos. SAST revisa el código sin ejecutarlo; DAST prueba la aplicación corriendo. Un pentest necesita autorización escrita y alcance definido; el físico prueba tailgating y suplantación. Red ataca, blue defiende, purple colabora.'];

function covHtml(){const B=U(bank(),x=>x.q),all=U(bank(0,1),x=>x.q),ne=all.filter(x=>x.ex).length,c={};B.forEach(x=>c[x.sub]=(c[x.sub]||0)+1);
const dom=D.map((_,d)=>Object.keys(SUBS).filter(k=>+k[0]==d+1));
return `<div class="card"><b>Cobertura del outline oficial</b><div class="m">Preguntas por subtema (meta ≈ ${COV_MIN}) y tu acierto. El subtema de las preguntas antiguas se estima por palabras clave.</div>${dom.map((L,d)=>`<details ${d==0?'open':''}><summary>D${d+1} ${esc(D[d])}</summary>${L.map(k=>{const n=c[k]||0,t=(S.sb||{})[k],tot=t?t.a+t.f:0,p=tot?Math.round(t.a/tot*100):null;return`<div style="margin:6px 0"><div class="m">${k} ${esc(SUBS[k])} · ${n} preg.${n<COV_MIN?' ⚠ pocas':''} · ${p==null?'sin datos':p+'% ('+tot+')'}</div><div class="bar"><i style="width:${Math.min(100,n/COV_MIN*100)}%"></i></div></div>`}).join('')}</details>`).join('')}<p class="m">Preguntas «extra» (conocimiento válido pero fuera del outline): ${ne}. ${S.ex?'Incluidas ahora en práctica y simulacros.':'Ocultas en práctica y simulacros.'}</p><button onclick="exToggle()">${S.ex?'Ocultar':'Incluir'} preguntas extra</button></div>`}
const exToggle=()=>{S.ex=!S.ex;save();toast(S.ex?'Preguntas extra incluidas':'Preguntas extra ocultas');go('st')};
// registro de resultados; ahora también lleva la racha s (aciertos seguidos) de cada pregunta
function rec(x,ok){tally(x.d,ok);subT(x,ok);const t=tg(x),T=(S.tp=S.tp||{})[t]=S.tp[t]||{f:0,a:0};ok?T.a++:T.f++;const r=(S.qr=S.qr||{})[x.id]=S.qr[x.id]||{f:0,a:0,l:0,s:0};if(ok){if(r.f)r.a++;r.s=(r.s||0)+1}else{r.f++;r.s=0}r.l=Date.now()}
// copia de una pregunta con las opciones barajadas de nuevo (y sus motivos alineados)
function reshuf(x){const ix=sh(x.o.map((_,i)=>i)),W=x.w||[];return{...x,o:ix.map(i=>x.o[i]),w:ix.map(i=>W[i]||''),a:ix.indexOf(x.a)}}
// preguntas falladas que aún no se dominan (racha < 3); crea la racha de las falladas antiguas que no la tenían
function mPool(){const by={};bank(1).forEach(x=>by[x.id]=x);Object.values(S.wrong).forEach(x=>{if(!by[x.id])by[x.id]=x;if(!S.qr[x.id])S.qr[x.id]={f:1,a:0,l:0,s:0}});return Object.keys(S.qr).filter(id=>by[id]&&S.qr[id].f>0&&(S.qr[id].s||0)<3).map(id=>by[id])}
const pendM=()=>mPool().length;
function startM(d){const p=mPool().filter(x=>d==null||x.d==d);if(!p.length){toast('No hay falladas por dominar 🎉');return}run(sh(p).sort((a,b)=>(S.qr[a.id].s||0)-(S.qr[b.id].s||0)).slice(0,20).map(reshuf),0,0,{mastery:1})}
// Retroalimentación separada: ✅ por qué gana la correcta · ❌ por qué fallan las otras 3
const fbHtml=(x,a,i)=>{const W=x.w||[],A=(S.why||{})[x.id]||{};
return `<div id="fb${i}"><div class="fb ok"><b>${a==x.a?'✅ Correcto':'❌ Incorrecto'} · Por qué gana la correcta</b><p><b>${'ABCD'[x.a]}) ${esc(x.o[x.a])}</b></p><p>${esc(x.e)}</p>${x.of?'<p class="m">📘 Tema del outline que el material no desarrolla: confírmalo en la guía oficial de ISC2.</p>':''}</div><div class="fb no"><b>❌ Por qué fallan las otras 3</b>${x.o.map((t,j)=>j==x.a?'':`<p><b>${'ABCD'[j]}) ${esc(t)}</b>${j==a?' <i>(tu elección)</i>':''}<br><span class="m">${esc(W[j]||A[nm(t)]||'Sin explicación individual guardada para esta pregunta.')}</span></p>`).join('')}<p>${aiBtn('🤖 Explicar cada trampa',`why(${i})`)} ${aiBtn('💡 Analogía y truco',`more(${i})`)}</p><div class="m" id="mx${i}" style="white-space:pre-wrap"></div></div></div>`};
function rev(){const q=Q;$('v').innerHTML=q.qs.map((x,i)=>q.mastery&&q.ans[i]==null?'':`<div class="card"><div class="m">D${x.d+1} · ${esc(tg(x))} ${q.ans[i]==x.a?'✅':q.ans[i]==null?'⏭ sin responder':'❌'}</div><b>${esc(x.q)}</b><div class="m">Correcta: ${esc(x.o[x.a])}${q.ans[i]!=null&&q.ans[i]!=x.a?' · Tu respuesta: '+esc(x.o[q.ans[i]]):''}</div>${fbHtml(x,q.ans[i],i)}</div>`).join('')+`<button class="p" onclick="go('home')">Inicio</button>`;aiSync()}
// ── Temas → dominio (mismo orden que TP) y utilidades de estadística ──
const TPDOM=[4,4,1,3,3,3,3,4,4,2,2,2,1,1,0,0,0,0,0],TPD=Object.fromEntries(TP.map((t,i)=>[t[0],TPDOM[i]]));
const tpD=k=>k in TPD?TPD[k]:(/^D(\d) ·/.test(k)?+RegExp.$1-1:-1);
const cardD=c=>{const i=TP.findIndex(t=>t[1].test(c.f+' '+c.b));return i<0?-1:TPDOM[i]}; // dominio aproximado por palabras clave
const barT=(k,p,n)=>`<div style="margin:6px 0"><div class="m">${esc(k)} · ${p}% (${n})</div><div class="bar"><i style="width:${p}%"></i></div></div>`;
function tpHtml(){const E=Object.entries(S.tp||{}),H=S.hist.map(h=>h.p),av=H.length?Math.round(H.reduce((a,b)=>a+b,0)/H.length):0,tr=H.length>1?H[H.length-1]-H[H.length-2]:0,dm=Object.values(S.qr||{}).filter(r=>r.f&&r.a>=2&&r.a>=r.f).length;
const G=D.map((_,d)=>E.filter(([k])=>tpD(k)==d).map(([k,v])=>[k,v.a+v.f?Math.round(v.a/(v.a+v.f)*100):0,v.a+v.f]).sort((a,b)=>a[1]-b[1]));
return `<div class="card"><b>Simulacros y dominio</b><div class="m">Promedio ${av}% · tendencia ${tr>0?'▲ +':tr<0?'▼ ':'= '}${tr} · preguntas dominadas tras fallar: ${dm} · errores pendientes: ${Object.keys(S.wrong).length} · por dominar (3 seguidas): ${pendM()}</div></div><div class="card"><b>Desglose por tema dentro de cada dominio</b> <span class="m">(del más débil al más fuerte)</span>${G.map((L,d)=>`<details ${L.length?'open':''}><summary>D${d+1} ${D[d]} · ${L.length} tema${L.length==1?'':'s'}</summary>${L.length?L.map(t=>barT(t[0],t[1],t[2])).join(''):'<div class="m">Sin datos todavía.</div>'}</details>`).join('')}</div>`}
// Gráfico SVG (sin librerías) de los últimos 10 simulacros completos
function chartHtml(){const H=S.hist.slice(-10);if(!H.length)return'<div class="card"><b>Evolución de simulacros</b><div class="m">Aún no hay simulacros completos (100/125).</div></div>';
const w=320,h=170,L=30,R=12,T=16,B=14,X=i=>H.length==1?(L+w-R)/2:L+i*(w-L-R)/(H.length-1),Y=p=>T+(100-p)*(h-T-B)/100;
return `<div class="card"><b>Evolución de los últimos ${H.length} simulacros</b><svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Gráfico de línea con los resultados: ${H.map(x=>x.p+'%').join(', ')}">${[0,50,70,85,100].map(g=>`<line x1="${L}" x2="${w-R}" y1="${Y(g)}" y2="${Y(g)}" style="stroke:${g==85?'var(--ok)':'var(--b)'}" ${g==85?'stroke-dasharray="4 3"':''}/><text x="${L-4}" y="${Y(g)+3}" text-anchor="end" font-size="9" style="fill:var(--m)">${g}</text>`).join('')}<polyline fill="none" stroke-width="2" points="${H.map((x,i)=>X(i)+','+Y(x.p)).join(' ')}" style="stroke:var(--a)"/>${H.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.p)}" r="3.5" style="fill:var(--a)"><title>${x.f} · ${x.p}%</title></circle><text x="${X(i)}" y="${Y(x.p)-7}" text-anchor="middle" font-size="9" style="fill:var(--t)">${x.p}</text>`).join('')}</svg><div class="m">Línea verde punteada: meta de 85 %. Se cuentan solo simulacros de 100/125 preguntas.</div></div>`}
// ── «Recomiéndame qué estudiar hoy»: combina S.st, S.tp, S.qr, S.hist, lecciones y tarjetas vencidas ──
function quickP(d,tema){const B=U(bank().filter(x=>x.d==d),x=>x.q);let p=B.filter(x=>tg(x)==tema);if(p.length<8)p=B;p=[...sh(p.filter(x=>S.seen[x.id]!=1)),...sh(p.filter(x=>S.seen[x.id]==1))].slice(0,20);run(p,0)}
function recHoy(tid){const s=S.st||{},now=Date.now(),pool=mPool(),
dm=D.map((_,d)=>{const[a,f]=s[d]||[0,0],n=a+f;return{d,n,acc:n?a/n:null,pr:(f+1)/(n+2)*W[d]}}).sort((x,y)=>y.pr-x.pr),t=dm[0],d=t.d, // prioridad = error suavizado × peso oficial
tops=Object.entries(S.tp||{}).filter(([k])=>tpD(k)==d).map(([k,v])=>({k,n:v.a+v.f,err:(v.f+1)/(v.a+v.f+2)})).sort((x,y)=>y.err-x.err),
lp=LES.map((l,k)=>[l,k]).filter(([l,k])=>l[0]==d&&!S.les[k]),pend=pool.filter(x=>x.d==d).length,due=CARDS.filter(c=>S.box[c.id]&&S.box[c.id].next<=now).length,
tema=tops.length?tops[0].k:(lp.length?lp[0][0][1]:TP[TPDOM.indexOf(d)][0]),acc=t.n?`${Math.round(t.acc*100)}% de acierto en ${t.n} respuestas`:'sin datos todavía';let kind,txt;
if(lp.length&&(t.n<10||!tops.length)){kind='le';txt=`Estudia la lección «${lp[0][0][1]}» y luego haz las tarjetas de ese tema`}
else if(pend>=3){kind='m';txt=`Dominar falladas: ${pend} por dominar en este dominio (3 aciertos seguidos)`}
else if(t.n&&t.acc>=.85){kind='s';txt='Examen corto de 25 preguntas para comprobar que lo retienes en mezcla'}
else{kind='p';txt='Práctica de 20 preguntas del tema, con explicación inmediata'}
const H=S.hist.slice(-2),nota=H.length==2&&H[1].p<H[0].p-5?`<p class="m">Tu último simulacro bajó ${H[0].p-H[1].p} puntos respecto al anterior.</p>`:'';
window._rec={kind,d,tema};
$(tid).innerHTML=`<div class="card"><p><b>Dominio:</b> D${d+1} ${esc(D[d])} <span class="m">(${W[d]}% del examen · ${acc})</span></p><p><b>Tema:</b> ${esc(tema)}</p><p><b>Ejercicio:</b> ${esc(txt)}</p>${due>=10?`<p class="m">Además tienes ${due} tarjetas vencidas.</p>`:''}${nota}<button class="p" onclick="recRun()">Empezar</button></div>`}
function recRun(){const r=window._rec;if(!r)return;if(r.kind=='le')go('le');else if(r.kind=='m')startM(r.d);else if(r.kind=='s')startS(25);else quickP(r.d,r.tema)}
// ── Exportar / importar progreso (JSON) ──
async function dl(name,text){try{const d=await CL.use('downloads');if(d){await d.save({filename:name,data:text});return}}catch(e){}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function expJ(){dl('progreso-isc2-cc-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'isc2-cc',v:SV,exportado:new Date().toISOString(),estado:S},null,1));toast('Progreso exportado')}
const impJ=()=>$('imf').click();
function impF(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
rd.onerror=()=>toast('No se pudo leer el archivo');
rd.onload=()=>{try{const o=JSON.parse(rd.result),est=o&&o.estado?o.estado:o;if(!est||typeof est!='object'||Array.isArray(est)||!('seen' in est||'hist' in est||'box' in est||'qr' in est))throw 0;if((est.v||1)>SV){toast('El archivo es de una versión más nueva de la app');return}
if(!confirm('Esto reemplazará tu progreso actual por el del archivo. ¿Continuar?'))return;S=migrate(est);save();if(S.th)document.documentElement.dataset.theme=S.th;toast('Progreso importado');go('home')}catch(e){toast('El archivo no es un progreso válido')}};
rd.readAsText(f);inp.value=''}
// ── Acciones usadas por los botones (antes eran código suelto dentro del onclick) ──
const errRun=()=>run(sh(Object.values(S.wrong).map(x=>({...x}))).slice(0,30),0);
const runRes=()=>run(sh(bank(1).filter(x=>RES.has(x.id))),1);
const runCases=()=>run(sh(U(CASES,x=>x[1]).map(mk)).slice(0,+$('cn').value),0);
const studied=k=>{S.les[k]=1;save();le()};
const wipe=()=>{if(confirm('¿Borrar todo el progreso?')){try{localStorage.removeItem('cc')}catch(e){}location.reload()}};
// Glosario con búsqueda y filtro por dominio (el dominio de cada término se estima por palabras clave)
function gl(){const L=[...CARDS].sort((a,b)=>a.f.localeCompare(b.f)).map(c=>({...c,dm:cardD(c)}));
$('v').innerHTML=`<label class="m" for="gq">Buscar</label><input id="gq" oninput="gf()" placeholder="Buscar término o definición…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t)"><p><label class="m" for="gd">Dominio </label><select id="gd" onchange="gf()"><option value="-2">Todos los dominios</option>${D.map((n,i)=>`<option value="${i}">D${i+1} ${n}</option>`).join('')}<option value="-1">Sin clasificar</option></select></p><div id="gr"></div>`;
window.gf=()=>{const q=$('gq').value.toLowerCase(),d=+$('gd').value;$('gr').innerHTML=L.filter(c=>(c.f+c.b).toLowerCase().includes(q)&&(d==-2||c.dm==d)).map(c=>`<div class="card"><b>${esc(c.f)}</b><div class="m">${esc(c.b)}</div></div>`).join('')||'<div class="card m">Sin resultados.</div>'};gf()}
// ── Atajos de teclado: 1-4 responder · Enter/→ siguiente · ← anterior · M marcar · F finalizar ──
addEventListener('keydown',e=>{const t=e.target,tag=t&&t.tagName||'';if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(tag))return;
if(t&&t.getAttribute&&t.getAttribute('role')=='button'&&(e.key=='Enter'||e.key==' ')){e.preventDefault();t.click();return}
if(!Q||Q.done||!Q.qs)return;const k=e.key;
if(/^[1-4]$/.test(k)){pick(+k-1);return}
if(k=='ArrowLeft'){mv(-1);return}
if(k=='ArrowRight'||(k=='Enter'&&tag!='BUTTON')){if(Q.i<(Q.adaptive?Q.N:Q.qs.length)-1)mv(1);else if(k=='Enter'&&(!Q.exam||confirm('¿Terminar y ver resultados?')))fin();return}
if((k=='m'||k=='M')&&Q.exam){flg();return}
if((k=='f'||k=='F')&&confirm('¿Finalizar y ver resultados?'))fin()});
// Funciones usadas desde onclick/oninput, expuestas explícitamente en window (portabilidad a módulos ES)
Object.assign(window,{resumeS,dropS,exToggle,go,th,inst,ad,fill,startP,startS,startM,run,pick,mv,flg,jump,fin,rev,more,why,tut,cg,ms,mu,ds,dr,hs,hr,cs,mt,mg2,gl,st,le,lv,cards,prac,sim,err,fx,rr,ia,ask,home,errRun,runRes,runCases,studied,wipe,expJ,impJ,impF,recHoy,recRun,quickP});

nav();home();
