// ── Capítulo 5 del PDF (Operaciones de seguridad): subtemas 5.1, 5.2, 5.4 y políticas (1.3) ──
const N15=[
// 5.1 Datos: ciclo de vida, clasificación, retención, destrucción
[4,'¿Qué etapa del ciclo de vida del dato se cumple cuando se guarda o graba por primera vez de modo que quede explícito?','Almacenar','Crear','Destruir','Compartir','Almacenar es registrar el dato de alguna manera, lo que lo hace explícito.',['','Crear es el conocimiento que aún suele ser tácito.','Destruir es el final del ciclo.','Compartir es dárselo a otros usuarios.'],'5.1'],
[4,'Un dato se mueve de una ubicación a otra o se entrega a otro usuario. ¿Qué etapa es?','Compartir','Usar','Archivar','Crear','Compartir es entregar el dato a otros como copia o trasladándolo.',['','Usar es aprovechar el dato, con posibles modificaciones.','Archivar es guardarlo mientras no se necesita.','Crear es generarlo.'],'5.1'],
[4,'¿Cuál es el primer paso para decidir cómo proteger un conjunto de datos?','Reconocer su valor y el impacto si se compromete, es decir, clasificarlo','Cifrarlo sin clasificar','Borrarlo','Publicarlo','La clasificación reconoce los impactos de un compromiso de confidencialidad, integridad o disponibilidad.',['','Sin saber su valor no se sabe cuánta protección necesita.','No es una medida de protección.','Publicarlo lo expone.'],'5.1'],
[4,'Una empresa define cuatro etiquetas: pública, uso interno, moderadamente restringida y altamente restringida. ¿Qué dicta la etiqueta de los datos?','Las reglas de uso, almacenamiento y compartición, de acuerdo con su sensibilidad','El color del archivo','El tamaño del archivo','El nombre del servidor','Cuanto mayor la sensibilidad, mayor la protección exigida.',['','Es una etiqueta de seguridad, no de apariencia.','El tamaño no determina la sensibilidad.','El servidor no define la clasificación.'],'5.1'],
[4,'¿Qué ocurriría si una organización define demasiadas clasificaciones de datos?','Las personas se confunden y las distinciones dejan de ser claras','Mejora automáticamente la seguridad','Se elimina el riesgo','Se reduce la necesidad de capacitación','Lo habitual es usar dos o tres, y más de cuatro tiende a ser difícil de manejar.',['','Demasiadas etiquetas suelen generar errores.','El riesgo no desaparece.','Se necesita más capacitación, no menos.'],'5.1'],
[4,'Datos cuya filtración podría poner en riesgo la existencia de la organización o causar pérdida de vidas llevarían la etiqueta:','Altamente restringido','Datos públicos sin restricciones','Sensibilidad baja','Moderadamente restringido','Es la categoría de mayor impacto posible.',['','Los datos públicos no causan daño por su divulgación.','La sensibilidad baja podría causar solo interrupciones menores.','Moderado implica pérdida de ventaja o ingresos, no la existencia de la empresa.'],'5.1'],
[4,'Por precaución, una empresa decide aplicar el periodo de retención más largo a todos sus datos. ¿Cuál es el problema?','Desperdicia almacenamiento, aumenta el riesgo de exposición y puede incumplir requisitos externos','Mejora el cumplimiento en todos los casos','No tiene ningún efecto','Elimina la necesidad de un inventario','Retener de más es un error común: amplía la exposición y añade ruido.',['','Puede violar leyes o contratos que exigen eliminar datos.','Tiene costos y riesgos.','El inventario sigue siendo necesario.'],'5.1'],
[4,'Los registros médicos deben conservarse 10 años por una norma y más de 30 por otra. ¿Qué lección ilustra?','Una misma pieza de datos puede estar sujeta a varias regulaciones y hay que conocer todas','Que solo importa la norma más corta','Que la retención es opcional','Que las normas se anulan entre sí','Se debe cumplir con los requisitos aplicables, normalmente el más estricto.',['','Aplicar la más corta incumpliría la otra.','Es una obligación cuando hay un requisito.','Se acumulan, no se anulan.'],'5.1'],
[4,'Una organización cumple su plazo de retención y decide eliminar los datos con una política que respalda su decisión. ¿Qué concepto aplica?','Destrucción defendible','Retención indefinida','Aceptación del riesgo','Etiquetado','Significa contar con el mandato o la política que justifica la destrucción.',['','Es lo contrario de eliminar.','No se trata de aceptar un riesgo.','El etiquetado identifica sensibilidad, no justifica borrado.'],'5.1'],
[4,'Un técnico vacía la papelera para eliminar datos confidenciales de un disco. ¿Por qué no basta?','Los datos pueden quedar en el medio (remanencia) y ser recuperados','La papelera cifra los datos','Elimina los respaldos','Hace que los datos sean públicos','La remanencia son los datos que quedan tras la eliminación.',['','No cifra nada.','No actúa sobre los respaldos.','No los publica.'],'5.1'],
[4,'Una empresa escribe varios patrones aleatorios sobre todo el disco antes de reutilizarlo. ¿Qué técnica aplica?','Limpiar (sobrescribir)','Destruir físicamente','Cifrar el disco','Etiquetar el disco','Sobrescribir reduce la remanencia en entornos de rutina.',['','Destruir implicaría triturar o quemar el dispositivo.','Cifrar no es sobrescribir.','El etiquetado no elimina datos.'],'5.1'],
[4,'Para eliminar un disco con datos altamente sensibles, que ya no se usará, ¿cuál es el último recurso contra la remanencia?','La destrucción física, como triturar o fragmentar','Vaciar la papelera','Reiniciar el equipo','Cambiar el nombre de los archivos','La destrucción física es el recurso final cuando otras técnicas no bastan.',['','No elimina los datos del disco.','Un reinicio no borra el contenido.','Renombrar no elimina nada.'],'5.1'],
[4,'Un equipo usa imanes potentes para borrar datos de cintas y discos magnéticos. ¿Qué técnica es?','Desmagnetización','Cifrado asimétrico','Enmascaramiento','Segmentación','Altera el medio magnético, aunque con equipo sofisticado podría recuperarse parte.',['','El cifrado asimétrico usa pares de claves.','El enmascaramiento oculta partes del dato.','La segmentación divide redes.'],'5.1'],
[4,'Un dato está guardado en un servidor, otro viaja por la red y otro está siendo procesado por una aplicación. ¿Qué tres estados de los datos son?','En reposo, en movimiento y en uso','Públicos, privados y secretos','Creados, borrados y archivados','Locales, remotos y mixtos','Los datos se protegen en reposo, en tránsito y en uso.',['','Son niveles de clasificación, no estados.','Son etapas del ciclo de vida.','No son los estados de los datos.'],'5.1'],
[4,'La criptografía transforma un mensaje legible en uno ininteligible. ¿Cómo se llaman, respectivamente, el mensaje original y el resultado?','Texto sin formato y texto cifrado','Texto cifrado y texto sin formato','Clave y hash','Firma y certificado','El texto plano se cifra con un algoritmo y una clave para obtener texto cifrado.',['','Está invertido.','La clave y el hash no son esos objetos.','Firma y certificado son otros conceptos.'],'5.1'],
[4,'En un algoritmo simétrico, ¿cuál es la característica principal?','Usa la misma clave para cifrar y descifrar','Usa un par de claves pública y privada','No usa claves','Produce un resumen de longitud fija','Ambas partes deben compartir el conocimiento de la misma clave.',['','Eso describe el cifrado asimétrico.','Todo cifrado utiliza clave.','Eso describe el hash.'],'5.1'],
[4,'¿Cuál es un desafío del cifrado simétrico según el material?','Distribuir la clave de forma segura y gestionar muchas claves a medida que crecen los usuarios','No sirve para datos grandes','Es más lento que cualquier otro','No puede proteger la confidencialidad','La clave no puede enviarse por el mismo canal sin riesgo, y la cantidad de claves crece rápidamente.',['','Suele ser rápido para grandes volúmenes.','No es el desafío principal descrito.','Sí protege la confidencialidad.'],'5.1'],
[4,'Enviar la clave de cifrado por un medio distinto al del mensaje se llama:','Distribución de claves fuera de banda','Rotación de claves','Hashing','Firma digital','Evita que quien intercepta el mensaje obtenga también la clave.',['','La rotación es cambiar claves periódicamente.','El hashing genera resúmenes.','La firma digital da autenticidad y no repudio.'],'5.1'],
[4,'Para enviar un mensaje confidencial a otra persona con cifrado asimétrico, ¿con qué clave se cifra?','Con la clave pública del destinatario','Con la clave privada del remitente','Con la clave privada del destinatario','Con una clave compartida de antemano','Solo el destinatario, con su clave privada, podrá descifrarlo.',['','Eso sirve para firmar, no para dar confidencialidad.','La privada de otra persona no la conoce el remitente.','Eso sería cifrado simétrico.'],'5.1'],
[4,'Un emisor firma un documento con su clave privada. ¿Qué logra?','Que el destinatario verifique autenticidad y no repudio con la clave pública del emisor','Confidencialidad del documento','Que nadie pueda leerlo','Que se comprima el archivo','La firma solo puede verificarse con la clave pública correspondiente.',['','La firma no oculta el contenido.','El documento sigue siendo legible.','No comprime nada.'],'5.1'],
[4,'¿Qué propiedad distingue a una función hash criptográfica de un cifrado?','No es reversible: no se puede obtener el mensaje original a partir del hash','Se puede descifrar con una clave','Su resultado tiene longitud variable','Produce resultados distintos para la misma entrada','El hash es unidireccional y determinista, con resultado de longitud fija.',['','Un hash no se descifra.','Su resultado tiene longitud fija.','La misma entrada siempre produce el mismo hash.'],'5.1'],
[4,'Un archivo descargado debe comprobarse para saber si fue alterado. ¿Qué se compara?','El valor hash calculado con el publicado','La clave pública con la privada','El tamaño del archivo solamente','La dirección IP del servidor','Cualquier cambio en el archivo produce un hash diferente.',['','No se comparan claves en este caso.','El tamaño solo no detecta alteraciones.','La IP no demuestra la integridad del archivo.'],'5.1'],
[4,'Para evitar que se filtren los datos de la empresa por correo o aplicaciones, ¿qué solución regula lo que sale del entorno de TI?','Prevención de pérdida de datos (DLP)','Un concentrador','Un escáner de vulnerabilidades','Un sistema de climatización','El monitoreo de salida se asocia a DLP.',['','El concentrador es un dispositivo de red básico.','El escáner identifica debilidades.','La climatización cuida los equipos.'],'5.1'],
// 5.2 Registros y monitoreo
[4,'Un SIEM tiene la tarea de revisar tanto el tráfico que entra a la red como el que sale de ella. ¿Cómo se llaman esos dos tipos de monitoreo?','Ingreso y salida','Reposo y tránsito','Preventivo y correctivo','Local y remoto','El monitoreo de ingreso vigila lo que entra y el de salida regula los datos que salen.',['','Son estados de los datos.','Son tipos de control, no de monitoreo de tráfico.','No describen la dirección del tráfico.'],'5.2'],
[4,'¿Qué información conviene registrar en los sistemas?','Fecha y hora, inicios y cierres de sesión, intentos de acceso exitosos y fallidos, y cambios de configuración','Solo los intentos exitosos','Nada para no consumir recursos','Solo el nombre del servidor','Estos registros permiten detectar compromisos y atribuir acciones.',['','Los intentos rechazados son clave para detectar ataques.','Sin registros no hay responsabilidad ni detección.','Con el nombre del servidor solo no se reconstruye ningún evento.'],'5.2'],
[4,'Un atacante quiere ocultar su rastro. ¿Qué medida protege los registros ante modificaciones o eliminaciones?','Controles que impidan cambios no autorizados y preservación de los registros originales','Permitir que cualquiera los edite','Guardarlos solo en el equipo atacado','Borrarlos cada día','Preservar la integridad de los registros es esencial para auditorías y forense.',['','Permitir ediciones elimina su valor probatorio.','Si el equipo cae, se pierden.','Borrarlos destruye evidencia.'],'5.2'],

[4,'¿Qué es una línea de base de seguridad?','Un nivel mínimo de protección usado como punto de referencia','Un tipo de firewall','Una copia de seguridad','Un registro de visitantes','Sirve para asegurar que las actualizaciones cumplan un mínimo aceptable.',['','No es un dispositivo de red.','Una copia de seguridad es otra cosa.','No es un registro físico.'],'5.4'],
[4,'Un equipo no cumple con la línea de base de seguridad de la organización. ¿Qué se puede hacer?','Desactivarlo o aislarlo en cuarentena hasta verificarlo y actualizarlo','Dejarlo conectado sin cambios','Darle más permisos','Borrar su registro','Aislar el equipo no conforme evita que ponga en riesgo la red.',['','Dejarlo igual mantiene el riesgo.','Más permisos agrava el problema.','Borrar su registro oculta el problema.'],'5.4'],
[4,'¿Cuál es el primer paso de cualquier proceso de gestión de activos?','Hacer un inventario de los activos, incluidos los de información','Comprar más equipos','Desactivar los parches','Destruir los equipos antiguos','No se puede proteger lo que no se conoce.',['','Primero hay que saber qué se tiene.','Los parches son necesarios.','Destruir sin inventario puede perder datos.'],'5.4'],
[4,'Antes de aplicar un parche en toda la organización, ¿qué conviene hacer?','Probarlo y contar con un plan de reversión','Instalarlo directamente en producción sin pruebas','Esperar al próximo desastre','Aplicarlo solo a un usuario aleatorio','Un parche defectuoso de un proveedor de confianza puede afectar el sistema.',['','Sin pruebas se puede interrumpir el servicio.','Esperar deja vulnerabilidades abiertas.','No es una estrategia de prueba controlada.'],'5.4'],
[4,'Una empresa no tiene un entorno de pruebas igual al de producción. ¿Qué es especialmente crítico?','Un plan de reversión sólido','Eliminar las pruebas','Ignorar los parches','Desconectar los respaldos','Si no puede probar a fondo, necesita poder volver al estado anterior.',['','Las pruebas siguen siendo valiosas aunque sean parciales.','Ignorarlos deja vulnerabilidades.','Los respaldos ayudan a recuperarse.'],'5.4'],
[4,'¿Qué riesgo tiene el parcheo desatendido (automático)?','Puede provocar interrupciones no programadas al reiniciar sistemas de producción','Elimina todas las vulnerabilidades sin riesgos','Hace innecesario el inventario','Cifra los datos','Debe sopesarse frente al riesgo de dejar sistemas sin parchear.',['','No elimina todo el riesgo ni está libre de efectos.','El inventario sigue siendo necesario.','No es su función.'],'5.4'],
[4,'Un administrador quiere cambiar la configuración de un servidor. ¿Cuál es el proceso correcto en gestión de cambios?','Presentar una solicitud de cambio, revisarla, aprobarla, probarla y documentarla','Hacer el cambio de inmediato y avisar después','Pedir permiso solo al compañero de al lado','No documentar nada','La gestión de cambios exige solicitud, aprobación, pruebas y documentación.',['','Sin aprobación puede introducir vulnerabilidades o interrumpir el negocio.','La aprobación debe ser formal y completa.','Sin documentación se pierde la trazabilidad.'],'5.4'],
[4,'¿Qué es una reversión (rollback) en la gestión de cambios?','Restaurar el sistema al estado en que estaba antes del cambio','Aplicar otro parche encima','Eliminar el sistema','Cambiar de proveedor','Se usa si el cambio no funciona o tiene efectos inaceptables.',['','Podría agravar el problema.','No es eliminarlo.','No tiene relación con el proveedor.'],'5.4'],
[4,'Después de un cambio o parche, ¿qué verifica una prueba de regresión?','Que el cambio no introdujo comportamientos erróneos o inesperados en el sistema','Que el parche sea gratuito','Que el sistema tenga más usuarios','Que la contraseña sea larga','Confirma que nada se dañó con el nuevo conjunto de cambios.',['','El costo no es el objetivo.','El número de usuarios no se prueba así.','No evalúa contraseñas.'],'5.4'],

[1,'Una plataforma de GRC reúne políticas, riesgos, controles y evidencias de cumplimiento en un solo lugar. ¿Qué beneficio principal aporta?','Una visión única y trazable de riesgos y controles que apoya las decisiones y las auditorías','Reemplaza la necesidad de analizar los riesgos con las áreas del negocio','Bloquea automáticamente cualquier ataque dirigido a la organización','Elimina el riesgo residual de todos los procesos registrados','Las herramientas de GRC integran y dan trazabilidad; no sustituyen el análisis ni eliminan el riesgo.',['','El análisis con el negocio sigue siendo necesario para valorar los riesgos.','Es una herramienta de gestión, no un control técnico de bloqueo.','El riesgo residual se gestiona, no desaparece.'],'2.1'],
[1,'El área de TI contrata servicios en la nube y herramientas de IA sin avisar a seguridad ni a cumplimiento. ¿Qué falla de gobernanza evidencia esto?','Que seguridad, riesgo y cumplimiento no están alineados con las decisiones del negocio','Falta de redundancia en el centro de datos principal','Un ataque de intermediario contra las comunicaciones','Una debilidad en el algoritmo de cifrado de la nube','GRC busca que las decisiones tecnológicas pasen por la gestión de riesgos y el cumplimiento.',['','La redundancia trata de disponibilidad, no de coordinación entre áreas.','Es un ataque técnico; el problema descrito es organizativo.','El cifrado no se menciona; el fallo es de proceso y alineación.'],'2.1'],
[1,'Una ley nueva obliga a conservar ciertos registros durante cinco años. ¿Qué componente de GRC se activa primero?','Cumplimiento: traducir la obligación legal en políticas y controles verificables','Respuesta a incidentes: activar el plan de contención','Continuidad del negocio: contratar un sitio alterno','Gestión de activos: dar de baja equipos antiguos','El cumplimiento convierte los requisitos legales en reglas y controles que se pueden comprobar.',['','No hay un incidente que contener.','La obligación no trata de recuperar operaciones tras una interrupción.','Retirar equipos no cumple la obligación de conservar registros.'],'2.1'],
[1,'Una organización usa un modelo de IA en decisiones de crédito. ¿Qué aporta incluirlo dentro de su marco de GRC?','Que tenga dueño, políticas, controles y revisión como cualquier otro sistema crítico','Que quede exento de las políticas por ser una tecnología innovadora','Que su riesgo lo asuma por completo el proveedor del modelo','Que deje de necesitar supervisión humana en las decisiones','La IA se rige por las mismas políticas y requisitos legales que el software tradicional.',['','Innovar no exime del cumplimiento de políticas ni leyes.','La organización conserva su responsabilidad aunque use un proveedor.','Las decisiones de alto impacto requieren supervisión humana.'],'2.1'],
[1,'La dirección quiere organizar sus controles de seguridad con un enfoque estructurado y reconocido, en lugar de inventar uno propio. ¿Qué debería adoptar?','Un marco de referencia como NIST CSF o ISO/IEC 27001','Una política única de contraseñas para toda la empresa','Un plan anual de capacitación en concienciación','Un inventario actualizado de activos de hardware','Los marcos ofrecen una estructura probada para organizar y evaluar controles.',['','Una política cubre un solo aspecto, no organiza todo el programa.','La capacitación es un control, no un marco de gestión.','El inventario es una actividad de apoyo, no un marco.'],'2.1'],
[1,'Un equipo informa a la dirección que «este mes se bloquearon 500 alertas». ¿Por qué esa cifra sola es una métrica débil?','Mide actividad, pero no muestra si el riesgo bajó ni qué importa al negocio','Porque las alertas bloqueadas no se pueden contar de forma fiable','Porque solo resulta útil para los auditores externos','Porque una cifra mensual siempre es inexacta','Una métrica efectiva se vincula a resultados y a riesgo, no solo al volumen de actividad.',['','Contarlas es posible; el problema es lo que la cifra comunica.','Los directivos también necesitan métricas con contexto.','La periodicidad no determina por sí sola la exactitud.'],'2.4'],
[1,'El tiempo medio que tarda el equipo en contener un incidente bajó de 12 a 4 horas en seis meses. ¿Qué sugiere ese resultado?','Una mejora en la efectividad de la respuesta, que conviene validar con otras métricas','Que ya no hace falta ejercitar los planes de respuesta','Que el número de amenazas contra la organización disminuyó','Que la dirección aumentó su apetito de riesgo','Mide rapidez de respuesta; no prueba que haya menos amenazas ni sustituye los ejercicios.',['','Los ejercicios siguen siendo necesarios para mantener la mejora.','No mide la cantidad de amenazas, solo la rapidez al contenerlas.','El apetito de riesgo es una decisión de la dirección, no se deduce de esa cifra.'],'2.4'],

[1,'Un cuadro de mando (scorecard) para el comité de riesgos debe, ante todo:','Resumir pocos indicadores ligados a objetivos y umbrales, con su tendencia','Mostrar en tiempo real todos los eventos del SIEM','Detallar cada vulnerabilidad con sus datos técnicos','Evitar tendencias para no generar confusión','Para decisiones directivas importan pocos indicadores claros, con metas y tendencia.',['','El detalle operativo abruma a quien debe decidir.','Ese nivel técnico corresponde a los analistas, no al comité.','Sin tendencia no se sabe si el riesgo mejora o empeora.'],'2.4'],

[4,'Un escaneo de vulnerabilidades marca una falla crítica en un servidor, pero el equipo duda de que sea real. ¿Qué corresponde antes de priorizar el parche?','Validar el hallazgo para descartar un falso positivo y confirmar si es explotable','Parchear todo de inmediato sin analizar el resultado','Descartarlo porque los escáneres siempre se equivocan','Atacar el servidor de producción para comprobarlo','Los escáneres pueden generar falsos positivos; validar el hallazgo evita esfuerzo inútil sin ignorar un riesgo real.',['','Actuar sin validar desperdicia recursos y puede causar interrupciones.','Descartar todo resultado ignora fallas reales.','Un ataque sin autorización ni control puede interrumpir producción.'],'5.5'],

[4,'Un hallazgo del análisis estático aparece en un fragmento de código que nunca se ejecuta en producción. ¿Qué limitación del análisis estático ilustra?','Puede señalar fallas inalcanzables, por lo que sus hallazgos requieren revisión','Solo detecta fallas de configuración de red','Necesita que la aplicación esté ejecutándose para funcionar','Sustituye por completo a las pruebas dinámicas','El análisis estático revisa el código sin ejecutarlo; no sabe si cada ruta es alcanzable, y los resultados se triagean.',['','Analiza código, no la configuración de red.','Esa es la característica del análisis dinámico.','Ambos enfoques se complementan; ninguno reemplaza al otro.'],'5.5'],
[4,'Tras un ejercicio de purple team, ¿cuál es el resultado más valioso?','Reglas de detección y procedimientos mejorados a partir de las técnicas probadas','Un informe que atribuye la culpa al equipo azul','La eliminación del equipo rojo por haber tenido éxito','Una lista de contraseñas obtenidas durante el ejercicio','El purple team busca colaboración: lo aprendido se traduce en mejores detecciones y respuestas.',['','El objetivo es mejorar las defensas, no asignar culpas.','El equipo rojo aporta valor al probar las defensas.','Las credenciales obtenidas no son el objetivo del ejercicio.'],'5.5'],
[4,'Durante una prueba física autorizada, la evaluadora lleva una carta firmada por la dirección por si la detienen. ¿Qué propósito tiene?','Demostrar que la actividad está autorizada y evitar consecuencias legales','Reemplazar el acuerdo de alcance de la prueba','Evitar que el personal detecte la simulación','Permitirle saltarse las reglas acordadas','La autorización escrita protege al evaluador y a la organización; no cambia el alcance acordado.',['','La carta complementa el alcance, no lo sustituye.','No sirve para ocultar la prueba, sino para respaldar su legitimidad.','Las reglas acordadas se respetan siempre.'],'5.5'],

[1,'Un empleado recibe un mensaje de texto que dice que su paquete fue retenido y le pide abrir un enlace. ¿Qué técnica de ingeniería social es?','Smishing: phishing por mensaje de texto','Vishing: engaño mediante una llamada de voz','Pretexting: historia elaborada para ganar confianza','Baiting: dejar un medio infectado como señuelo','El smishing usa SMS o mensajería para llevar a la víctima a un enlace malicioso.',['','El vishing es por voz, no por texto.','El pretexting se basa en un escenario inventado, normalmente en conversación.','El baiting utiliza un señuelo físico o digital atractivo.'],'2.3'],

[1,'Un vendedor usa la misma contraseña en el correo de la empresa y en una tienda en línea que sufrió una brecha. ¿Qué mensaje de concienciación aborda mejor el riesgo?','No reutilizar contraseñas entre servicios y usar un gestor de contraseñas con MFA','Cambiar la contraseña una vez al año','Usar una contraseña muy larga y repetirla en todos los sitios','Anotar las claves en un archivo compartido del equipo','Reutilizar contraseñas permite que una brecha externa comprometa cuentas corporativas.',['','Cambiarla poco no evita la reutilización tras una filtración.','La longitud no ayuda si la misma clave ya fue expuesta.','Compartirlas multiplica el riesgo de exposición.'],'2.3'],
[1,'Los directivos exigen seguridad al personal, pero se saltan los controles de acceso «porque tienen prisa». ¿Qué efecto tiene eso en la cultura de seguridad?','La debilita, porque el ejemplo de la dirección marca lo que el resto considera aceptable','Ninguno, porque la cultura la define solo el área de TI','La refuerza, porque muestra que las reglas son flexibles','Mejora el cumplimiento por temor a la dirección','El liderazgo predica con el ejemplo; las excepciones de los jefes minan la credibilidad de las reglas.',['','La cultura depende de toda la organización, empezando por el liderazgo.','La flexibilidad selectiva erosiona la confianza en los controles.','El temor no genera hábitos de seguridad sostenibles.'],'2.3'],
[1,'Una empresa descubre que sus empleados pegan datos de clientes en asistentes de IA públicos. ¿Qué medida de concienciación aborda mejor la causa?','Explicar qué datos no deben ingresarse en servicios públicos y ofrecer una alternativa aprobada','Prohibir internet durante toda la jornada','Sancionar a quien lo haga sin explicar el motivo','Esperar a que la herramienta de IA corrija el problema','Entender el riesgo y contar con una alternativa segura cambia la conducta sin frenar el trabajo.',['','Es desproporcionado e inviable para la operación.','Sancionar sin explicar no cambia el comportamiento de fondo.','La responsabilidad de proteger los datos es de la organización.'],'2.3'],

[3,'Un atacante comprometió una estación de trabajo e intenta alcanzar servidores de otras áreas. ¿Qué diseño limita mejor ese movimiento lateral?','Segmentar la red y permitir solo el tráfico estrictamente necesario entre zonas','Una red plana con un único firewall en el perímetro','Contraseñas más largas en cada estación de trabajo','Más ancho de banda entre las distintas áreas','La segmentación con reglas mínimas entre zonas contiene el avance de un intruso.',['','En una red plana, quien entra alcanza casi todo.','Las contraseñas no restringen el movimiento una vez dentro.','El ancho de banda no es un control de seguridad.'],'4.2'],

const SV=2,INT=[1,3,7,21],DAY=864e5; // INT: días hasta el próximo repaso en los niveles 1..4
function migrate(s){
  if(!s||typeof s!='object'||Array.isArray(s))s={};
  ['seen','wrong','box','qr','tp','notes','st','les','why','sb'].forEach(k=>{if(!s[k]||typeof s[k]!='object'||Array.isArray(s[k]))s[k]={}});
  if(!Array.isArray(s.gen))s.gen=[];
  s.gen=s.gen.filter(g=>Array.isArray(g)&&typeof g[1]=='string'&&Array.isArray(g[2])&&g[2].length==4); // descarta solo entradas corruptas
  if(!Array.isArray(s.hist))s.hist=[];
  s.hist=s.hist.filter(h=>h&&typeof h.p=='number');
  if(s.sess&&(typeof s.sess!='object'||!Array.isArray(s.sess.qs)||!Array.isArray(s.sess.ans)))s.sess=null; // sesión guardada inválida
  const v1=(s.v||1)<2;
  // box: de número (0-4) a {n:nivel,next:fecha}; el nivel aprendido se conserva
  Object.keys(s.box).forEach(id=>{const b=s.box[id];
    if(b&&typeof b=='object'){b.n=Math.max(0,Math.min(4,+b.n||0));b.next=+b.next||0}
    else{const n=Math.max(0,Math.min(4,+b||0));s.box[id]={n,next:n&&v1?Date.now()+INT[n-1]*DAY:0}}});
  // qr: añade la racha s (aciertos seguidos) para el modo «dominar falladas»
  Object.keys(s.qr).forEach(id=>{const r=s.qr[id];if(!r||typeof r!='object'){delete s.qr[id];return}
    r.f=+r.f||0;r.a=+r.a||0;r.l=+r.l||0;if(r.s==null)r.s=(v1&&r.f&&r.a>=3&&r.a>=r.f)?3:0});
  s.v=SV;return s}
