[2,'Termina el contrato de un consultor. ¿Qué etapa del ciclo de vida de identidades corresponde?',['Desaprovisionamiento inmediato','Revisión trimestral','Redefinición de roles','Aprovisionamiento'],0,'Retirar accesos al terminar evita cuentas huérfanas.'],

const N10=[
[3,'Un servidor web agota su tabla de conexiones medio abiertas bajo un SYN flood. ¿Qué mecanismo le permite seguir atendiendo clientes legítimos sin reservar memoria por cada SYN?','SYN cookies, que validan el ACK final antes de reservar recursos','Alargar el tiempo de espera de los handshakes incompletos','Cambiar el servicio de TCP a ICMP para evitar el handshake','Bloquear todos los puertos por encima del 1024','Con SYN cookies el servidor codifica el estado en el número de secuencia y solo reserva recursos si llega un ACK válido.',['','Esperar más mantiene ocupadas las entradas por más tiempo y agrava el agotamiento.','ICMP no sustituye a TCP; el servicio dejaría de funcionar.','El ataque apunta al puerto legítimo del servicio, no a puertos altos.']],
[3,'El equipo de red ve miles de SYN sin su ACK final y el sitio deja de responder. ¿Qué pilar de la tríada CIA se afecta de forma directa?','Disponibilidad','Confidencialidad','Integridad','No repudio','El flood satura recursos y el servicio deja de estar accesible: es un ataque a la disponibilidad.',['','No se lee ningún dato; solo se agotan recursos.','Los datos no se alteran; el servicio simplemente no responde.','El no repudio trata de negar acciones, no de saturar un servicio.']],
[3,'Para distinguir un SYN flood de un pico legítimo de visitas, un analista revisa el handshake TCP. ¿Qué patrón es típico del ataque?','Muchos SYN de orígenes variados que nunca completan el ACK final','Handshakes completos seguidos de transferencias normales de datos','Respuestas DNS con firmas inválidas','Intentos repetidos de login sobre una sola cuenta','En un pico legítimo los clientes completan el handshake; en el flood quedan conexiones a medias.',['','Eso describe tráfico legítimo con conexiones completas.','Apunta a un problema de DNSSEC, no al handshake TCP.','Es fuerza bruta contra una cuenta, no un ataque de saturación.']],
[4,'Dos sistemas comparten una clave secreta y quieren verificar integridad y autenticidad de cada mensaje; el no repudio no es necesario. ¿Qué técnica es la más adecuada?','HMAC','Firma digital con clave privada','Hash simple (SHA-256) sin clave','Cifrado asimétrico de todo el mensaje','HMAC combina un hash con la clave compartida: es rápido y prueba integridad y autenticidad.',['','Funciona, pero es más costosa y su ventaja (no repudio) no se necesita aquí.','Sin clave, quien altera el mensaje puede recalcular el hash.','Protege la confidencialidad y es lento; no es la herramienta para verificar cada mensaje.']],
[4,'¿Por qué una firma digital da no repudio y un HMAC no?','En el HMAC ambas partes conocen la misma clave, así que cualquiera de las dos pudo generar el código','El HMAC no usa funciones hash','La firma digital cifra todo el mensaje con una clave simétrica','El HMAC solo funciona con claves públicas','La firma usa una clave privada que solo posee el firmante; en el HMAC la clave es compartida.',['','El HMAC se construye precisamente sobre una función hash.','La firma usa un par de claves asimétrico y normalmente firma el hash.','El HMAC usa una clave secreta compartida, no un par público/privado.']],
[4,'Un contrato electrónico debe poder atribuirse ante un tribunal a una persona concreta. ¿Qué mecanismo se requiere?','Firma digital con la clave privada del firmante','HMAC con clave compartida','Checksum CRC del archivo','Hash SHA-256 del documento publicado','Solo la firma digital vincula el documento a una clave que únicamente posee el firmante.',['','Con clave compartida, la otra parte también pudo generar el código.','El CRC detecta errores accidentales, no identifica a nadie.','Un hash prueba que no cambió, pero no quién lo emitió.']],
[4,'Los datos de clientes siguen almacenados en discos retirados hace dos años. ¿Qué etapa del ciclo de vida del dato falló?','Destrucción: no se sanitizaron los medios al terminar la retención','Creación: faltó clasificar el dato','Uso: se consultó sin necesidad','Compartición: se envió a un tercero','El ciclo termina con la destrucción segura; dejar datos en medios retirados es una falla de esa etapa.',['','Clasificar al crear es importante, pero el problema descrito ocurre al final.','No hay consultas indebidas en el escenario.','No se menciona ningún envío a terceros.']],
[4,'Un analista etiqueta como «confidencial» un archivo recién generado por la aplicación de nómina. ¿Qué etapa del ciclo de vida del dato aplica?','Creación','Archivo','Destrucción','Compartición','La clasificación y el etiquetado se asignan idealmente al crear el dato.',['','El archivo es la etapa de conservación a largo plazo, no la de etiquetar lo recién generado.','La destrucción cierra el ciclo; el dato apenas nace.','Compartir es enviarlo a otros; aquí solo se etiqueta.']],
[4,'Datos de clientes de hace ocho años pasan a cintas cifradas fuera de línea, accesibles solo bajo solicitud. ¿Qué etapa es?','Archivo','Almacenamiento activo','Uso','Destrucción','Archivar es conservar a largo plazo datos que ya no se usan a diario.',['','El almacenamiento activo es el de los datos en uso diario.','Nadie los está consultando a diario.','Siguen conservándose; no se eliminan.']],
[2,'Un desarrollador sube al repositorio un archivo de configuración con la clave de la base de datos. ¿Qué práctica evita repetirlo?','Guardar los secretos en una bóveda y que la aplicación los obtenga en ejecución','Cifrar el repositorio con una contraseña compartida por el equipo','Ofuscar la clave con codificación base64','Dejar el repositorio visible para una sola persona','Una bóveda de secretos centraliza, controla el acceso y permite rotar sin tocar el código.',['','Esa contraseña compartida sería otro secreto sin trazabilidad ni rotación sencilla.','Base64 es una codificación reversible, no una protección.','No impide que el secreto quede en el historial ni resuelve su rotación.']],
[4,'Se descubre que una clave de API quedó expuesta en un commit público. ¿Qué acción es prioritaria?','Revocar y rotar la clave de inmediato y revisar los accesos hechos con ella','Borrar el commit y asumir que ya no hay riesgo','Renombrar el repositorio','Esperar al próximo ciclo trimestral de rotación','Una clave expuesta debe considerarse comprometida: se invalida y se investiga su uso.',['','Puede haberse copiado ya; borrar no devuelve el secreto a un estado seguro.','Cambiar el nombre no afecta a la clave expuesta.','Esperar deja la clave activa en manos de cualquiera.']],
[2,'Una cuenta de servicio usa la misma contraseña estática desde hace años. ¿Qué mejora reduce el riesgo con menor fricción operativa?','Credenciales gestionadas por una bóveda con rotación automática','Compartir la clave con todo el equipo de operaciones','Darle permisos de administrador para que nunca falle','Desactivar el registro de sus accesos','La rotación automática reduce la ventana de exposición sin intervención manual.',['','Compartirla destruye la trazabilidad.','Más privilegios incumple el mínimo privilegio y agrava el impacto.','Sin registro no se puede detectar un uso indebido.']],
[4,'¿Por qué conviene rotar periódicamente las claves de cifrado?','Limita la cantidad de datos y el tiempo expuestos si una clave se compromete','Hace que el algoritmo sea más rápido','Elimina la necesidad de proteger las claves','Permite usar claves más cortas','Rotar acota el daño de un compromiso no detectado.',['','La rotación no cambia la velocidad del algoritmo.','Las claves siguen requiriendo protección en todo su ciclo de vida.','Claves más cortas serían más débiles, no más seguras.']],
[4,'Se sospecha que una clave privada fue comprometida. ¿Qué debe hacerse?','Revocar el certificado o la clave, generar un par nuevo y reemitir','Seguir usándola y vigilar los logs','Cambiar solo la contraseña del archivo de la clave','Volver a cifrar con la misma clave','Una clave comprometida deja de ser confiable: se revoca y se reemplaza por un par nuevo.',['','Mientras se use, el atacante podría suplantar o descifrar.','Si la clave ya fue copiada, la contraseña local no ayuda.','Cifrar de nuevo con la misma clave mantiene el compromiso.']],
[4,'Una política exige rotar cada año la clave simétrica de un volumen cifrado. ¿Qué debe planificarse para no perder datos?','Re-cifrar los datos con la clave nueva y conservar la antigua hasta terminar','Eliminar la clave anterior antes de generar la nueva','Cambiar solo el nombre de la clave','Desactivar el cifrado durante el cambio','Los datos cifrados con la clave antigua solo se leen mientras esa clave exista.',['','Sin la clave antigua los datos quedarían ilegibles.','Cambiar el nombre no rota nada.','Dejar los datos sin cifrar los expone.']],
[4,'Un atacante explota una falla de un software para la cual aún no existe parche ni firma de antivirus. ¿Qué tipo de amenaza es?','Zero-day','Ataque de diccionario','Phishing','Amenaza interna','Un zero-day aprovecha una vulnerabilidad desconocida para el fabricante y sin parche.',['','El diccionario adivina contraseñas con listas.','El phishing engaña a personas, no explota una falla de software.','La amenaza interna depende de personal con acceso legítimo.']],
[4,'Frente a un zero-day sin parche disponible, ¿qué control compensatorio es más adecuado?','Aislar el sistema en un segmento restringido y reforzar el monitoreo','Esperar al próximo ciclo normal de parches','Desactivar los logs para ahorrar recursos','Confiar solo en las firmas del antivirus','Si no hay parche, se reduce la exposición y se vigila: un control compensatorio.',['','Esperar deja el sistema expuesto sin mitigación.','Sin logs no se detectaría la explotación.','Las firmas aún no existen para esta amenaza.']],
[4,'¿Por qué un antivirus basado en firmas suele fallar contra un zero-day?','Porque la firma se crea después de conocerse la amenaza','Porque los zero-day usan cifrado simétrico','Porque solo atacan equipos sin conexión','Porque el antivirus no inspecciona archivos','Las firmas describen amenazas ya conocidas; lo desconocido no tiene firma.',['','El cifrado utilizado no explica la falta de firma.','Los zero-day suelen explotarse en equipos conectados.','El antivirus sí inspecciona archivos; el problema es qué reconoce.']],
[4,'Un analista recibe un adjunto sospechoso y quiere observar su comportamiento sin poner en riesgo la red. ¿Qué técnica usa?','Ejecutarlo en un entorno aislado (sandbox)','Abrirlo en su equipo de trabajo con el antivirus activo','Reenviarlo a Ventas para que lo validen','Cambiarle la extensión del archivo','El sandbox contiene la ejecución para observar sin afectar producción.',['','Si el antivirus no lo detecta, infectaría su equipo.','Expone a otras personas al mismo riesgo.','Cambiar la extensión no neutraliza el contenido.']],
[4,'¿Qué limitación tiene el análisis de malware en un sandbox?','Algún malware detecta el entorno aislado y oculta su comportamiento','Solo permite analizar archivos de texto','Requiere conectarlo a la red de producción','Elimina la necesidad de otras defensas','Existe malware evasivo que no actúa si detecta que lo observan.',['','Un sandbox analiza ejecutables y otros tipos de archivo.','Se diseña justamente para aislarlo de producción.','Es una capa más; no sustituye a las demás defensas.']],
[4,'Un navegador ejecuta cada pestaña en un proceso aislado con permisos mínimos. ¿Qué beneficio de seguridad aporta?','Contiene el daño si una página maliciosa explota una falla','Cifra automáticamente las contraseñas','Acelera la carga de las páginas','Reemplaza al firewall de la red','El aislamiento limita lo que puede hacer una pestaña comprometida.',['','El cifrado de contraseñas es otra función distinta.','El objetivo es seguridad, no velocidad.','No reemplaza controles de red.']],
[0,'Una política de DLP en portátiles bloquea copiar archivos clasificados a un USB personal. ¿Qué tipo de control es?','Técnico y preventivo','Administrativo y detectivo','Físico y disuasivo','Técnico y correctivo','Es un control lógico que impide el evento antes de que ocurra.',['','No es solo un documento dirigido a personas, y bloquea en lugar de solo detectar.','No es un elemento físico.','Actúa antes de la fuga, no la repara después.']],
[4,'Un DLP de endpoint detecta un número de tarjeta en un correo saliente hacia un dominio personal. ¿Qué acción es coherente con su propósito?','Bloquear o poner en cuarentena el envío y alertar al equipo de seguridad','Permitirlo y borrar el registro','Cifrar solo el asunto del correo','Reiniciar el equipo del usuario','El DLP evita que datos sensibles salgan sin autorización y deja evidencia.',['','Permitir y borrar el log elimina la trazabilidad.','El contenido sensible seguiría saliendo.','Reiniciar no resuelve la fuga.']],
[4,'¿Qué ventaja tiene el DLP en el endpoint frente a uno solo de red?','Controla acciones locales (USB, impresión, portapapeles) aunque el equipo esté fuera de la red corporativa','Elimina la necesidad de clasificar los datos','Funciona sin ningún agente instalado','Bloquea cualquier tipo de malware','El agente ve lo que ocurre en el equipo, incluso con tráfico cifrado o fuera de la oficina.',['','Para decidir qué proteger sigue haciendo falta la clasificación.','El endpoint DLP requiere un agente en el equipo.','Su función es evitar fugas, no sustituir al antimalware.']],
[1,'Un ransomware cifró los servidores y además intentó borrar los respaldos conectados a la red. ¿Qué característica habría protegido las copias?','Respaldo inmutable o aislado, que no se puede modificar ni borrar durante su retención','Un respaldo diferencial diario','Mayor compresión de los respaldos','Compartir la carpeta de copias con todos los administradores','La inmutabilidad (WORM) impide alterar o borrar la copia, incluso con credenciales comprometidas.',['','El tipo de respaldo no impide que se borre.','Comprimir no protege contra la eliminación.','Ampliar el acceso aumenta el riesgo.']],
[1,'Una empresa guarda copias en otra región con bloqueo de objeto de 30 días. ¿Qué logra?','Evitar que la copia se altere o elimine durante ese periodo, aun con credenciales comprometidas','Reducir el RPO a cero','Acelerar la restauración','Eliminar la necesidad de probar la restauración','El bloqueo de objeto es inmutabilidad temporal de la copia.',['','El RPO depende de la frecuencia de las copias, no del bloqueo.','El bloqueo no cambia la velocidad de restauración.','Las restauraciones siguen debiendo probarse.']],
[1,'Aun con respaldos inmutables, ¿qué práctica sigue siendo necesaria?','Probar periódicamente la restauración','Dejar de aplicar parches','Eliminar el plan de continuidad','Abandonar la regla 3-2-1','Una copia inmutable que no se puede restaurar no sirve en una crisis.',['','Los parches siguen siendo necesarios.','El plan de continuidad sigue siendo la base de la respuesta.','La regla 3-2-1 complementa la inmutabilidad.']],
[1,'Un proceso tiene MTD de 8 horas y el equipo estima que recuperarlo toma 10 horas. ¿Qué conclusión es correcta?','El RTO real excede el MTD: hay que rediseñar la recuperación, por ejemplo con un sitio tibio o caliente','Es aceptable porque el MTD es solo orientativo','Basta con aumentar el RPO','Se resuelve con más capacitación de concienciación','El RTO debe caber dentro del MTD; si no, la recuperación no cumple la necesidad del negocio.',['','Superar el MTD implica daño inaceptable.','El RPO trata de pérdida de datos, no de tiempo de recuperación.','La concienciación no acorta una recuperación técnica.']],
[1,'Un sistema crítico tiene un RTO de 30 minutos. ¿Qué sitio alterno es coherente?','Sitio caliente','Sitio tibio','Sitio frío','Copia mensual en cinta','Solo un sitio caliente puede asumir la operación en minutos.',['','Un sitio tibio tarda horas en operar.','Un sitio frío tarda días.','Restaurar desde cinta tarda mucho más que 30 minutos.']],
[1,'En un BIA, el MTD de ventas en línea es de 12 horas y el RTO acordado es de 4 horas. ¿Qué representa la diferencia de 8 horas?','Un margen de seguridad antes de que el daño sea inaceptable','La pérdida de datos aceptable','El tiempo de pruebas anuales','El costo del seguro','El RTO se fija por debajo del MTD para dejar colchón ante imprevistos.',['','La pérdida de datos aceptable la define el RPO.','Las pruebas no se calculan así.','El seguro no se deduce de estos tiempos.']],
[1,'Si el RPO de una base de datos de pedidos es de 15 minutos, ¿qué estrategia es adecuada?','Replicación continua o copias muy frecuentes de las transacciones','Un respaldo completo semanal','Copias mensuales en cinta','Una imagen anual del sistema','Para perder como máximo 15 minutos de datos la copia debe ser casi continua.',['','Se podrían perder hasta siete días de pedidos.','Se podrían perder hasta un mes de datos.','Se podría perder un año de datos.']],
[2,'Un pipeline de CI/CD necesita una credencial de despliegue. ¿Cuál es la mejor práctica?','Inyectarla desde un gestor de secretos con permisos mínimos y caducidad corta','Escribirla en el script del pipeline','Pasarla por el chat del equipo','Usar la cuenta de administrador personal del desarrollador','Los secretos se inyectan en tiempo de ejecución con el menor privilegio posible.',['','Quedaría visible en el repositorio.','El chat no es un lugar controlado y no se puede rotar fácilmente.','Violaría el mínimo privilegio y la trazabilidad.']],
[3,'Un certificado TLS de un servicio crítico caduca cada 90 días y ya causó una caída por olvido. ¿Qué práctica evita repetirlo?','Automatizar la renovación y monitorear su vencimiento','Renovarlo a mano solo cuando falle','Desactivar la validación del certificado en los clientes','Extender la validez a diez años','La automatización y el monitoreo evitan interrupciones sin debilitar la seguridad.',['','Esperar a que falle vuelve a causar la caída.','Desactivar la validación elimina la protección de TLS.','Una validez larga aumenta el daño si la clave se compromete.']],
[4,'Un contrato con datos de clientes se envía a un proveedor externo. ¿Qué control corresponde a la etapa de compartición del dato?','Acuerdo de confidencialidad, canal cifrado y DLP','Sanitización del disco','Archivo en cintas fuera de línea','Eliminación del dato','Compartir exige proteger el dato mientras sale de la organización.',['','La sanitización corresponde a la destrucción.','El archivo es conservación a largo plazo.','Eliminarlo no permite compartirlo.']],
[0,'Un investigador reporta en privado una vulnerabilidad al fabricante y espera el parche antes de publicarla. ¿Qué práctica es?','Divulgación coordinada (responsable)','Venta en el mercado negro','Explotación activa','Divulgación pública inmediata','La divulgación responsable da tiempo al fabricante para proteger a los usuarios.',['','Es ilegal y daña a la sociedad.','Es un acto malicioso.','Expone a los usuarios antes de que exista el parche.']],
[4,'Un webhook incluye una cabecera con un código calculado con una clave compartida y el cuerpo del mensaje. ¿Qué verifica el receptor al recalcularlo?','Que el mensaje no fue alterado y proviene de quien conoce la clave','Que el emisor no pueda negar el envío','Que el cuerpo del mensaje viaje cifrado','Que el receptor tenga un certificado válido','Es un HMAC: integridad y autenticidad, sin no repudio ni cifrado.',['','Con clave compartida cualquiera de los dos pudo generarlo.','Un HMAC no cifra el contenido.','Los certificados no intervienen en un HMAC.']]];

[0,'Dos bases de datos de una empresa muestran direcciones distintas para el mismo cliente. ¿Qué aspecto de la integridad falla?','Consistencia interna entre sistemas relacionados','Disponibilidad','Privacidad','Autorización','La integridad exige que el dato sea idéntico en forma, contenido y significado en todos los sistemas.',['','Los sistemas responden; el problema es que los datos no coinciden.','No se menciona ningún uso indebido de datos personales.','No hay un problema de permisos en el escenario.'],'1.1'],

[4,'¿Cuál de estas es una responsabilidad principal del equipo de respuesta cuando ocurre un incidente?','Determinar el alcance del daño y si se comprometió información confidencial','Despedir al responsable','Negociar con el atacante sin autorización','Ocultar el incidente a la dirección','Evaluar el daño y la confidencialidad es una de sus cuatro responsabilidades.',['','Las sanciones laborales no son su tarea técnica.','No negocia por su cuenta; sigue el plan y la dirección.','Debe informar a la dirección y a las partes interesadas, no ocultarlo.'],'5.3'],
[4,'Un analista del SOC investiga una alerta en una sola estación y concluye que fue una acción normal de un usuario conocido. ¿Qué ocurre con el plan de respuesta?','El plan termina ahí: no se escala porque no hay amenaza','Se escala a la policía','Se activa el plan de recuperación ante desastres','Se avisa a los medios','Si el evento no representa una amenaza, no es necesario escalar.',['','Las fuerzas del orden solo intervienen en eventos graves.','El DRP aplica ante una interrupción mayor.','Comunicar a la prensa no corresponde a una alerta resuelta.'],'5.3'],
[4,'Una alerta de software no permitido por la organización afecta a una sola máquina. ¿Cuál es el siguiente paso previsto en el plan?','Escalar a un gerente para tratar el incumplimiento de la política','Ignorar la alerta','Apagar toda la red','Contratar a un perito externo de inmediato','Un incumplimiento de política se escala a la gerencia correspondiente.',['','No ignorar: hay una violación de política.','Apagar toda la red es desproporcionado para una máquina.','Un perito no es el paso inicial para un caso así.'],'5.3'],
[4,'La alerta afecta a varias computadoras de la red. ¿A quién conviene escalar para aislar el problema?','Al equipo de redes o de sistemas','Al área de ventas','A cada usuario por separado','A ninguna área','Un evento que afecta a más de un equipo puede requerir ayuda para aislarlo técnicamente.',['','Ventas no puede aislar equipos.','Aislarlos usuario por usuario no es eficaz.','No escalar deja el incidente sin contención.'],'5.3'],
[4,'La empresa quiere comprobar si su plan de respuesta funciona sin esperar un incidente real. ¿Qué actividad es adecuada?','Un ejercicio con simulaciones o escenarios, como un tabletop','Esperar un ataque real','Eliminar el plan','Cambiar el antivirus','La capacitación con simulaciones permite practicar la respuesta y la coordinación.',['','Esperar un incidente real expone a la organización sin preparación.','Sin plan no hay respuesta coordinada.','El antivirus no prueba el plan.'],'5.3'],
[4,'El hospital quiere que una brecha crítica no dependa de una sola vía de comunicación. ¿Qué incluye un buen plan de respuesta?','Contemplar que el método principal de comunicación puede no estar disponible','Usar solo el correo corporativo','Evitar documentar contactos','Comunicar lo mismo a todo el mundo','El plan debe prever métodos de respaldo y comunicar según la audiencia.',['','Si cae, no hay forma de avisar.','Sin contactos documentados se pierde tiempo en la crisis.','Parte de la información es confidencial y no va a todos.'],'5.3'],
[4,'Durante un incidente importante el hospital necesita ayudar a las autoridades. ¿Qué conviene tener documentado de antemano?','La información de contacto de las agencias y las fuerzas del orden relevantes','Solo el teléfono del jefe de TI','Nada, se busca durante la crisis','Los contactos de la competencia','La puntualidad es clave; tener los contactos a mano acorta los tiempos.',['','Es insuficiente si ese contacto no está disponible.','Buscarlos en plena crisis hace perder tiempo.','La competencia no es parte de la respuesta.'],'5.3'],
// 2.2 Continuidad y recuperación
[1,'Un sistema se reinicia y vuelve a operar en minutos. ¿Cuándo una organización debe pasar de seguir el plan de incidentes a activar la continuidad del negocio?','Cuando un incidente interrumpe el negocio por un tiempo inaceptable','Siempre que ocurre cualquier evento','Nunca, el plan de incidentes basta','Solo cuando lo pide un cliente','La mayoría de los incidentes son menores; la continuidad entra si la interrupción es inaceptable.',['','La mayoría de los eventos no justifican activarla.','Un incidente mayor excede lo que cubre el plan de incidentes.','La decisión depende de la interrupción, no de un cliente.'],'2.2'],
[1,'¿Qué busca la continuidad del negocio (BC)?','Mantener operando las funciones críticas, aunque sea a capacidad reducida, durante la interrupción','Restaurar todas las funciones al 100 % de inmediato','Reemplazar a TI','Eliminar cualquier riesgo','Se centra en los productos y servicios críticos hasta que el negocio vuelva a la normalidad.',['','Restaurar todo no es su objetivo inmediato.','TI participa pero no es reemplazada.','El riesgo no se elimina, se gestiona.'],'2.2'],
[1,'¿Quién es responsable de crear el plan de continuidad del negocio?','Toda la organización, con apoyo de la alta dirección; no solo el departamento de TI','Solo el departamento de TI','Solo el proveedor de internet','Solo el área de recursos humanos','Es una función del negocio, no solo técnica, y necesita un patrocinador ejecutivo.',['','Afirmar que solo TI es incorrecto: es un esfuerzo del negocio.','Un proveedor no conoce los procesos críticos.','RR. HH. participa, pero no lo desarrolla en solitario.'],'2.2'],
[1,'¿Qué hace falta para que el esfuerzo de planificar la continuidad tenga posibilidades de éxito?','El apoyo de la gerencia ejecutiva o de un patrocinador ejecutivo','Que lo apruebe un solo técnico','Un presupuesto sin personal','Que el plan sea secreto para los empleados','Exige compromiso de personal y recursos financieros que solo respalda la dirección.',['','Un técnico solo no puede comprometer los recursos.','Se necesitan ambos: recursos y personas.','El personal debe conocer su rol en el plan.'],'2.2'],
[1,'¿Qué es un árbol telefónico en la continuidad del negocio?','Un sistema para avisar al personal que, si alguien no está disponible, indica a quién llamar','Un diagrama de la red','Un tipo de respaldo','Un organigrama de la empresa','Permite alertar de forma ordenada con contactos y miembros de respaldo.',['','No describe la red.','No es una copia de datos.','No es un organigrama; es una cadena de notificación.'],'2.2'],
[1,'¿Cuál de estos es un componente común de un plan de continuidad del negocio?','Una lista del equipo del plan con varios métodos de contacto y miembros de respaldo','Las contraseñas de todos los empleados','Solo el inventario de equipos','El historial de ventas','Debe contener la lista del equipo, las listas de verificación y la guía para la gestión.',['','Guardar contraseñas en el plan sería un riesgo grave.','El inventario es útil, pero no es el componente principal.','Las ventas no son parte del plan.'],'2.2'],
[1,'¿Con qué frecuencia debe probarse el plan de continuidad del negocio?','De forma rutinaria, a intervalos definidos y cuando hay cambios importantes','Solo una vez al crearlo','Todos los días','Nunca, hasta que ocurra un desastre','Cada organización fija su frecuencia, pero debe probarlo con regularidad y ante cambios significativos.',['','Un plan que no se vuelve a probar queda obsoleto.','Diariamente es excesivo para la mayoría.','Esperar al desastre es probar demasiado tarde.'],'2.2'],
[1,'El departamento de facturación se incendia. Un análisis de impacto previo mostró que puede pasar una semana sin facturar. La empresa usa un área alterna lista y el servicio al cliente responde consultas. ¿Qué indica?','Una implementación exitosa del plan de continuidad del negocio','Un fallo del plan','Un ataque informático','Que no era necesario un plan','Se mantuvo el negocio sin interrupción importante gracias a la planificación previa.',['','El plan funcionó como estaba previsto.','No hay indicios de un ciberataque.','Fue precisamente el plan lo que permitió seguir operando.'],'2.2'],
[1,'¿Qué es el análisis de impacto al negocio (BIA)?','Un análisis de requisitos, funciones e interdependencias para definir prioridades de contingencia','Una auditoría financiera anual','Una lista de empleados','Un tipo de firewall','Caracteriza qué funciones son críticas y sus dependencias.',['','No es contabilidad.','No es un directorio.','No es un control de red.'],'2.2'],
[1,'¿En qué se distingue la recuperación ante desastres (DR) de la continuidad del negocio?','La DR restaura los servicios de TI y comunicaciones a su operación completa; la BC mantiene las funciones críticas','Son lo mismo','La DR solo se ocupa del personal','La BC solo se ocupa de los servidores','La BC mantiene el negocio y la DR devuelve la tecnología a la normalidad.',['','Son planes distintos aunque se relacionan.','La DR trata de sistemas y comunicaciones.','La BC trata de funciones de negocio, no solo de servidores.'],'2.2'],
[1,'¿Hasta cuándo guía el plan de recuperación ante desastres las acciones del personal?','Hasta restablecer el negocio a las últimas operaciones confiables conocidas','Hasta que pasa la primera hora','Hasta que se cambie al proveedor','Hasta que se publique un informe','El objetivo final es volver al estado de operación fiable conocido.',['','No depende de un tiempo fijo.','Cambiar de proveedor no es el criterio.','El informe es posterior a la recuperación.'],'2.2'],
[1,'En un hospital, se descubrió el compromiso 260 días después y el último respaldo estaba infectado. ¿Qué lección ilustra?','La necesidad de varios niveles de respaldo y periodos de retención adecuados','Que los respaldos no sirven','Que basta un único respaldo reciente','Que no se debe detectar nada','Con un solo respaldo reciente podría restaurarse malware; se necesitan copias más antiguas.',['','Los respaldos sirven, pero hay que diseñarlos bien.','Un único respaldo puede estar infectado.','Detectar a tiempo es parte de la solución.'],'2.2'],
[1,'En una línea de tiempo, ¿cuál es la copia de seguridad que se considera limpia y confiable?','La última anterior al inicio del incidente','La más reciente antes de detectarlo','Cualquiera posterior a la intrusión','La que se hizo durante el ataque','Las copias hechas entre el incidente y su detección están en duda de integridad.',['','Puede estar comprometida si se hizo tras el inicio del incidente.','Las posteriores pueden contener datos falsos o malware.','Se hizo con el sistema ya comprometido.'],'2.2'],
[1,'¿Qué debe hacerse con los respaldos de los sistemas críticos?','Identificar formalmente los sistemas críticos y probar periódicamente sus copias','Hacerlas sin verificarlas','Guardarlas solo en el mismo servidor','Descartarlas tras una semana sin revisar','Un respaldo no probado no garantiza la recuperación.',['','Sin verificación no se sabe si se pueden restaurar.','Si cae el servidor, caen también las copias.','Debe definirse la retención según las necesidades, no al azar.'],'2.2'],
[1,'Los sistemas de un hospital comparten datos de pacientes entre registro, laboratorio y radiología. ¿Qué debe entender el equipo de DR para poder recuperarlos?','El flujo de datos y las dependencias entre los sistemas','Solo el nombre de cada servidor','Únicamente la marca de los equipos','Nada, cada sistema es independiente','Para documentar la recuperación hay que conocer cómo se mueven los datos.',['','Con solo el nombre se ignoran las dependencias.','La marca no determina el orden de recuperación.','Están interconectados; no son independientes.'],'2.2'],
[1,'¿Qué suelen tener los gerentes y el personal de relaciones públicas en el plan de DR?','Documentos de alto nivel fáciles de seguir para comunicar el problema con precisión','Las guías técnicas de los servidores','Nada, no participan','El código fuente de las aplicaciones','Se escriben para cada audiencia: ejecutiva, departamental y técnica.',['','Las guías técnicas son para el personal de TI.','Sí participan en la comunicación.','No necesitan ese nivel de detalle.'],'2.2'],
[1,'¿Qué lección dejó el caso de SolarWinds para la continuidad del negocio y la gestión de riesgos de terceros?','Investigar mejor a los proveedores de software y hardware y entender cuánto depende el negocio de ellos','Evitar usar cualquier proveedor','Confiar siempre en los proveedores reconocidos','Que cambiar de proveedor siempre es posible','Las partes de confianza también pueden ser un vector; hay que evaluar su criticidad.',['','No es viable ni razonable operar sin proveedores.','Confiar sin verificar es justo lo que expuso el caso.','A veces el proveedor es integral y no se puede cambiar de inmediato.'],'2.1']];

// ── Capítulo 3 del PDF (Conceptos de control de acceso): subtemas 3.1, 3.2, 1.4 y registros (5.2) ──
const N13=[
// 3.1 Ciclo de vida de identidades
[2,'Un gerente de contratación solicita crear la cuenta de una persona recién contratada. ¿Qué proceso de gestión de identidad inicia?','Aprovisionamiento de usuarios','Desaprovisionamiento','Auditoría de registros','Segregación de funciones','El aprovisionamiento crea y gestiona el acceso a recursos y sistemas según la solicitud autorizada.',['','El desaprovisionamiento retira accesos, no los crea.','La auditoría revisa lo ya hecho.','La segregación divide tareas críticas entre personas.'],'3.1'],
[2,'Una empleada es ascendida a otro puesto. ¿Qué debe ocurrir con sus permisos?','Se asignan los del nuevo rol y se retira el acceso que ya no necesita','Se conservan todos los anteriores y se suman los nuevos','Se borra la cuenta y se crea otra sin revisar','No cambia nada hasta su próxima evaluación','Los derechos cambian según el nuevo rol y se elimina lo que dejó de ser necesario.',['','Acumular permisos genera aumento de privilegios.','Borrar sin revisar puede perder la pista de auditoría y complica la gestión.','Dejarlo sin cambios mantiene accesos innecesarios.'],'3.1'],
[2,'Un empleado deja la empresa. ¿Qué práctica es la recomendada para su cuenta?','Desactivarla tras la fecha de terminación y eliminarla más tarde, conservando antes la pista de auditoría','Dejarla activa por si vuelve','Compartir la contraseña con su reemplazo','Eliminarla de inmediato sin ninguna copia','Se desactiva y se elimina después para preservar la integridad de los registros y archivos asociados.',['','Una cuenta activa de alguien ausente es un riesgo de uso indebido.','Compartir credenciales rompe la trazabilidad.','Eliminar sin conservar puede destruir registros y archivos necesarios.'],'3.1'],
[2,'Una empleada tomará un año sabático. ¿Qué recomienda el administrador de seguridad para su cuenta?','Desactivarla mientras esté ausente, sin modificarla, para reactivarla fácilmente al volver','Eliminarla y crear otra al regresar','Dejarla activa con la misma contraseña','Cambiarle los permisos a administrador','Desactivarla reduce el riesgo de uso por personas no autorizadas y facilita la reactivación.',['','Obliga a reconstruir permisos y puede perder historial.','Una cuenta activa e inactiva en uso es un blanco fácil.','Aumentar privilegios es lo opuesto a lo recomendable.'],'3.1'],
[2,'Para crear la cuenta de un nuevo empleado de contabilidad, un administrador copia el perfil de un compañero con años en la empresa. ¿Qué riesgo introduce?','Aumento de privilegios: el nuevo usuario hereda permisos que no necesita','Disponibilidad reducida','Pérdida de la línea base','Menor privacidad de los registros','Los perfiles reales acumulan accesos temporales; es mejor partir de roles estándar.',['','No afecta directamente la disponibilidad.','La línea base es una configuración de referencia, no se relaciona aquí.','El problema es de permisos excesivos, no de privacidad de registros.'],'3.1'],
[2,'¿Qué dato necesita el equipo de seguridad de Recursos Humanos para gestionar bien las identidades?','Las altas y bajas de empleados, para preparar y retirar accesos a tiempo','El historial médico de cada empleado','El sueldo de cada empleado','Las contraseñas personales','Saber cuándo entra y sale alguien permite prever y revocar accesos.',['','Es información sensible que no se necesita para esto.','No es relevante para asignar o retirar accesos.','Nadie debe conocer las contraseñas de otros.'],'3.1'],
[2,'¿Qué ventaja tiene definir roles a partir de las descripciones de puesto de Recursos Humanos?','Permite asignar un acceso base por rol y automatizar el ingreso','Elimina la necesidad de revisar accesos','Hace innecesario el principio de mínimo privilegio','Evita auditar los permisos','Clasificar los puestos facilita asignar acceso base y agilizar las aprobaciones.',['','Los accesos siguen requiriendo revisión periódica.','El mínimo privilegio sigue siendo la base.','La auditoría continúa siendo necesaria.'],'3.1'],
[2,'Un bot automatizado accede a una base de datos con la cuenta de administrador de un técnico. ¿Qué principio de gestión de identidades incumple?','Los bots y cuentas de servicio también necesitan identidades gestionadas con sus propios roles y permisos mínimos','Los bots no requieren ninguna identidad','Los bots deben usar siempre cuentas compartidas','Solo las personas necesitan privilegios','Las identidades no humanas deben tener su propio ciclo de vida y acceso acotado.',['','Todo sujeto que accede necesita una identidad propia.','Compartir cuentas impide la trazabilidad.','Los bots también tienen privilegios que deben limitarse.'],'3.1'],
// 3.2 Control de acceso lógico
[2,'En el control de acceso, ¿qué es un sujeto?','Una entidad activa que solicita acceso, como un usuario, un proceso o un programa','Un archivo o una base de datos','La regla que permite el acceso','Una cerradura física','El sujeto inicia la solicitud de un servicio; por eso se considera activo.',['','Eso es un objeto: es pasivo y responde a las solicitudes.','Eso es la regla.','Una cerradura es un control físico, no el sujeto.'],'3.2'],
[2,'¿Qué es un objeto en el control de acceso?','Una entidad pasiva a la que accede un sujeto, como un archivo, un servidor o una impresora','El usuario que inicia la sesión','Una política de seguridad','El administrador del sistema','Los objetos son pasivos, responden a solicitudes y no contienen su propia lógica de control de acceso.',['','El usuario que solicita es el sujeto.','La política no es el recurso accedido.','El administrador es un sujeto.'],'3.2'],
[2,'Un firewall permite el tráfico desde la red interna hacia el exterior pero lo bloquea al revés. ¿Qué representan esas instrucciones en el control de acceso?','Reglas de acceso que permiten o deniegan acceso a un objeto','Objetos pasivos','Sujetos activos','Registros de auditoría','Una regla compara la identidad del sujeto con una lista para permitir o denegar acceso.',['','Los objetos son los recursos, no las instrucciones.','Los sujetos son quienes solicitan acceso.','Los registros documentan eventos, no deciden accesos.'],'3.2'],
[2,'¿Qué significa el principio de mínimo privilegio?','Dar solo el acceso mínimo necesario para que el usuario o programa cumpla su función','Dar acceso total a los administradores','Dar el mismo acceso a todos','Quitar todo acceso por defecto a los gerentes','Se otorga lo imprescindible para el trabajo y nada más.',['','Los administradores también deben limitarse a lo necesario.','Dar el mismo acceso a todos incumple el principio.','El acceso se concede según la necesidad, no se quita por cargo.'],'3.2'],
[2,'Un médico puede ver los datos de sus propios pacientes pero no los de otros. ¿Qué principio aplica?','Mínimo privilegio: acceso solo a lo necesario para su función','Segregación de funciones','Defensa en profundidad','Control dual','El acceso se limita a los datos relacionados con su trabajo.',['','La segregación reparte una transacción entre varias personas.','La defensa en profundidad usa varias capas de controles.','El control dual requiere dos personas para una acción.'],'3.2'],
[2,'Un equipo de TI se agregó al grupo de administradores de dominio para ahorrar tiempo y abrió un adjunto malicioso: el ransomware cifró todo. ¿Qué medida habría limitado el daño?','Gestión de acceso privilegiado: usar privilegios de administrador solo cuando se necesitan','Dar más permisos al equipo de TI','Eliminar el registro de actividad','Desactivar la autenticación multifactor','Si el administrador solo se usa en tareas que lo requieren, el malware no hereda ese poder.',['','Más permisos amplía el alcance del daño.','Sin registro no se detecta ni audita.','La MFA es un refuerzo, no se debe desactivar.'],'3.2'],
[2,'¿Qué ofrece la gestión de acceso privilegiado «justo a tiempo»?','Activar privilegios específicos solo cuando la identidad los necesita y por el tiempo necesario','Mantener los privilegios activos las 24 horas','Dar privilegios permanentes a todos los técnicos','Eliminar las cuentas privilegiadas','Evita que los privilegios estén permanentemente encendidos.',['','Eso es lo que se evita: privilegios estáticos.','Aumenta el riesgo de abuso.','Las cuentas privilegiadas se siguen necesitando, pero controladas.'],'3.2'],
[2,'¿Qué medidas se aplican a las cuentas privilegiadas en comparación con las normales?','Más registro, control de acceso más estricto, verificación más profunda y más auditorías','Menos registro para no sobrecargar','Menos verificación porque son de confianza','Sin MFA para no demorar','El mayor riesgo exige mayor supervisión y exigencia.',['','El registro extenso actúa como disuasión y como control.','La confianza se verifica con más rigor, no menos.','Estas cuentas deben exigir autenticación más rigurosa.'],'3.2'],
[2,'La mesa de ayuda necesita restablecer contraseñas y desbloquear cuentas. ¿Cuál es la mejor práctica?','Delegar solo esos dos permisos, registrarlos y auditarlos contra los tickets','Darles administrador de dominio completo','Compartir una cuenta de administrador','Hacer los cambios sin dejar registro','Permite resolver en la primera llamada sin conceder acceso a todo el dominio.',['','Es más poder del necesario.','Una cuenta compartida impide saber quién hizo qué.','Sin registro no se puede verificar que el usuario lo pidió.'],'3.2'],
[2,'Un empleado puede enviar una factura de pago, pero otra persona debe aprobarla. ¿Qué principio ilustra?','Segregación de funciones','Mínimo privilegio únicamente','Defensa perimetral','Cifrado de extremo a extremo','Ninguna persona debe controlar toda una transacción de alto riesgo de principio a fin.',['','El mínimo privilegio limita permisos; aquí se reparte la transacción.','No se trata de un perímetro.','El cifrado protege datos, no divide tareas.'],'3.2'],
[2,'Dos empleados acuerdan eludir la separación de funciones para cometer un fraude juntos. ¿Cómo se llama?','Colusión','Control dual','Regla de dos personas','Delegación de funciones','La colusión es cooperar deliberadamente para evadir los controles.',['','El control dual es una protección, no una conducta ilícita.','La regla de dos personas es un control que reduce amenazas internas.','Delegar funciones es una práctica legítima.'],'3.2'],
[2,'Una bóveda tiene dos cerraduras con combinaciones distintas y ninguna persona conoce ambas. ¿Qué es?','Control dual','Mínimo privilegio','Control discrecional','Zonas desmilitarizadas','Dos personas deben cooperar para abrirla.',['','El mínimo privilegio limita permisos de una persona.','El DAC deja al propietario decidir el acceso.','Una DMZ es una zona de red, no una cerradura.'],'3.2'],
[2,'¿Qué exige la regla de dos personas?','Que haya al menos dos personas presentes en un área crítica, lo que reduce amenazas internas y protege la vida','Que cada contraseña sea de dos partes','Que se usen dos antivirus','Que los registros se guarden dos años','Nadie queda solo en el área; además, hay asistencia ante emergencias médicas.',['','No trata de contraseñas.','No trata de antivirus.','No tiene que ver con la retención de registros.'],'3.2'],
[2,'Un archivo compartido permite que su creador decida quién lo ve y pueda pasar sus permisos a otros. ¿Qué modelo es?','Control de acceso discrecional (DAC)','Control de acceso obligatorio (MAC)','Control de acceso basado en roles (RBAC)','Control dual','En el DAC el propietario decide los derechos de acceso.',['','En el MAC solo administradores de seguridad fijan las reglas.','El RBAC asigna permisos según el rol.','El control dual exige dos personas.'],'3.2'],
[2,'En un sistema, solo los administradores de seguridad designados pueden cambiar las reglas de acceso, y los usuarios no pueden transferir sus permisos. ¿Qué modelo es?','Control de acceso obligatorio (MAC)','Control de acceso discrecional (DAC)','Control abierto','Control sin reglas','En el MAC las reglas se aplican de forma uniforme y no dependen del propietario.',['','En el DAC el usuario decide.','No existe un modelo abierto de esa forma.','Siempre hay reglas.'],'3.2'],
[2,'Una empresa con alta rotación de personal y muchos empleados con necesidades similares quiere simplificar la gestión de permisos. ¿Qué modelo conviene?','Control de acceso basado en roles (RBAC)','DAC con permisos individuales','Acceso total para todos','Ninguno, gestionar usuario por usuario','El RBAC agrupa permisos por rol y funciona bien con alta rotación.',['','El DAC es difícil de escalar y depende de muchos propietarios.','Violaría el mínimo privilegio.','Usuario por usuario multiplica la carga y los errores.'],'3.2'],
[2,'¿Qué es una lista de control de acceso (ACL) de un objeto?','El conjunto de sujetos que tienen permisos sobre ese objeto','La lista de objetos a los que accede un sujeto','Un registro de eventos','Un plan de recuperación','La ACL se lee por objeto; la lista de capacidades se lee por sujeto.',['','Eso describe la lista de capacidades del sujeto.','Un registro de eventos es una bitácora.','Un plan de recuperación no es una lista de permisos.'],'3.2'],
[2,'¿Qué ocurre justo después de que un sujeto se autentica?','El sistema verifica su autorización para la acción que intenta hacer','Se le conceden todos los permisos','Se elimina su registro','Se cambia su contraseña','Autenticar confirma la identidad; autorizar determina qué puede hacer.',['','Autenticarse no equivale a tener todos los permisos.','Se conserva el registro del acceso.','No hay razón para cambiarla.'],'3.2'],
[2,'Un usuario inicia sesión con usuario y contraseña, y después introduce un código enviado a su teléfono. ¿Qué ilustra?','Autenticación multifactor con algo que sabes y algo que tienes','Dos contraseñas','Control de acceso obligatorio','Segregación de funciones','Combina dos categorías distintas de factor.',['','Un código en el teléfono no es una contraseña más: es un factor de otra categoría.','El MAC es un modelo de control de acceso, no un tipo de factor.','No se divide ninguna transacción entre personas.'],'3.2'],
// 1.4 Controles físicos y defensa en profundidad
[0,'Un centro de datos combina una cerradura en la puerta, reglas técnicas que bloquean el acceso por red y una política que define quién está autorizado. ¿Qué estrategia ilustra?','Defensa en profundidad: varias capas de controles físicos, técnicos y administrativos','Un único control suficiente','Seguridad por oscuridad','Aceptación del riesgo','Se aplican varias contramedidas en capas para cumplir los objetivos de seguridad.',['','Un único control es demasiado arriesgado.','No depende de ocultar información.','La aceptación del riesgo es una opción de tratamiento, no una estrategia de capas.'],'1.4'],
[0,'¿Puede la defensa en profundidad garantizar que no ocurra un ataque?','No: previene o disuade, pero no garantiza que no ocurra un ataque','Sí, siempre','Solo si se usa un firewall','Solo con controles físicos','Reduce la probabilidad y el impacto, pero no ofrece garantías.',['','No hay seguridad absoluta.','Un firewall es solo una capa.','Los controles físicos tampoco bastan solos.'],'1.4'],
[0,'Una evaluación determina que solo dos de las cinco puertas de un archivo necesitan escáner biométrico; las demás se cierran de forma permanente. ¿Qué criterio se aplicó?','Alinear el costo del control con el valor de lo que se protege','Colocar el control más caro en todas partes','Evitar cualquier control','Aceptar todo el riesgo','El costo del control debe ser proporcional al valor del activo.',['','Sería un gasto innecesario.','Se aplicaron controles donde hacían falta.','Se redujo el riesgo con controles apropiados.'],'1.4'],
[0,'Una entrada con dos puertas, de las cuales solo una se abre a la vez, es un:','Mantrap (trampa para personas)','Firewall','Bolardo','Árbol telefónico','Obliga a pasar por dos puertas, de a una, y ayuda a evitar el acceso detrás de otra persona.',['','El firewall es un control de red.','Un bolardo detiene vehículos.','El árbol telefónico es un sistema de notificación.'],'1.4'],
[0,'¿Qué busca el diseño ambiental para prevenir el delito (CPTED)?','Reducir la probabilidad de delitos con diseño pasivo: visibilidad, flujo de personas y señales','Cifrar las comunicaciones','Autenticar usuarios','Detectar malware','Usa métodos organizativos, mecánicos y de diseño natural.',['','Es un enfoque de espacios físicos, no de comunicaciones.','No es un método de autenticación.','No detecta software malicioso.'],'1.4'],
[0,'Un sistema biométrico guarda al principio el rasgo del usuario y luego lo compara cada vez que accede. ¿Cómo se llaman esos dos procesos?','Inscripción y verificación','Cifrado y descifrado','Registro y borrado','Escaneo y eliminación','Primero se inscribe el código biométrico; luego se compara con el presentado.',['','Son procesos criptográficos distintos.','No se trata de borrar datos.','Eliminar no forma parte del flujo.'],'1.4'],
[0,'La dinámica de pulsaciones de teclas, la huella de voz y la dinámica de la firma son ejemplos de biometría:','De comportamiento','Fisiológica','Física pasiva','De hardware','Miden cómo actúa una persona, no cómo es su cuerpo.',['','La fisiológica mide rasgos físicos como huella, iris o retina.','No existe esa categoría en este contexto.','No se refiere al hardware.'],'1.4'],
[0,'¿Qué preocupación suele plantear el uso de escáneres de retina?','Pueden verse como invasión de la privacidad y revelar condiciones médicas','Son baratos y fáciles de inscribir','No son precisos','No usan datos personales','La biometría es información personal y su recolección debe contar con consentimiento.',['','Su despliegue y mantenimiento son costosos.','Se consideran muy precisos.','Son datos de identificación personal.'],'1.4'],
// 5.2 Registros
[4,'Una empresa guarda los registros de acceso físico y de sistemas. ¿Qué medida es necesaria para que sirvan como evidencia?','Protegerlos contra manipulación y contra divulgación no autorizada','Permitir que cualquiera los edite','Borrarlos cada semana','No revisarlos nunca','Los registros pueden ser necesarios para demostrar cumplimiento y para investigaciones forenses.',['','Si se editan, pierden valor probatorio.','La retención debe seguir la política y los requisitos legales.','Sin revisión no se detectan anomalías.'],'5.2'],
[4,'Una empresa no tiene requisitos legales ni comerciales para conservar sus registros. ¿A quién conviene consultar primero sobre cuánto tiempo guardarlos?','Al departamento legal, que suele tener pautas de retención','A los atacantes','Al proveedor de energía','A nadie, se guardan para siempre','Las pautas legales suelen guiar la política de retención.',['','No tiene sentido.','No tiene relación con la retención de registros.','Guardar todo indefinidamente genera costo y exposición.'],'5.2'],
[4,'Un analista nota huecos en las marcas de tiempo de un registro y varios bloqueos de cuenta. ¿Cómo se llama a esos hallazgos?','Anomalías de registro, que pueden ser el primer paso para identificar un problema de seguridad','Respaldos válidos','Datos de línea base','Eventos que se deben ignorar','Una anomalía es cualquier cosa fuera de lo común en los registros.',['','Un respaldo es una copia de datos.','Una línea base es un estado de referencia, no una anomalía.','Ignorarlas puede dejar pasar un incidente.'],'5.2'],
[4,'¿Por qué no conviene registrar absolutamente todo?','Porque la organización se ahogaría con el volumen de datos y no podría detectar lo importante','Porque los registros no sirven','Porque es ilegal','Porque reduce la privacidad siempre','Hay que registrar lo necesario para cumplir los requisitos y poder analizarlo.',['','Los registros son esenciales para detectar y auditar.','No es ilegal registrar eventos de seguridad.','Depende de qué se registre y cómo se proteja.'],'5.2']];

// ── Capítulo 4 del PDF (Seguridad de la red): subtemas 4.1, 4.2, 4.3 y herramientas de detección (5.2) ──
const N14=[
// 4.1 Conceptos de red
[3,'¿Qué dispositivo conoce las direcciones de los equipos conectados y envía el tráfico solo al puerto correcto, en lugar de retransmitirlo a todos?','Conmutador (switch)','Concentrador (hub)','Cable Ethernet','Punto final','Un conmutador dirige el tráfico al dispositivo de destino; el concentrador lo repite a todos.',['','El concentrador retransmite a todos los dispositivos.','El cable solo transporta señales.','Un punto final es un extremo de la comunicación, no un dispositivo que decide rutas.'],'4.1'],
[3,'¿Qué dispositivo determina la ruta más eficiente para el tráfico entre redes?','Enrutador (router)','Concentrador','Servidor de archivos','Impresora de red','Los enrutadores controlan el flujo del tráfico y conectan redes entre sí.',['','El concentrador no es inteligente.','Un servidor entrega información, no encamina entre redes.','No tiene función de encaminamiento.'],'4.1'],
[3,'La dirección 00-13-02-1F-58-F5, asignada en el firmware de la tarjeta de red y cuyos primeros 3 bytes identifican al fabricante, es una:','Dirección MAC','Dirección IP','Máscara de subred','Puerto lógico','La MAC identifica la interfaz de red física y su proveedor.',['','La IP es lógica y no identifica al fabricante.','La máscara define la parte de red de una dirección IP.','Un puerto lógico es un número para distinguir servicios.'],'4.1'],
[3,'¿En qué capa del modelo OSI trabaja un enrutador al enviar paquetes?','Capa 3 (red)','Capa 1 (física)','Capa 5 (sesión)','Capa 7 (aplicación)','Los enrutadores trabajan con paquetes en la capa de red.',['','La capa física maneja bits sobre el medio.','La sesión gestiona el diálogo entre equipos.','La aplicación es la más cercana al usuario.'],'4.1'],
[3,'¿En qué capa del modelo OSI operan TCP y UDP?','Capa 4 (transporte)','Capa 2 (enlace de datos)','Capa 6 (presentación)','Capa 3 (red)','TCP y UDP son protocolos de la capa de transporte.',['','El enlace de datos maneja tramas y direcciones MAC.','La presentación define formatos como JPEG o PNG.','La red maneja direcciones IP y enrutamiento.'],'4.1'],
[3,'Un archivo de imagen JPEG o PNG corresponde a qué capa del modelo OSI?','Capa 6 (presentación)','Capa 4 (transporte)','Capa 2 (enlace de datos)','Capa 1 (física)','La presentación transforma los datos en un formato que cualquier sistema entienda.',['','El transporte maneja TCP/UDP.','El enlace de datos maneja tramas.','La capa física maneja bits.'],'4.1'],
[3,'Cuando los datos descienden por las capas del modelo OSI, ¿qué ocurre?','Se encapsulan: cada capa añade encabezado y posiblemente pie','Se desencapsulan','Se cifran siempre','Se comprimen siempre','La encapsulación agrega encabezados al bajar; la desencapsulación los quita al subir.',['','La desencapsulación es el proceso inverso, al subir.','El cifrado es opcional y no es el efecto de bajar de capa.','No es una compresión automática.'],'4.1'],
[3,'¿Qué distingue a TCP de UDP?','TCP es orientado a conexión; UDP es sin conexión','UDP es orientado a conexión y TCP no','Ambos garantizan la entrega','Ninguno usa puertos','TCP establece una conexión; UDP envía sin establecerla.',['','Es al revés.','UDP no garantiza la entrega.','Ambos usan puertos.'],'4.1'],
[3,'Una dirección IPv4 es de 32 bits y una IPv6 es de:','128 bits','64 bits','48 bits','256 bits','IPv6 amplía el espacio de direcciones a 128 bits.',['','64 bits es la mitad.','48 bits corresponde a una dirección MAC.','No es el tamaño de IPv6.'],'4.1'],
[3,'¿Cuál de estas direcciones pertenece a un rango privado de IPv4?','172.20.5.10','8.8.8.8','200.14.3.1','1.1.1.1','El rango 172.16.0.0–172.31.255.254 es privado.',['','Es una dirección pública.','Es una dirección pública.','Es una dirección pública.'],'4.1'],
[3,'¿Para qué sirve la dirección 127.0.0.1?','Hacer pruebas de la propia máquina (loopback)','Salir a internet','Identificar al router','Reservar la red local','El loopback permite tratar la máquina local como remota para diagnosticar.',['','No sale de la máquina.','El router tiene su propia dirección.','No reserva ninguna red local.'],'4.1'],
[3,'¿Qué ocurre con el tráfico web HTTP en el puerto 80 desde el punto de vista de la seguridad?','Viaja sin cifrar y puede ser espiado; se prefiere HTTPS en el 443','Está cifrado de extremo a extremo','Es el puerto del correo','Solo lo usan los servidores internos','HTTP es texto claro; HTTPS agrega TLS.',['','El cifrado lo aporta HTTPS, no HTTP.','El correo usa otros puertos.','Es el puerto web estándar.'],'4.1'],
[3,'¿Cuál es la alternativa segura a Telnet?','SSH (puerto 22)','FTP (puerto 21)','HTTP (puerto 80)','SMTP (puerto 25)','SSH cifra el tráfico de la terminal remota.',['','FTP envía credenciales en texto claro.','HTTP no está cifrado.','SMTP en el 25 no está cifrado.'],'4.1'],
[3,'Una organización quiere enviar correo por SMTP con cifrado TLS. ¿Qué puerto se recomienda?','587','25','110','23','El 587 es la alternativa segura de SMTP con TLS.',['','El 25 es el SMTP sin cifrar por defecto.','El 110 es POP3 sin cifrar.','El 23 es Telnet.'],'4.1'],
[3,'¿Qué rango de puertos corresponde a los «puertos conocidos»?','0 a 1023','1024 a 49151','49152 a 65535','Todos los puertos','Los puertos conocidos corresponden a los protocolos comunes del núcleo de TCP/IP.',['','Ese rango es el de puertos registrados.','Ese rango es el de puertos dinámicos o privados.','Los puertos se dividen en rangos distintos.'],'4.1'],
[3,'Un atacante captura paquetes en la red para extraer usuarios y contraseñas enviados en texto claro. ¿Qué ataque es?','Rastreo (sniffing) de red','Denegación de servicio','Phishing','Inyección SQL','El rastreo inspecciona paquetes en tránsito y extrae su contenido si no está cifrado.',['','La denegación busca agotar recursos.','El phishing engaña a personas.','La inyección SQL ataca aplicaciones web.'],'4.1'],
[3,'En una red inalámbrica, ¿qué riesgo adicional frente a una red cableada es mayor?','Que las intrusiones pueden hacerse a distancia, sin acceso físico al cable','Que no se puede cifrar','Que no tiene dirección MAC','Que no admite contraseñas','En Wi-Fi el atacante no necesita entrar al edificio para intentar conectarse.',['','Wi-Fi sí puede cifrarse.','Las interfaces inalámbricas también tienen dirección MAC.','Admite contraseñas y otros métodos de autenticación.'],'4.1'],
[3,'Un termostato inteligente y una cámara conectados a la red de una oficina son ejemplos de:','Internet de las cosas (IoT)','Servidores de archivos','Concentradores','Dispositivos de red de almacenamiento únicamente','Los dispositivos IoT conectados amplían la superficie de ataque y requieren aislamiento.',['','No cumplen esa función.','Un concentrador es un dispositivo de red básico.','Son dispositivos conectados, no un almacenamiento.'],'4.1'],
// 4.2 Arquitectura de red segura
[3,'Un servidor web público debe ser accesible desde internet pero aislado de la red interna. ¿Dónde conviene ubicarlo?','En una zona desmilitarizada (DMZ)','Dentro de la red interna sin restricciones','Sin firewall','En la misma VLAN que nómina','La DMZ es un área accesible a visitantes externos pero aislada de la red privada.',['','Expondría la red interna.','Sin firewall quedaría sin control de tráfico.','Mezclaría un servidor público con datos sensibles.'],'4.2'],
[3,'¿Qué es una VLAN?','Una red local virtual que segmenta lógicamente una red mediante conmutadores','Una conexión inalámbrica','Un tipo de firewall','Un cifrado','Las VLAN separan lógicamente la red sin cableado distinto.',['','No se refiere al medio inalámbrico.','No filtra tráfico por sí sola como lo haría un firewall.','No cifra datos.'],'4.2'],
[3,'La nómina se coloca en una VLAN aparte y solo ciertos equipos acceden a sus servidores. ¿Qué principio aplica?','Segmentación de red','Redundancia N+1','Ofuscación de datos','Rotación de claves','Controlar el tráfico entre grupos de dispositivos limita el alcance de un incidente.',['','La redundancia busca disponibilidad.','La ofuscación oculta datos, no separa redes.','La rotación cambia claves, no segmenta.'],'4.2'],
[3,'Una cadena minorista fue vulnerada por una red inalámbrica insegura y, sin segmentación, el atacante se movió libremente hasta los datos de tarjetas. ¿Qué lección ilustra?','Segmentar la red y proteger el acceso inalámbrico para limitar el movimiento lateral','Cifrar solo las copias de seguridad','Eliminar los registros','Aceptar el riesgo sin más','Sin segmentación, un punto débil abre toda la red.',['','No evita el acceso a los sistemas en vivo.','Los registros son necesarios para detectar.','La aceptación del riesgo no corrige la brecha.'],'4.2'],
[3,'¿Qué describe una VPN?','Un túnel de comunicación punto a punto que transporta autenticación y datos por una red no confiable','Un firewall físico','Un antivirus','Un tipo de dirección IP','Permite comunicarse de forma segura por una red como internet, si está bien configurada.',['','Un firewall filtra tráfico, no crea un túnel.','Un antivirus detecta malware.','No es un tipo de dirección.'],'4.2'],
[3,'Según el material, ¿una VPN es siempre un túnel cifrado?','No: es una conexión punto a punto; es segura solo si se eligen y configuran bien los protocolos de seguridad','Sí, siempre','Solo si usa IPv4','Solo si usa Wi-Fi','La VPN puede proporcionar seguridad, pero depende de su configuración.',['','Sin protocolos de seguridad adecuados no hay protección.','No depende de la versión de IP.','No depende de la tecnología inalámbrica.'],'4.2'],
[3,'Un dispositivo personal de un empleado quiere conectarse a la red corporativa. ¿Qué hace un sistema de control de acceso a la red (NAC)?','Verifica que cumpla la política y, si no, lo aísla en cuarentena o lo envía a la red de invitados','Lo admite siempre','Elimina sus datos','Le asigna privilegios de administrador','Solo se admiten dispositivos que cumplan los requisitos de la política.',['','Admitir siempre contradice su propósito.','No borra el contenido del dispositivo.','No otorga privilegios a un dispositivo no verificado.'],'4.2'],
[3,'La red de un hotel exige aceptar una política de uso aceptable antes de dar internet. ¿Qué ilustra?','Un control de acceso a la red (NAC) sencillo','Una DMZ','Un sistema de detección de intrusos','Un respaldo','Condiciona la conexión al cumplimiento de reglas.',['','Una DMZ aloja servidores públicos.','Un IDS detecta actividad sospechosa.','Un respaldo es una copia de datos.'],'4.2'],
[3,'¿Qué enfoque propone la confianza cero (zero trust)?','Verificar y autorizar cada acceso a activos y datos, sin confiar solo en el perímetro','Confiar en todo dentro de la red','Eliminar la autenticación','Usar un solo firewall perimetral','Se enfoca en los activos o datos, no solo en el perímetro; la ventana de confianza se acorta.',['','Una vez dentro, se tendría libertad de movimiento: justo lo que evita.','Exige más autenticación, no menos.','Un único firewall es el modelo tradicional de perímetro.'],'4.2'],
[3,'¿En qué se diferencia la microsegmentación de la confianza cero?','La microsegmentación agrega perímetros internos; la confianza cero se centra en proteger activos y datos directamente','Son lo mismo','La microsegmentación elimina los firewalls','La confianza cero solo usa VLAN','La microsegmentación divide la red; la confianza cero construye puertas efectivas en cada activo.',['','Se relacionan pero no son idénticas.','Suele usar firewalls en casi todos los puntos de conexión.','No se limita a VLAN.'],'4.2'],
[3,'Controles en datos, aplicación, host, red interna, perímetro, seguridad física y políticas forman parte de:','La defensa en profundidad, con capas de protección','Un único control perimetral','El análisis de riesgos cuantitativo','Una auditoría externa','Cada capa añade barreras para que el fallo de una no deje todo expuesto.',['','El perímetro es solo una capa.','El análisis de riesgos es otra actividad.','La auditoría evalúa controles, no los organiza en capas.'],'4.2'],
[3,'Un servidor web en la DMZ consulta una base de datos situada al otro lado del firewall. ¿Qué logra esta separación?','Que el servidor expuesto no tenga acceso directo a la red interna con los datos sensibles','Que la base de datos esté disponible para todo internet','Que se elimine el firewall','Que no hagan falta reglas','El firewall controla qué tráfico llega a la base de datos.',['','Eso expondría los datos.','El firewall es lo que filtra el tráfico entre ambos lados.','Las reglas son lo que define qué se permite.'],'4.2'],
[3,'Un firewall recibe tráfico entrante que dice venir de una dirección interna de la propia red. ¿Qué debe hacer?','Denegarlo, porque puede ser suplantación de dirección','Permitirlo porque parece interno','Reenviarlo al servidor de correo','Cifrarlo','El tráfico interno normalmente no entra por el firewall; esa señal indica posible suplantación.',['','Confiar en la dirección sería caer en el engaño.','No hay razón para enviarlo al correo.','Cifrarlo no resuelve el origen falso.'],'4.2'],
// 4.3 Nube
[3,'Una empresa usa correo y herramientas de oficina que entrega un proveedor por internet, sin administrar servidores. ¿Qué modelo de servicio es?','Software como servicio (SaaS)','Infraestructura como servicio (IaaS)','Plataforma como servicio (PaaS)','Nube privada','En SaaS el cliente consume la aplicación; el proveedor gestiona la infraestructura.',['','IaaS entrega recursos de cómputo y red básicos.','PaaS entrega un entorno para construir software.','Nube privada es un modelo de despliegue, no de servicio.'],'4.3'],
[3,'Un equipo de desarrollo quiere un entorno con herramientas y entorno de ejecución para construir y operar su propio software. ¿Qué modelo conviene?','Plataforma como servicio (PaaS)','Software como servicio (SaaS)','Una red privada virtual','Un concentrador','PaaS ofrece componentes y herramientas para desarrollar y desplegar aplicaciones.',['','SaaS entrega una aplicación terminada.','Una VPN es un túnel de comunicación.','Un concentrador es hardware de red.'],'4.3'],
[3,'Una empresa alquila máquinas virtuales, almacenamiento y redes para instalar sus propios sistemas operativos. ¿Qué modelo es?','Infraestructura como servicio (IaaS)','Software como servicio (SaaS)','Plataforma como servicio (PaaS)','Nube comunitaria','IaaS entrega los recursos informáticos básicos.',['','SaaS entrega aplicaciones.','PaaS entrega un entorno de desarrollo.','Nube comunitaria es un modelo de despliegue.'],'4.3'],
[3,'¿Qué modelo de despliegue de nube presta servicios a una sola organización?','Nube privada','Nube pública','Nube híbrida','Nube comunitaria','La nube privada se construye para una sola organización.',['','La pública se ofrece a muchos clientes.','La híbrida combina dos modelos.','La comunitaria sirve a un grupo con intereses afines.'],'4.3'],
[3,'Una empresa mantiene sus cargas críticas en una nube propia y usa una nube pública para cargas no críticas. ¿Qué modelo es?','Nube híbrida','Nube comunitaria','Solo nube pública','Solo nube privada','Combina una nube privada y una pública.',['','La comunitaria comparte entre organizaciones afines.','Usa también recursos propios.','También usa una nube pública.'],'4.3'],
[3,'Hospitales de una región comparten una nube pensada para sus necesidades comunes. ¿Qué modelo es?','Nube comunitaria','Nube pública','Nube privada','Nube híbrida','La comunitaria se desarrolla para una comunidad con intereses similares.',['','La pública es genérica para muchos clientes.','La privada es de una sola organización.','La híbrida combina dos modelos.'],'4.3'],
[3,'¿Qué documenta un SLA en la nube?','El nivel mínimo de servicio, la disponibilidad, la seguridad y los remedios ante incumplimientos','Solo el precio','Las contraseñas del proveedor','El código fuente del servicio','Es un contrato que establece parámetros, niveles mínimos y remedios.',['','Incluye mucho más que el precio.','Nunca incluye contraseñas.','El código fuente no forma parte de un SLA.'],'4.3'],
[3,'Una pyme contrata a un proveedor que monitorea su firewall y clasifica los eventos de seguridad. ¿Qué tipo de servicio es?','Servicio gestionado de detección y respuesta (MDR) de un proveedor de servicios gestionados','Un centro de datos propio','Un respaldo inmutable','Un NAC','Un MSP puede ofrecer monitoreo y respuesta como servicio.',['','Es un servicio de un tercero, no infraestructura propia.','El respaldo no monitorea eventos.','El NAC controla qué se conecta a la red.'],'4.3'],
[3,'¿Qué debe afirmar un buen SLA de nube respecto a los datos del cliente?','La propiedad de los datos y los detalles de devolución y destrucción','Que el proveedor es dueño de los datos','Que no hay obligación de devolverlos','Que se conservan para siempre','El cliente debe conservar la propiedad y saber cómo se devuelven o destruyen.',['','Sería contrario a los intereses del cliente.','Debe existir una cláusula al respecto.','Conservarlos indefinidamente no es una garantía de protección.'],'4.3'],
// 5.2 Herramientas de detección
[4,'Un sistema compara en tiempo real la actividad de una red y envía una alerta cuando detecta un intento de intrusión, pero no bloquea el tráfico. ¿Qué es?','Un sistema de detección de intrusos (IDS)','Un sistema de prevención de intrusos (IPS)','Un cortafuegos de próxima generación','Un VPN','El IDS identifica y alerta; no bloquea por sí mismo.',['','El IPS se coloca en línea y bloquea el ataque.','Un firewall de nueva generación puede integrar un IPS, pero no es el caso descrito.','Una VPN crea un túnel de comunicación.'],'5.2'],
[4,'¿Cuál es la diferencia clave entre un IDS y un IPS?','El IPS se coloca en línea con el tráfico y puede bloquearlo','El IDS bloquea y el IPS solo alerta','Son idénticos','El IPS solo funciona en el host','Al estar en línea, el IPS decide qué tráfico reenviar y cuál bloquear.',['','Es al revés.','Se diferencian en su capacidad de actuar.','También existen IPS de red (NIPS) y de host (HIPS).'],'5.2'],
[4,'¿Qué puede detectar un IDS de host (HIDS) que un IDS de red (NIDS) no puede?','Anomalías dentro del propio equipo, como archivos comprometidos y procesos del atacante','Todo el tráfico cifrado de la red','El tráfico de todos los equipos a la vez','Los ataques sin ningún indicio','El HIDS examina procesos y registros de un único equipo con más detalle.',['','El NIDS tampoco puede inspeccionar el contenido cifrado.','Eso es ventaja del NIDS, que monitorea una red.','Nada detecta ataques sin ningún indicio.'],'5.2'],
[4,'Una herramienta recopila registros de muchas fuentes de la empresa, los correlaciona y genera alertas, pero no bloquea nada. ¿Qué es?','Un SIEM','Un IPS','Un firewall','Un antivirus','El SIEM agrega y correlaciona eventos para identificar amenazas.',['','El IPS bloquea.','El firewall filtra tráfico por reglas.','El antivirus detecta y detiene malware en el equipo.'],'5.2'],
[4,'Según el material, ¿qué herramienta identifica y también previene amenazas?','Un sistema de prevención de intrusos (IPS) y el antimalware','Solo el SIEM','Solo un escáner de vulnerabilidades','Solo el IDS','El IPS y el antimalware pueden detectar y detener; el SIEM, el IDS y los escaneos solo identifican.',['','El SIEM identifica mediante correlación, pero no toma medidas preventivas.','El escáner identifica debilidades.','El IDS solo alerta.'],'5.2'],
[4,'Un analista recibe una alerta de que se ejecutó un escáner de IP portable desde una carpeta temporal de un usuario. ¿Qué debe hacer primero?','Contactar al usuario para saber si lo está ejecutando y tiene una razón legítima','Borrar el equipo','Ignorarla siempre','Bloquear toda la red','Muchas alertas dependen de la interacción humana; el contexto determina si es malicioso.',['','Borrar sin verificar es desproporcionado.','Puede ser reconocimiento de un atacante; ignorarla es arriesgado.','Bloquear toda la red afectaría a todos sin motivo.'],'5.2'],
[4,'Una empresa de dos o tres personas de seguridad no logra ajustar su SIEM y recibe demasiados falsos positivos. ¿Qué opción plantea el material?','Subcontratar a un SOC de terceros','Desactivar los registros','Comprar más herramientas sin configurar','No monitorear nada','Un SOC externo aporta capacidad de ajuste y análisis.',['','Sin registros no hay detección.','Más herramientas sin ajuste agravan el problema.','No monitorear deja a la empresa a ciegas.'],'5.2'],

[4,'Un servidor web ejecuta servicios y protocolos que no necesita. ¿Qué práctica reduce el riesgo?','Deshabilitar los servicios y protocolos innecesarios','Mantenerlos por si acaso','Abrir más puertos','Compartir las credenciales','Lo que no se ejecuta no puede explotarse.',['','Cada servicio activo es una posible vulnerabilidad.','Más puertos amplía la superficie de ataque.','Compartir credenciales rompe la trazabilidad.'],'5.4'],
[4,'¿Por qué es importante aplicar parches de forma regular?','Porque los proveedores corrigen fallas de seguridad, pero solo ayudan cuando se aplican','Porque los parches cambian el color de la interfaz','Porque eliminan la necesidad de un firewall','Porque aumentan la superficie de ataque','La gestión de parches mantiene sistemas y aplicaciones actualizados.',['','Su propósito es corregir errores y vulnerabilidades.','Siguen haciendo falta otras capas.','Los parches reducen vulnerabilidades, no las aumentan.'],'5.4'],
[4,'En un centro de datos, ¿por qué se monitorea la temperatura con sensores en la parte superior, media e inferior del rack?','Para medir la temperatura real de funcionamiento y mantenerla en el rango recomendado','Para ahorrar electricidad solamente','Para cifrar los equipos','Para sustituir al firewall','El rango recomendado ayuda a maximizar el tiempo de actividad y la vida del hardware.',['','Es para disponibilidad y vida útil, no solo ahorro.','No se relaciona con el cifrado.','No reemplaza controles de red.'],'5.4']];
